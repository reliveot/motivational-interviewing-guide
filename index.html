</style></head><body><header><div class="head-inner"><div class="eyebrow">吱吱復健 · 楊昀霖職能治療師｜教學資源</div><h1>動機式晤談與復健溝通</h1><p>先理解，再選擇下一步。從照顧者的日常溝通，到治療師的理論、臨床判斷與案例練習。</p><div class="mode"><button data-mode="family" class="active">家屬與照顧者版</button><button data-mode="therapist">治療師專業版</button></div></div></header><div class="shell"><button class="btn mobile-toggle" id="menuToggle" aria-controls="sidebar" aria-expanded="false">☰ 開啟章節目錄</button><aside id="sidebar" aria-label="章節導覽"></aside><main id="main" class="main" tabindex="-1"></main></div><footer class="footer"><strong>設計與整理｜吱吱復健・楊昀霖職能治療師</strong><p>分享復健、生活自理與照顧相關資訊。<a href="https://reliveot.github.io/card/" target="_blank" rel="noopener">認識治療師與更多復健資源 ↗</a></p><p>本教材由 AI 協助整理，內容可能有錯誤、遺漏或解讀不完整之處，使用時應核對原始來源並配合專業判斷。動機式晤談是可供參考的溝通方法之一，是否使用需視情境而定，不能保證改變意願或改善功能。本教材不能取代專業評估、正式 MI 技能訓練與個別化臨床判斷。</p></footer><script id="site-data" type="application/json">{"chapters": {"family": [{"id": "F章1", "index": 1, "title": "先弄清楚：今天為什麼不想練？", "html": "<p><strong>讀完能做的事：<\/strong> 把「不願意」拆成可以詢問的具體問題，知道何時先停下來。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>家人說「今天不要」，可能是痛、累、怕跌倒、聽不懂要求、覺得沒有用，或只是現在不想做。單看一句話無法判斷原因。同一個人上午能做、下午做不來，也不代表故意不配合。<\/p>\n<p>先看與平常是否不同，再問當下的感受。若是突然出現新的無力、口齒不清或意識變化，應停止練習並立即尋求緊急醫療協助；溝通練習不能延誤處置。這是一般安全原則，不是MI技巧。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<ol>\n<li>暫停原本的要求：「先停一下。」<\/li>\n<li>一次問一件事：「現在是哪裡不舒服？」語言表達困難時，可讓本人指位置或選擇「痛／累／其他」，並確認沒有誤解。<\/li>\n<li>聽到原因後先處理原因。疼痛、疲倦或器材問題，依原有照護計畫處理或回報，不能只改說法繼續催。<\/li>\n<li>沒有急迫疑慮、本人也願意時，才討論今天要暫停、改時間，或向治療師詢問其他做法。<\/li>\n<\/ol>\n<h3>對話示範<\/h3>\n<p>家人：「我不要站，站起來很不舒服。」<br />\n照顧者：「先不站。你說的不舒服，是頭暈，還是哪裡痛？」<br />\n家人：「剛起來會暈。」<br />\n照顧者：「那先停止。我把發生的時間和情況告訴醫療人員，確認怎麼處理。」<\/p>\n<p>這段對話沒有練到站立，但避免把身體症狀當成態度問題。即使家人說「休息就好」，若症狀新出現、持續或明顯，也需要依嚴重度尋求評估。<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>一直問「為什麼不練」容易變成質問。可改為描述：「剛才還好，現在你說不舒服，我想先知道發生什麼。」練習F01處理疲勞；F02處理疼痛。日常回報用「何時、做什麼、出現什麼、停止後如何」四項即可，不替本人診斷。<\/p>\n<p><strong>何時找人：<\/strong> 新症狀、反覆疼痛、活動能力明顯改變，或無法確認安全時，找醫療團隊。依據：一般安全分流與支持性溝通；此流程為本教材整合，非經驗證量表。[S3、S9]<\/p>\n"}, {"id": "F章2", "index": 2, "title": "聽到「練了沒用」時，先接住哪一部分？", "html": "<p><strong>讀完能做的事：<\/strong> 回應失望而不保證恢復，並讓家人修正自己的理解。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>「都沒有進步」可能是在描述功能，也可能在說「我花這麼多力氣，還是過不了想要的生活」。立刻列舉進步，對方有時會覺得自己的難過被跳過；完全同意「都沒用」，又會把尚未評估的結論說死。<\/p>\n<p>可以先指出聽見的感受，再確認。理解失望，不等於判定治療無效，也不等於要求本人變得正向。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<p>先回應具體落差：「你希望練完能比較容易穿衣服，現在還是很吃力，很失望。」停一下，讓對方回答。若他說「我是累，不是失望」，就改口：「我剛才理解錯了，現在最困擾你的是太累。」對方願意再談時，再問「你覺得哪一件事最沒有改變？」<\/p>\n<p>如果要談觀察到的進步，先問是否想聽，再描述條件：「今天穿袖子時，你自己把手往前移了一點；衣服仍需要我拉。」具體表現可以幫助討論，不能用來反駁他的整體感受。<\/p>\n<h3>對話示範<\/h3>\n<p>家人：「上次明明比較好，今天又一樣，練了有什麼用？」<br />\n照顧者：「你很在意進步能不能留下來，今天這樣讓你很灰心。」<br />\n家人：「對，我不想一直期待又失望。」<br />\n照顧者：「現在想先說說，還是下次一起問治療師，怎麼看這種起伏？」<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>「至少你還能走」「別人比你更嚴重」容易讓人不敢再說。也不必每次都說很長的感受句；一句「今天真的很挫折」加上安靜陪伴，有時就足夠。F03練習面對表現起伏；F04練習回應與過去自己的比較。<\/p>\n<p><strong>日常應用：<\/strong> 一次只談一件具體困難，讓治療師協助確認活動條件、協助程度與評估方式。<strong>何時找人：<\/strong> 情緒低落持續影響睡眠、食慾、生活或出現安全疑慮時，請專業人員評估；家屬不自行診斷憂鬱症。依據：反映式傾聽的教學轉譯，與一般臨床轉介原則。[S3、S4、S9]<\/p>\n"}, {"id": "F章3", "index": 3, "title": "提供可以真的選擇的下一步", "html": "<p><strong>讀完能做的事：<\/strong> 問出本人是否願意談，提供少量可行選項，接受暫不行動。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>「要練五分鐘還是十分鐘？」看似有選擇，但若本人連練習都沒答應，仍可能感到被逼。選擇要包括目前合理且安全的替代方式，例如先談一談、換時間或今天先暫停。急迫的醫療處置依醫療流程處理，不用選擇遊戲延誤。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<p>先問：「現在方便談一下今天的安排嗎？」如果願意，問他在意的事情，再提出一至兩個已由治療師確認可行的做法。沒有適合的選項時，不必臨時發明動作；可先蒐集問題，請治療師調整。<\/p>\n<p>說「不要」後不連續追問到他答應。可以確認是否希望改天再提；若也不願意，就結束這次邀請。反覆拒絕需要重新討論原因與計畫，不用家屬每天重演說服。<\/p>\n<h3>對話示範<\/h3>\n<p>照顧者：「你昨天說想自己拿遙控器。今天想談怎麼試嗎？」<br />\n家人：「現在不想練。」<br />\n照顧者：「好。要不要晚點再問你一次？還是今天先不提？」<br />\n家人：「吃完午飯再說。」<br />\n照顧者：「好，吃完再確認，到時也可以說不要。」<\/p>\n<p>這是協調時間，尚未代表同意活動。午飯後仍需重新確認意願與狀態。<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>「我都讓你選了，你還想怎樣」會取消原本的選擇。F05練習延期後仍被拒絕；F06練習把生活期待和可行活動接起來。日常可先約定提醒方式，例如由本人示意、每日固定問一次，避免整天催促。<\/p>\n<p><strong>何時找人：<\/strong> 家屬擔心停止練習會有健康風險，或雙方對必要照護有分歧時，請醫療團隊說明風險、替代方案與後續安排。依據：支持自主與合作的原則；提醒頻率為可協商的例子，不是標準處方。[S1、S3]<\/p>\n"}, {"id": "F章4", "index": 4, "title": "活動中怎麼幫，才不會越幫越吵？", "html": "<p><strong>讀完能做的事：<\/strong> 先確認想要的協助，給具體回饋，發現超出能力時調整任務。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>「你幫我做」可能是需要一部分協助、太累，或不知道下一步。照顧者也可能因為怕跌倒或趕時間而全部接手。協助多少，要看安全、能力、當下時間和本人意願，不能用「全部自己來」作為唯一標準。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<p>先確認：「你要我幫哪一步？」本人說不清楚時，把活動拆成可見的小步驟，提供簡單選項。協助方式以治療師示範過的安全方法為限；移位、站立、上肢牽拉等不可只靠文字自行嘗試。非急迫情況下一次給一個提示，留時間反應，避免多人同時喊。<\/p>\n<p>回饋說明實際發生的事情：「剛才你自己把毛巾移到桌邊，我只有扶住盆子。」再問他的感受。這比「你看，你明明就可以」更不容易變成責備。<\/p>\n<h3>對話示範<\/h3>\n<p>家人：「這衣服太難了，你幫我。」<br />\n照顧者：「你想讓我幫忙拉衣服，還是先休息？」<br />\n家人：「幫我拉一下，其他我試。」<br />\n照顧者：「好，你準備好再告訴我。」<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>安全提醒可以直接、簡短，但活動結束後才討論容易分心的長篇解釋。若趕著出門，可以說明今天先協助完成，另找時間練，不把時間壓力算成患者不努力。F07處理求助；F08處理連續糾正。<\/p>\n<p><strong>日常應用：<\/strong> 與治療師確認「本人做哪一步、旁人幫哪一步、什麼情況停止」。<strong>何時找人：<\/strong> 不知道如何扶、協助時疼痛、反覆差點跌倒，或雙方對能力認知差很多。依據：傾聽原則加活動分析；活動分析與安全協助不屬MI本身。[S3；實務整合]<\/p>\n"}, {"id": "F章5", "index": 5, "title": "一直不願意，下一步不必一直勸", "html": "<p><strong>讀完能做的事：<\/strong> 整理拒絕的模式，與專業人員重新討論計畫，辨認表達障礙。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>連續幾天沒練，需要了解「拒絕的是什麼」。有人願意自己吃飯，卻不想做重複動作；有人想做，但聽不懂太長的指令。拒絕一項安排，不足以代表拒絕所有生活活動，也不能因此判定缺乏病識感或失去決策能力。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<p>整理具體觀察：「這三天，早餐後提起站立時，他都說膝蓋不舒服；坐著摺毛巾願意。」向團隊詢問是否需要調整活動、時間、環境、疼痛處理或溝通方式。避免只回報「他不配合」。如果本人願意，一起聽他對計畫的看法。<\/p>\n<p>聽不懂時，句子縮短、一次一件事，必要時用圖片或示範。讓本人用指、寫字或可靠的是非回答表達，再確認意思。溝通支持仍無法確認時，尋求語言治療師及相關團隊協助。<\/p>\n<h3>對話示範<\/h3>\n<p>照顧者：「這幾次提到站，你都說不要。你願意讓我把膝蓋痛的事跟治療師說嗎？」<br />\n家人：「可以，但不要叫我硬站。」<br />\n照顧者：「我會把這句也說清楚，請他先評估。」<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>「找專業」不等於找另一個人來說服。F09練習反覆拒絕的具體回報；F10練習外籍看護與語言不通。回報後要確認誰會聯絡、何時回覆，在等待期間遵循既有安全計畫。<\/p>\n<p><strong>何時找人：<\/strong> 持續低落、睡眠或食慾明顯改變、疑似理解或表達障礙、照護安全或資源不足。若有立即危險，啟動緊急協助。依據：一般臨床分流；MI不能代替評估。[S3、S9]<\/p>\n"}, {"id": "F章6", "index": 6, "title": "照顧者支持：把「我也累了」變成能被理解的需要", "html": "<p><strong>讀完能做的事：<\/strong> 說出負荷、提出具體協助、保留自己的休息界線。<\/p>\n<h3>常見情境與理解方式<\/h3>\n<p>照顧者疲累可能與夜間中斷睡眠、工作衝突、照顧技巧、金錢或家庭分工有關。學會更溫柔的說法，未必能解決人力不足。本章的練習對象是照顧者自己與支持者，不要求照顧者再扮演諮商者安撫另一名家屬。<\/p>\n<h3>實際可以怎麼做<\/h3>\n<p>先挑最吃力的一件事，描述它如何影響生活，再提出可討論的需要。例如：「這週我每天晚上都醒好幾次，白天快撐不住。我需要有人和我一起討論夜間照顧，安排能休息的時段。」需求也可以是請人陪同與個管師討論；不必先找好所有答案才求助。<\/p>\n<p>若家人無法接手，繼續詢問可用服務與替代安排，不能假設說清楚就一定有人幫。家庭看護工也有休息與工作界線；家屬與服務團隊應協助處理安排，不把患者是否練習當作看護工作表現的唯一依據。<\/p>\n<h3>對話示範<\/h3>\n<p>照顧者：「我每天催他，吵完還要照顧，真的很累。」<br />\n支持者：「你已經忙一整天，還得扛著提醒練習的壓力。現在最需要有人分擔哪件事？」<br />\n照顧者：「先不要叫我每天監督。」<br />\n支持者：「我們一起請治療師把必要照護、可以自行選擇的練習及提醒方式分清楚。」<\/p>\n<h3>容易遇到的困難與練習<\/h3>\n<p>「放輕鬆」沒有處理任務分配。F11練習向家人提出分工；F12練習向個管師說明夜間負荷。若沒有得到協助，結局應記錄尚未解決的需要，不能寫成已經釋懷。<\/p>\n<p><strong>何時找人：<\/strong> 疲累已影響照顧安全、持續失眠、衝突升高或覺得快失去控制時，盡快聯絡家人、個管師或醫療團隊安排支援；立即危險優先求援。依據：照顧者支持的實務整合，不宣稱為MI效果。[S9；實務整合]<\/p>\n<hr />\n<h1>第二部｜治療師教材<\/h1>\n"}], "therapist": [{"id": "T章1", "index": 1, "title": "理解改變意願：先辨認正在處理哪一種問題", "html": "<p><strong>學習目標：<\/strong> 區分動機矛盾、能力與環境障礙、維持語句及互動不協調，選擇下一步。<\/p>\n<h3>概念與判斷<\/h3>\n<p>MI可理解為一起談清楚「要不要、為什麼、怎麼改變」的溝通方式。較正式地說，本稿以合作、具有方向的對話來支持本人對特定改變的動機與投入，並尊重其選擇；這是教學概述，不是第四版定義的逐字翻譯。一般陪伴可以沒有改變方向，MI則需要留意共同焦點及改變語言。尚未形成共同方向時，先建立關係與聚焦。[S1、S3]<\/p>\n<p>矛盾（ambivalence）是同時有想改變與想維持的理由。維持語句（sustain talk）表達傾向維持目標行為現狀的內容；互動不協調（discord）指合作關係出現摩擦。兩者可以共存，也不能由單句推斷人格。Fixing reflex在本稿譯為「急於替對方解決的反射」：助人者看見問題後，迅速轉向說服、矯正或代替安排的衝動。這份好意需要被覺察，並不表示專業建議本身有錯。[S1、S2]<\/p>\n<h3>同一句拒絕，四種下一步<\/h3>\n<table>\n<thead>\n<tr>\n  <th>已知資訊<\/th>\n  <th>暫時的理解<\/th>\n  <th>下一個操作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>「想自己洗澡，但練習很累」<\/td>\n  <td>對練習有矛盾<\/td>\n  <td>反映兩個理由，確認想談哪一部分<\/td>\n<\/tr>\n<tr>\n  <td>「你每次都沒問我，就叫我做」<\/td>\n  <td>合作出現摩擦<\/td>\n  <td>承認自己的互動方式，重新取得談話同意<\/td>\n<\/tr>\n<tr>\n  <td>「想練，但沒人幫我把桌子移過來」<\/td>\n  <td>環境阻礙<\/td>\n  <td>檢查環境及安排可及性<\/td>\n<\/tr>\n<tr>\n  <td>「今天突然握不住，講話也不清楚」<\/td>\n  <td>新發症狀<\/td>\n  <td>優先醫療分流，不繼續動機探索<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>操作示範<\/h3>\n<p>患者：「我說我不想練，你根本沒聽。」<br />\n治療師：「你已經說不想做，我還繼續安排，讓你覺得意見沒被聽進去。剛才我推得太快了。」<br />\n患者：「我只是不要一來就站。」<br />\n治療師：「你願意談談今天希望先處理什麼嗎？」<\/p>\n<p>關鍵是先回應互動，再確認焦點。如果患者說「今天完全不想談」，就停止邀請，處理必要照護與後續聯絡；不能把道歉當成繼續要求配合的前奏。<\/p>\n<h3>練習與限制<\/h3>\n<p>患者：「我沒力，不要一直說我沒動機。」可以回應「你覺得我把身體的困難當成意願問題」，也可以詢問無力的發生時間。若無力是新出現，評估優先；若已排除急迫變化、焦點在被誤解，修復關係優先。兩種回應用途不同。<\/p>\n<p>常見錯誤是把所有未完成訓練都編碼為維持語句。先明確寫出目標行為、已知障礙與待查資訊。案例T01、T02、T13。理論來源[S1–S4]；分流表屬原創教學整合，並非診斷工具。<\/p>\n"}, {"id": "T章2", "index": 2, "title": "MI精神與四任務：此刻的對話要做什麼？", "html": "<p><strong>學習目標：<\/strong> 將合作、接納、關懷、賦權落實為可觀察的行為，並在四任務間移動。<\/p>\n<h3>定義與白話操作<\/h3>\n<p>第四版以partnership、acceptance、compassion、empowerment描述MI精神；以engaging、focusing、evoking、planning描述四任務。本稿分別使用建立關係、聚焦、喚起、規劃的工作譯名。四任務會交錯與返回，並非每次都必須走完的線性流程。[S1、S2]<\/p>\n<table>\n<thead>\n<tr>\n  <th>精神<\/th>\n  <th>在復健會談中的做法<\/th>\n  <th>可辨認的偏差<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>合作<\/td>\n  <td>先提出治療師擔心的問題，再邀本人提出議題<\/td>\n  <td>形式上提問，實際只准一個答案<\/td>\n<\/tr>\n<tr>\n  <td>接納<\/td>\n  <td>容許本人說「暫時不要」，繼續提供必要資訊<\/td>\n  <td>把拒絕解釋為不值得服務<\/td>\n<\/tr>\n<tr>\n  <td>關懷<\/td>\n  <td>根據本人福祉評估安排與負擔<\/td>\n  <td>只以完成治療次數作為成效<\/td>\n<\/tr>\n<tr>\n  <td>賦權<\/td>\n  <td>協助本人使用已有能力與資源<\/td>\n  <td>說「靠你自己」後撤掉必要支持<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>一段對話如何改變任務<\/h3>\n<p>初次接觸先問「最近哪件生活上的事最困擾？」是建立關係。患者提到想洗澡、家屬提到走路，治療師說「今天時間內，想先談哪一件？」是聚焦。確認先談洗澡後，詢問「能自己完成其中一段，對你有什麼意義？」可支持喚起。當患者問「那從哪裡開始？」再共同規劃。<\/p>\n<p>若在規劃中患者說「又變成你們決定」，應退回關係與聚焦；繼續問每天幾次只會錯過問題。若一開始患者已有清楚目標與計畫，直接協助規劃也合理，不需為了完整流程硬問改變理由。<\/p>\n<h3>練習與限制<\/h3>\n<p>選一段自己的逐字稿，每三至五句寫下當下主要任務，再檢查對方是否同意那個焦點。若無法判定，可寫「資訊不足」，不必強行分類。案例T03、T10。精神是整體會談品質，不是四句口號；本稿不以單句對錯判斷是否具備MI能力。[S1、S2]<\/p>\n"}, {"id": "T章3", "index": 3, "title": "OARS：從聽見一句話，到選擇下一句", "html": "<p><strong>學習目標：<\/strong> 能寫出開放提問、肯定、簡單反映、複雜反映及摘要，並說明使用時機。<\/p>\n<h3>四種工具各自做什麼<\/h3>\n<p>OARS涵蓋Open questions、Affirmations、Reflections、Summaries。提問用來打開或確認資訊；肯定辨識對方的付出與資源；反映把理解交還對方核對；摘要把散落的重點放在一起。以下全部為原創復健示範，並非原書對話。[S3、S4]<\/p>\n<p>共同起點：患者說「我有練，可是每次都要太太幫，我覺得很沒用。」<\/p>\n<table>\n<thead>\n<tr>\n  <th>技巧與操作<\/th>\n  <th>示範<\/th>\n  <th>等待什麼回應／如何調整<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>開放提問：選一個需要理解的面向<\/td>\n  <td>「每次需要幫忙時，最讓你難受的是什麼？」<\/td>\n  <td>若太抽象，改問「是穿袖子，還是扣釦子時？」；封閉問題可協助定位<\/td>\n<\/tr>\n<tr>\n  <td>肯定：指出有證據的努力或價值<\/td>\n  <td>「這段時間很挫折，你仍然找機會試，也很在意減少太太的負擔。」<\/td>\n  <td>若本人反感被稱讚，停止評價，改問其經驗；不強迫接受肯定<\/td>\n<\/tr>\n<tr>\n  <td>簡單反映：保留原意，不增加新解釋<\/td>\n  <td>「你有練習，但仍需要太太幫忙。」<\/td>\n  <td>對方可能補充困難；適合先確認理解<\/td>\n<\/tr>\n<tr>\n  <td>複雜反映：提出可被修正的意義<\/td>\n  <td>「能自己完成，對你來說也關係到你怎麼看待自己。」<\/td>\n  <td>若他說「我只是怕她太累」，立即修正，避免辯護解讀<\/td>\n<\/tr>\n<tr>\n  <td>摘要：串起兩三個重點後邀請修正<\/td>\n  <td>「你持續嘗試，卻還需要協助；你擔心太太太累，也希望有一部分能自己做。我有漏掉什麼嗎？」<\/td>\n  <td>確認後才問接下來想談哪一部分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>簡單反映與複雜反映的差異<\/h3>\n<p>差別在於是否增加推測出的意義，不在句子長短。把「很累」換成「非常疲憊」，仍可能只是簡單反映。把「每次都有人看我練」回應成「你希望練習時保有一點隱私」，增加了推測，應允許對方修正。<\/p>\n<p>反映通常以陳述語氣說出，接著停頓；每一句都加「對不對」可能變成連續盤問。語意不明、涉及安全或需要確認同意時，可以直接詢問。開放問題也可能帶指責，例如「你為什麼一直不努力？」形式開放不代表合作。<\/p>\n<h3>完整示範：理解錯了怎麼辦<\/h3>\n<p>治療師：「你擔心自己永遠需要太太幫忙。」<br />\n患者：「沒有，我是她每天在旁邊看，我很煩。」<br />\n治療師：「我猜錯了。你現在在意的是練習時一直被看著。」<br />\n患者：「對，我想自己試。」<br />\n治療師：「我們一起確認哪些部分可以安全自己試，以及你希望她怎麼幫，好嗎？」<\/p>\n<p>反映被修正仍有價值，因為得到更準確資訊。不要將「使用複雜反映」變成追求高深的比賽。<\/p>\n<h3>自練與回饋<\/h3>\n<p>對「我不想再麻煩家人」分別寫一個提問、一個簡單反映、一個複雜反映。參考：「你最擔心麻煩他們哪件事？」「你不想增加家人的負擔。」「你很想保留自己能照顧自己的部分。」最後一句是推測，只有本人回應後才能確認。案例T04、T05。<\/p>\n<p><strong>限制：<\/strong> OARS不限於MI；會使用OARS不等於已完成MI。真實會談仍需焦點、對改變語言的理解與自主支持。[S3、S4]<\/p>\n"}, {"id": "T章4", "index": 4, "title": "DARN–CAT：聽到改變語句後，如何接續？", "html": "<p><strong>學習目標：<\/strong> 以明確的目標行為分析語句，區分想要、可能、承諾與已採取行動。<\/p>\n<h3>分類前先寫目標<\/h3>\n<p>改變語句需相對於特定目標來理解。例如目標是「在安全且經評估的條件下，讓患側手參與穿衣」，「我要好起來」只表達廣泛願望，尚未形成這項活動的承諾。DARN是準備性語言；CAT偏向動員行動。分類協助傾聽，不是用來測試患者是否及格。[S2、S4]<\/p>\n<table>\n<thead>\n<tr>\n  <th>類別<\/th>\n  <th>原創例句<\/th>\n  <th>可接續的回應<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Desire 想望<\/td>\n  <td>「我想自己拉好衣服。」<\/td>\n  <td>「自己完成，對你最重要的是什麼？」<\/td>\n<\/tr>\n<tr>\n  <td>Ability 能力信念<\/td>\n  <td>「先把衣服放好，我可能做得到。」<\/td>\n  <td>「衣服怎麼放會比較有把握？」<\/td>\n<\/tr>\n<tr>\n  <td>Reasons 理由<\/td>\n  <td>「這樣早上不用一直等人。」<\/td>\n  <td>「能自己安排早上，對你很重要。」<\/td>\n<\/tr>\n<tr>\n  <td>Need 需要<\/td>\n  <td>「這件事我得想辦法處理。」<\/td>\n  <td>「什麼讓它變得這麼重要？」<\/td>\n<\/tr>\n<tr>\n  <td>Commitment 承諾<\/td>\n  <td>「明天早餐前，我會試你教過的那一步。」<\/td>\n  <td>「你想怎麼安排，遇到困難怎麼辦？」<\/td>\n<\/tr>\n<tr>\n  <td>Activation 行動意向<\/td>\n  <td>「我願意考慮試一小段。」<\/td>\n  <td>「你想先了解哪些條件，再決定？」<\/td>\n<\/tr>\n<tr>\n  <td>Taking steps 已採取步驟<\/td>\n  <td>「昨天我有先把衣服擺好。」<\/td>\n  <td>「這一步進行得如何？下次想保留什麼？」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>同一句話有多個方向<\/h3>\n<p>患者：「自己穿當然比較方便，但早上太趕，我不想花半小時。」便利是支持改變的理由；時間成本支持現狀。先承認兩邊，再問他是否想探索可行安排。不能只抓「比較方便」就宣布患者有動機，也不能把時間限制當作必須被消除的藉口。<\/p>\n<p>對「好啦，你們安排」要確認是否出於本人意願：「你是想試，還是希望我們先不要一直討論？」語句表面像同意，不代表自主承諾。對「我願意試」也不立刻加量。<\/p>\n<h3>練習與限制<\/h3>\n<p>「我知道練習有用」可能只是知識陳述；需要上下文才能判斷是否支持本人採取某項改變。分類不明時標為待確認，先問「對你現在的安排有什麼影響？」案例T06、T07。DARN–CAT無法單獨預測功能恢復；語言變化、實際行為與功能結果分開觀察。[S2、S4、S10]<\/p>\n"}, {"id": "T章5", "index": 5, "title": "進階回應：雙面反映、量尺與資訊交換", "html": "<p><strong>學習目標：<\/strong> 依對方的需要選工具，避免把技巧變成引導固定答案的手段。<\/p>\n<h3>雙面反映：兩邊都聽見<\/h3>\n<p>雙面反映同時呈現對改變的不同理由。例如：「你希望出門時更有把握，也擔心練完一整天都沒力。」兩邊都必須來自對方已表達的內容。接著問想先談哪一部分，不能捏造他沒說過的改變願望。<\/p>\n<p>常見錯誤：「你雖然怕累，但為了家人應該努力。」後半加入治療師的說服，並用轉折削弱前半。較好的處理是保留矛盾，讓本人展開。遇到對治療師的不滿時，先處理關係，暫不急著平衡兩邊理由。<\/p>\n<h3>量尺：找到支持與阻礙<\/h3>\n<p>先定義行為與量尺，例如「對下週在有人協助的情況下練一次已評估的轉位，你有多少把握？0是完全沒把握，10是很有把握。」重要性與信心分開問。<\/p>\n<p>患者答3，可問「讓你有這3分把握的是什麼？」再問「若要多一點把握，需要哪些條件？」患者答0，先承認目前沒有把握，探索阻礙，別問「為什麼不是更低」。不熟悉數字時改用「沒有／一點／很多」，不要把量尺當成標準化診斷或療效分數。<\/p>\n<h3>資訊交換：Ask–Offer–Ask<\/h3>\n<p>第四版詞彙使用Ask–Offer–Ask；舊教材常見Elicit–Provide–Elicit。此處以「先問、提供、再問」教學，不把兩個名詞當成兩套必做的流程。[S1、S2、S4]<\/p>\n<p>示範：先問「關於練完隔天覺得退步，你目前怎麼理解？想聽我補充觀察方式嗎？」同意後提供一小段：「我們可以先固定活動條件，分開看需要多少協助和當天疲勞，才比較知道差在哪裡。」再問「這對你有幫助嗎？你最想先釐清什麼？」這裡提供的是評估方式，不保證變化原因。<\/p>\n<h3>綜合練習與限制<\/h3>\n<p>當患者說「我已經決定試，只是不知道怎麼擺桌子」，優先提供環境與動作教學，無須再做量尺或雙面反映。當他說「你不要再講」，先停下來，不能以「先問」名義繼續塞資訊。案例T08、T09。三種工具皆需適當焦點與時機，單獨使用不構成完整MI。[S1–S4；示範為實務整合]<\/p>\n"}, {"id": "T章6", "index": 6, "title": "TTM與MI：階段描述不能代替個別理解", "html": "<p><strong>學習目標：<\/strong> 用具體行為描述準備情況，不將人固定分類，也不混淆兩種理論。<\/p>\n<h3>定義與對照<\/h3>\n<p>TTM是行為改變的理論模型，常用前思考、思考、準備、行動、維持描述狀態；原始架構也包含終止。它另涉及改變歷程、決策平衡與自我效能。MI是對話取向；不需要先把人放入某階段，才能使用MI。[S5；MI部分S1]<\/p>\n<p>在復健中，「想恢復走路」與「願意每天練某動作」是不同目標。某人可能已持續出門，卻尚未考慮接受輔具。不能給他一個總括的「前思考期」標籤，更不能套用研究中的固定時間界線判定所有復健任務。<\/p>\n<h3>臨床如何使用<\/h3>\n<p>先問行為：「過去一週，有沒有照計畫嘗試自己準備上衣？」再問意向：「接下來想維持、調整，還是暫停？」接著確認環境條件。回答「想做但家人不讓」時，先處理協商與安全，不用判為缺乏準備。<\/p>\n<p>決策平衡可以協助整理選項的利弊。若會談目標是中立地協助選擇不同服務方式，就公平呈現各選項。若已形成雙方同意的改變方向，也不需每次都機械式要求列出維持現狀的所有好處。方向與用途要先說清楚。<\/p>\n<h3>練習與限制<\/h3>\n<p>「他沒有做功課，所以還在前思考期」有哪些缺漏？缺少是否理解、是否同意、能否執行、資源是否足夠，以及針對哪個行為。改寫紀錄：「願意嘗試桌面活動，但缺少適合桌面；本週優先處理環境。」案例T11。階段可作整理視角，不能證明特定溝通策略會改善中風復健成效。[S5；復健示範為原創整合]<\/p>\n"}, {"id": "T章7", "index": 7, "title": "從談話走到活動：自我效能、任務與環境", "html": "<p><strong>學習目標：<\/strong> 在對方願意後，安排可觀察、可調整的活動，分辨MI與其他介入。<\/p>\n<h3>概念區分<\/h3>\n<p>自我效能指對自己能否完成特定行動的信念，與「相信這個治療有效」不同。可從成功經驗、觀察他人、可信回饋及身體情緒經驗等面向理解。[S6] 專業人員仍需評估實際能力與風險；信心高不等於安全，信心低也不等於缺乏能力。<\/p>\n<p>MI協助討論是否與為何改變；活動分析、動作訓練、環境調整協助處理如何完成。行為活化是另一種介入脈絡，不能把任何「排一個小活動」都宣稱為完整的行為活化治療。若涉及情緒疾患治療，需有相應能力與評估。[S6；介入區分為教學界定]<\/p>\n<h3>可執行的銜接<\/h3>\n<p>患者想自己整理桌面，但怕失敗。先確認他願意嘗試的部分，再評估姿勢、桌高、物品及需要的協助。可以談：「這次先觀察你怎麼把毛巾移到指定位置；我們一起看哪裡需要幫忙。」不預先保證一定成功。<\/p>\n<p>活動後先問本人感受，再提供具體回饋：「這次你自己移動毛巾，我協助固定桌面。」與下一次共同決定保留、修改或停止。未完成時，重新分析卡在哪一步，不能歸咎於信心不足。<\/p>\n<h3>小計畫範例<\/h3>\n<p>本人選擇：想先參與早餐後擦桌。條件：治療師已確認坐姿及桌面活動可行。安排：與本人商量一次短暫嘗試，協助者依已示範的方法支持。觀察：是否能啟動、需要什麼提示、有無不適、是否願意再試。未執行：詢問原因並修改安排，不以未達標扣分。時間和次數需個別化，這裡不給普遍訓練劑量。<\/p>\n<h3>練習與限制<\/h3>\n<p>「我敢做了」屬信心變化；「能完成一部分」屬活動表現；「在家有持續做」屬實際執行。三者分開記錄。案例T12、T18。自我效能理論可協助理解，不能由一次成功推論神經恢復或長期生活參與。[S6、S10]<\/p>\n"}, {"id": "T章8", "index": 8, "title": "家庭共同介入：先釐清誰在說、誰在決定、誰在承擔", "html": "<p><strong>學習目標：<\/strong> 聽見三方期待、避免代答，並將照顧負荷變成可處理的服務議題。<\/p>\n<h3>核心理解<\/h3>\n<p>患者想保留生活選擇，家屬擔心安全，家庭看護工可能受工作指令限制。這些是不同資訊來源。家屬付費或負責照顧，不表示患者的意見可以省略；同時，患者想做的活動也需要考慮照顧者可提供的時間、能力與安全。<\/p>\n<p>共同決策著重選項、證據與偏好；MI可協助討論矛盾。兩者不應被混成「讓全家同意治療師」。本章的家庭流程屬實務整合。[S1、S11]<\/p>\n<h3>三方會談操作<\/h3>\n<p>先確認參與者與本人願意分享的範圍。各自說出一個希望及一個擔心，再摘要差異。若家屬總代答，說「我先讓他用自己的方式回答，等一下再請你補充」。有失語或理解困難時，安排可近用的溝通支持，不能直接將聲音最大的人的說法當成決定。<\/p>\n<p>示範：患者想自己買東西、太太擔心跌倒、看護不確定如何扶。可共同焦點是「先評估外出的安全條件與協助方式」，不是立刻訂出走路次數。若家屬說「我無法每天陪」，將這點納入可行性；不是要求再學一句鼓勵的話。<\/p>\n<h3>照顧者需要自己的支持空間<\/h3>\n<p>照顧者說「我受不了」時，先問目前最急迫的負荷與安全。必要時另約談話、轉介資源或安排分工；不將其傾訴立刻轉成患者訓練計畫。不同意公開的私人內容，依隱私與照護需求處理。<\/p>\n<h3>練習與限制<\/h3>\n<p>把「太太要他每天練」改寫為三方紀錄：太太期待、本人意願、看護可執行範圍、尚未達成共識的事項。案例T14、T15；家屬F11、F12。教材不處理代理決策法律認定；有決策能力疑慮、強迫或照護安全問題，依機構流程與相關專業評估處理。[S11；實務整合]<\/p>\n"}, {"id": "T章9", "index": 9, "title": "臨床界線：何時繼續談，何時換方法？", "html": "<p><strong>學習目標：<\/strong> 不把MI用成所有問題的預設答案。<\/p>\n<h3>依問題選擇路徑<\/h3>\n<table>\n<thead>\n<tr>\n  <th>目前主要問題<\/th>\n  <th>優先處理<\/th>\n  <th>MI可扮演的有限角色<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>已有意願，缺少方法<\/td>\n  <td>評估、示範、環境調整<\/td>\n  <td>協商計畫與負擔<\/td>\n<\/tr>\n<tr>\n  <td>對具體行為矛盾<\/td>\n  <td>經同意探索理由及擔心<\/td>\n  <td>可進行聚焦與喚起<\/td>\n<\/tr>\n<tr>\n  <td>急性症狀或身體安全疑慮<\/td>\n  <td>停止活動、適當醫療處置<\/td>\n  <td>保持尊重，不能延誤處理<\/td>\n<\/tr>\n<tr>\n  <td>語言或認知阻礙<\/td>\n  <td>溝通支持、評估理解與表達<\/td>\n  <td>縮短對話、確認意思；可能需改用其他方式<\/td>\n<\/tr>\n<tr>\n  <td>持續低落或安全疑慮<\/td>\n  <td>臨床評估與適當轉介<\/td>\n  <td>支持表達、討論求助；不取代治療<\/td>\n<\/tr>\n<tr>\n  <td>知情後仍拒絕某安排<\/td>\n  <td>確認理解、替代方式與後續<\/td>\n  <td>接納決定，不反覆喚起直到答應<\/td>\n<\/tr>\n<tr>\n  <td>多個合理選項需中立比較<\/td>\n  <td>共同決策<\/td>\n  <td>避免只挑支持治療師偏好的語句<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>說明界線的示範<\/h3>\n<p>「這個活動你可以選擇不做。我的責任是把我擔心的風險和替代安排說清楚，再確認你怎麼看。」若存在急迫狀況則直接說明需要立即處理的理由，依臨床流程行動。沒有急迫情況時，拒絕不必被寫成互動失敗。<\/p>\n<h3>研究怎麼讀<\/h3>\n<p>中風MI研究的參與者、時期、訪談劑量、執行者訓練與結果指標不同。情緒或自述行為的改善不能直接換算成上肢功能、步行能力或自理獨立。Watkins等人的早期中風試驗可作原始研究閱讀，但不代表本教材的短句示範具有相同效果。研究摘要能核對設計與主要結果，細部偏差與適用性仍需全文評讀。[S7、S8、S10]<\/p>\n<h3>練習與限制<\/h3>\n<p>「患者今天不練」至少可對應七種路徑。作答前先寫出還缺什麼資訊，避免直接挑最像MI的句子。案例T10、T13、T16、T17。這是教學分流，不是取代醫療評估的演算法。<\/p>\n"}, {"id": "T章10", "index": 10, "title": "技能反思與評估：看會談品質，不只看是否答應", "html": "<p><strong>學習目標：<\/strong> 用可觀察的對話證據改善技巧，區分自我檢視與正式評分。<\/p>\n<h3>MITI可以提供什麼視角<\/h3>\n<p>MITI用於觀察MI實施品質，包含整體評估及行為編碼的架構。正式使用需學習手冊、編碼練習與評分一致性；不能把本教材選擇題分數當成MITI分數或認證。MINT目前資源連結顯示「MITI 4.2.1_2026 Addendum」，本次未讀到該檔完整內容，因此本稿不提供新版計分細則或門檻。[S12]<\/p>\n<h3>一次只選一個可改進的地方<\/h3>\n<p>先確認錄音或逐字稿取得同意，去識別化並遵守機構資料規範。不必將真實個案資料上傳至本網站。選取一段完整上下文，寫下會談焦點，再標記一個自己最想修改的回應。<\/p>\n<p>例如患者：「我怕練完更累。」治療師：「那就少量多次，你一定可以。」回看時可發現：回應快速跳到建議，尚未知道疲勞程度與來源。改寫為「你擔心活動後的疲累會影響其他生活」，接著詢問具體經驗與必要評估。反思焦點在可觀察行為，不寫「我的同理心不好」這種無法操作的結論。<\/p>\n<h3>自我檢視單<\/h3>\n<ol>\n<li>目標是否由本人參與確認？用哪一句話看得出來？<\/li>\n<li>我有沒有先聽懂困難，就提供安排？<\/li>\n<li>我的反映增加了哪些推測？對方是否有機會修正？<\/li>\n<li>對方拒絕或反感後，我做了什麼調整？<\/li>\n<li>資訊交換後，我是否了解對方的看法？<\/li>\n<li>結尾是否有雙方理解一致的安排，或清楚記錄尚未決定？<\/li>\n<\/ol>\n<p>以上為本稿自編反思題，未經心理計量驗證，不計算總分。可請受過MI訓練的同儕或督導提供具體回饋。<\/p>\n<h3>成效與學習分開<\/h3>\n<p>溝通是否合作、本人是否願意再談、計畫是否可執行、活動與功能是否改變，是不同層次。不能用患者順從反推會談品質，也不能用單次功能未改善否定所有支持工作。案例T18可練習如何回顧未執行的計畫；研究閱讀見文末來源表。[S7、S10、S12]<\/p>\n<hr />\n"}]}, "cases": {"family": [{"id": "F01", "title": "今天真的很累", "meta": {"角色": "女兒與父親", "已知": "昨晚睡不好，今天狀況與過去疲勞時相似，未見新發症狀；原計畫是已評估的坐姿桌面活動", "目標": "先分清休息需求與練習安排", "對應": "家屬第1章"}, "nodes": {"N1": {"speaker": "父親：「今天不要，我昨晚幾乎沒睡。」", "options": [{"key": "A", "text": "今天很累，先休息。你希望我晚點再問，還是今天先不提？", "next": "N2", "feedback": "承認疲勞並協調提醒", "outcome": ""}, {"key": "B", "text": "那把原本的活動縮短一點，你覺得呢？", "next": "N3", "feedback": "有詢問意見，但尚未了解他是否想做任何活動", "outcome": ""}]}, "N2": {"speaker": "父親：「今天先不要提，等我睡醒再看。」", "options": [{"key": "A", "text": "好，醒來想做再告訴我。", "next": null, "feedback": "", "outcome": "今天沒有練習；保留自主選擇，疲勞若持續則回報。"}, {"key": "B", "text": "可以，我也想確認這幾晚是不是都沒睡好。", "next": null, "feedback": "追問聚焦健康，沒有重啟催促", "outcome": "父親說已持續幾晚；改為整理睡眠情況並聯絡團隊。回饋：追問聚焦健康，沒有重啟催促。"}]}, "N3": {"speaker": "父親：「我不是嫌時間長，我現在連坐著都累。」", "options": [{"key": "A", "text": "我剛才太快改成少做一點了。先不安排活動。", "next": null, "feedback": "", "outcome": "修正理解，休息並留意狀況；不是承諾晚點補做。"}, {"key": "B", "text": "那先弄清楚今天的累和平常有沒有不一樣。", "next": null, "feedback": "新增資訊可改變分流，不能只談意願", "outcome": "父親表示比平常明顯；停止活動、聯絡醫療人員評估。回饋：新增資訊可改變分流，不能只談意願。"}]}}}, {"id": "F02", "title": "動一下肩膀就痛", "meta": {"角色": "配偶與丈夫", "已知": "穿衣時肩膀疼痛，尚未確認原因", "目標": "停止引發痛的動作，具體回報", "對應": "家屬第1章"}, "nodes": {"N1": {"speaker": "丈夫：「不要拉，我這裡會痛。」", "options": [{"key": "A", "text": "先停，我不拉。你可以指哪裡痛嗎？", "next": "N2", "feedback": "先解除動作，再詢問", "outcome": ""}, {"key": "B", "text": "先停，今天穿衣的動作先不練，我聯絡治療師。", "next": "N3", "feedback": "停止合理，仍需補足症狀與必要照護資訊", "outcome": ""}]}, "N2": {"speaker": "丈夫指肩膀：「剛才拉到那裡就痛，放下比較好。」", "options": [{"key": "A", "text": "我把剛才哪一步會痛記下來，請他教我們怎麼協助。", "next": null, "feedback": "", "outcome": "待評估與調整方法；不自行再拉一次驗證。"}, {"key": "B", "text": "現在休息還痛嗎？今天有沒有摔到或撞到？", "next": null, "feedback": "問症狀有助回報，不自行診斷", "outcome": "丈夫補充早上曾撞到；依嚴重度尋求醫療評估。回饋：問症狀有助回報，不自行診斷。"}]}, "N3": {"speaker": "丈夫：「可是我衣服才穿一半。」", "options": [{"key": "A", "text": "我先用以前教過、不會拉到肩膀的方式協助；如果還痛就停。", "next": null, "feedback": "", "outcome": "安全完成必要照護或尋求現場協助，再聯絡評估。"}, {"key": "B", "text": "我不確定怎麼穿才安全，先替你保暖和遮好，請人協助。", "next": null, "feedback": "承認不會操作，比臨時發明方法妥當", "outcome": "避免硬完成任務。回饋：承認不會操作，比臨時發明方法妥當。"}]}}}, {"id": "F03", "title": "昨天比較好，今天又退回去了", "meta": {"角色": "兒子與母親", "已知": "沒有突然的新症狀，母親覺得今天拿杯子比昨天費力", "目標": "理解失望，區分感受與功能判定", "對應": "家屬第2章"}, "nodes": {"N1": {"speaker": "母親：「又變回原來那樣，根本白練。」", "options": [{"key": "A", "text": "你希望進步能留住，今天拿得不順很失望。", "next": "N2", "feedback": "先反映落差", "outcome": ""}, {"key": "B", "text": "要不要一起看看昨天跟今天有哪裡不一樣？", "next": "N3", "feedback": "有取得同意，但較快轉向分析", "outcome": ""}]}, "N2": {"speaker": "母親：「對，每次期待都落空。」", "options": [{"key": "A", "text": "今天想先停一下，還是讓我陪你說說？", "next": null, "feedback": "", "outcome": "母親選擇先停；情緒被容納，沒有強制轉成練習。"}, {"key": "B", "text": "你願意下次一起問治療師，怎麼判斷這種變化嗎？", "next": null, "feedback": "", "outcome": "母親願意帶著問題回診；不宣稱起伏一定正常。"}]}, "N3": {"speaker": "母親：「我現在不想再被檢查一次。」", "options": [{"key": "A", "text": "好，現在不測。剛才我太快想找原因了。", "next": null, "feedback": "", "outcome": "停止分析、保留後續討論；關係得到修復的機會。"}, {"key": "B", "text": "不用重做動作，只聽你說哪一步最費力；不想說也可以。", "next": null, "feedback": "取得同意後蒐集資訊，仍不據此判定全部原因", "outcome": "母親說杯子不同；記下條件供治療師評估。回饋：取得同意後蒐集資訊，仍不據此判定全部原因。"}]}}}, {"id": "F04", "title": "以前這種小事我一下就做好", "meta": {"角色": "太太與先生", "已知": "先生因穿衣變慢而難過，沒有急迫身體問題", "目標": "回應失落，不用他人比較", "對應": "家屬第2章"}, "nodes": {"N1": {"speaker": "先生：「以前根本不用想，現在像小孩一樣。」", "options": [{"key": "A", "text": "以前能自己俐落完成，現在需要幫忙，心裡很不好受。", "next": "N2", "feedback": "回應失去的能力與感受", "outcome": ""}, {"key": "B", "text": "你想讓我少幫一點，留時間給你試嗎？", "next": "N3", "feedback": "提出可行選項，但可能尚未接住失落", "outcome": ""}]}, "N2": {"speaker": "先生：「我討厭大家一直說我很棒。」", "options": [{"key": "A", "text": "你希望大家把你當大人，不必每一步都稱讚。", "next": null, "feedback": "", "outcome": "先生確認；約定改用必要協助與具體描述。"}, {"key": "B", "text": "那我先陪著，不急著說什麼。需要我幫哪裡再告訴我。", "next": null, "feedback": "不是每次都必須談出改變理由", "outcome": "保留安靜支持。回饋：不是每次都必須談出改變理由。"}]}, "N3": {"speaker": "先生：「我不是說你幫太多，我只是很難過。」", "options": [{"key": "A", "text": "我聽懂了，你現在是想讓我知道有多難受。", "next": null, "feedback": "", "outcome": "修正焦點，先陪伴。"}, 療師第4章"}, "nodes": {"N1": {"speaker": "患者：「好啦，照你說的就好。」", "options": [{"key": "A", "text": "你是真的想試，還是今天談得累了，想先結束？", "next": "N2", "feedback": "核對而不強迫表態", "outcome": ""}, {"key": "B", "text": "我先摘要剛才的安排，你看看哪裡需要改。", "next": "N3", "feedback": "確認理解有用，但未必能確認自願性", "outcome": ""}]}, "N2": {"speaker": "患者：「我只是累了，還沒決定。」", "options": [{"key": "A", "text": "那先不定計畫，改天你願意時再談。", "next": null, "feedback": "", "outcome": "明確記錄尚未決定，停止會談。"}, {"key": "B", "text": "好。離開前只確認你需不需要我留下簡短選項，其他先不談。", "next": null, "feedback": "", "outcome": "患者選不要；不留下額外任務。"}]}, "N3": {"speaker": "患者：「你寫吧，我反正也記不住。」", "options": [{"key": "A", "text": "我不先把它當成你答應。我們先停，之後用更簡單的方式確認。", "next": null, "feedback": "", "outcome": "辨認疲勞或理解負擔，安排溝通支持。"}, {"key": "B", "text": "這個安排目前有哪些部分是你自己想做的？沒有也可以。", "next": null, "feedback": "", "outcome": "患者只想做其中一步；縮小至真正同意的範圍並核對理解。"}]}}}, {"id": "T08", "title": "想出門，又怕累一整天", "meta": {"角色": "治療師與患者", "已知": "已同意討論外出；疲勞與安全需要進一步評估", "目標": "雙面反映不抹掉顧慮", "對應": "治療師第5章"}, "nodes": {"N1": {"speaker": "患者：「想去附近買東西，可是出去一次，整天都累。」", "options": [{"key": "A", "text": "你很想自己挑東西，也想保留回家後做其他事的體力。", "next": "N2", "feedback": "保留兩個本人表達的需要", "outcome": ""}, {"key": "B", "text": "我們先把一次外出哪些地方最耗力弄清楚，好嗎？", "next": "N3", "feedback": "經同意進行具體評估，也屬合理路徑", "outcome": ""}]}, "N2": {"speaker": "患者：「我不想為了買東西，下午什麼都不能做。」", "options": [{"key": "A", "text": "下午最想保留什麼？這會影響我們怎麼安排。", "next": null, "feedback": "", "outcome": "患者重視陪孫子；外出計畫需配合生活優先順序。"}, {"key": "B", "text": "這次也可以先不安排外出，先評估疲勞和替代方法。", "next": null, "feedback": "", "outcome": "保留延後選擇，不把顧慮當阻力。"}]}, "N3": {"speaker": "患者：「等車和站著排隊最累。」", "options": [{"key": "A", "text": "先檢查交通、座位和時段選項，不只增加走路訓練。", "next": null, "feedback": "", "outcome": "進入環境與活動規劃。"}, {"key": "B", "text": "你想先討論哪個負擔最有機會減少？", "next": null, "feedback": "", "outcome": "本人選擇先處理交通；焦點具體化。"}]}}}, {"id": "T09", "title": "信心只有0分", "meta": {"角色": "治療師與患者", "已知": "已評估基本動作，但居家協助條件尚不清楚", "目標": "不用量尺逼出正向答案", "對應": "治療師第5章"}, "nodes": {"N1": {"speaker": "患者：「在家做這個？我完全沒把握，0分。」", "options": [{"key": "A", "text": " B", "text": "現在你還想做這項活動，還是想重新考慮？", "next": "N3", "feedback": "確認意願是否改變，不假設原因", "outcome": ""}]}, "N2": {"speaker": "患者：「我忘了，想起來已經很晚。」", "options": [{"key": "A", "text": "要不要試一個你接受的提示，放在固定生活流程旁？", "next": null, "feedback": "", "outcome": "協商提示方式，仍需確認活動可行。"}, {"key": "B", "text": "這星期事情很多，原時段可能不適合；要重排還是暫停？", "next": null, "feedback": "", "outcome": "依生活情境修改，而非判為前思考。"}]}, "N3": {"speaker": "患者：「我還想做，但覺得你排太多了。」", "options": [{"key": "A", "text": "一起選最有關係的一項，其餘先拿掉。", "next": null, "feedback": "", "outcome": "負擔降低，訂定後續檢視。"}, {"key": "B", "text": "哪些安排最佔時間？先看可行性再決定要保留什麼。", "next": null, "feedback": "", "outcome": "辨認負荷來源，不把未開始等同無意願。"}]}}}, {"id": "T12", "title": "一次做不到，下一步怎麼調整？", "meta": {"角色": "治療師與患者", "已知": "已同意參與擦桌，但毛巾一直滑走", "目標": "任務調整與自我效能，不只口頭鼓勵", "對應": "治療師第7章"}, "nodes": {"N1": {"speaker": "患者：「看吧，我就做不到。」", "options": [{"key": "A", "text": "剛才卡在毛巾滑走，我們先看怎麼調整這個條件。", "next": "N2", "feedback": "具體分析，避免全人能力判定", "outcome": ""}, {"key": "B", "text": "這次讓你很挫折。你願意先停，還是看看卡在哪裡？", "next": "N3", "feedback": "先確認繼續參與的意願", "outcome": ""}]}, "N2": {"speaker": "患者：「可以換一種比較好抓的嗎？」", "options": [{"key": "A", "text": "一起試合適材質並觀察，成功與否都拿來調整。", "next": null, "feedback": "", "outcome": "改變任務條件；不保證一定完成。"}, {"key": "B", "text": "先由我協助固定，讓你試想參與的那一步，看看如何。", "next": null, "feedback": "", "outcome": "以支持促進參與，清楚記錄協助量。"}]}, "N3": {"speaker": "患者：「今天先不要再試。」", "options": [{"key": "A", "text": "好。今天得到的資訊是物品條件需要調整，不急著下整體結論。", "next": null, "feedback": "", "outcome": "停止並留下下次評估方向。"}, {"key": "B", "text": "我可以先記下你覺得最困難的地方，下次再決定要不要試嗎？", "next": null, "feedback": "", "outcome": "患者願意回顧，未承諾下次必做。"}]}}}, {"id": "T13", "title": "突然變差，先離開動機對話", "meta": {"角色": "治療師與患者及家屬", "已知": "會談中出現新的單側無力與說話不清", "目標": "緊急分流；此案不設「繼續MI」選項", "對應": "治療師第9章"}, "nodes": {"N1": {"speaker": "家屬：「他是不是今天又不想配合？」", "options": [{"key": "A", "text": "這是突然的新變化，需要立即醫療協助。我們先停止活動並啟動緊急處置。", "next": "N2", "feedback": "辨認急迫性，直接行動", "outcome": ""}, {"key": "B", "text": "我立即聯絡緊急醫療，請你同時告訴我最後一次正常是什麼時候。", "next": "N3", "feedback": "分工取得時間資訊，不能為問病史延遲求援", "outcome": ""}]}, "N2": {"speaker": "家屬：「要不要先休息看看？」", "options": [{"key": "A", "text": "不能等它自己好，現在持續進行緊急求援。", "next": null, "feedback": "", "outcome": "進入緊急醫療交接；不再作動機練習。"}, {"key": "B", "text": "即使稍微改善也需要立即評估，請協助準備必要資料，我持續處理求援。", "next": null, "feedback": "", "outcome": "任務分工清楚、不延誤。"}]}, "N3": {"speaker": "家屬說出最後正常時間；患者表示想再坐一下。", "options": [{"key": "A", "text": "我會陪著並說明正在做什麼，依緊急醫療人員指示處理。", "next": null, "feedback": "", "outcome": "安全等候與交接，不強迫站走測試。"}, {"key": "B", "text": "向救護人員回報症狀、時間和變化，請家屬一起補充。", "next": null, "feedback": "兩個選項可並行，本題辨識的是必要行動而非優劣話術", "outcome": "完成資訊交接。回饋：兩個選項可並行，本題辨識的是必要行動而非優劣話術。"}]}}}, {"id": "T14", "title": "家屬付費，希望治療師替他說服", "meta": {"角色": "治療師、患者與女兒", "已知": "女兒希望每天練，患者尚未同意", "目標": "清楚服務角色，聽取本人與家屬負荷", "對應": "治療師第8章"}, "nodes": {"N1": {"speaker": "女兒：「我們請你來，就是希望你讓他願意練。」", "options": [{"key": "A", "text": "我會評估困難並一起找可行方向，也需要先了解他本人的想法。", "next": "N2", "feedback": "說明角色，不承諾說服成功", "outcome": ""}, {"key": "B", "text": "你最擔心不練會發生什麼？我也會請他說自己的看法。", "next": "N3", "feedback": "理解家屬期待，但需確實讓本人發言", "outcome": ""}]}, "N2": {"speaker": "患者：「我想談洗澡，他們每天只叫我走。」", "options": [{"key": "A", "text": "先把洗澡列為本人優先議題，再共同評估與走路的關係。", "next": null, "feedback": "", "outcome": "本人目標進入服務，不直接否定家屬擔心。"}, {"key": "B", "text": "請雙方分別說明希望的生活改變，找一個今天可評估的問題。", "next": null, "feedback": "", "outcome": "重新聚焦，尚未形成每日練習承諾。"}]}, "N3": {"speaker": "女兒：「我怕一直都要我扶，我真的撐不住。」", "options": [{"key": "A", "text": "照顧負荷需要另外處理，不能全部押在他願不願練上。", "next": null, "feedback": "", "outcome": "盤點支援與安全協助，同時聽患者需求。"}, {"key": "B", "text": "今天可以一起看移動方式與你可提供的協助，再談訓練嗎？", "next": null, "feedback": "", "outcome": "以可行性作共同評估焦點，未把女兒責任加重。"}]}}}, {"id": "T15", "title": "看護說「好」，但其實不會做", "meta": {"角色": "治療師、印尼籍看護與家屬", "已知": "看護剛聽完長篇中文說明，只點頭", "目標": "確認理解與權責，避免把點頭當能力", "對應": "治療師第8、9章"}, "nodes": {"N1": {"speaker": "看護：「好、好，我知道。」", "options": [{"key": "A", "text": "我想確認我有沒有說清楚，請你用自己的方式說下一步，不是考你。", "next": "N2", "feedback": "確認教學效果，減少責備", "outcome": ""}, {"key": "B", "text": "我們用短句和適當語言支持，再實際示範一次。", "next": "N3", "feedback": "先提高資訊可理解性，再確認執行", "outcome": ""}]}, "N2": {"speaker": "看護：「我不太懂，可是家人說我每天一定要做。」", "options": [{"key": "A", "text": "先不要求獨立執行，我們把安全、停止條件和聯絡方式教清楚。", "next": null, "feedback": "", "outcome": "未確認能力前，不交付超出能力的工作。"}, {"key": "B", "text": "先跟家屬一起確認哪些是必要照護、哪些需本人同意，安排再教學。", "next": null, "feedback": "", "outcome": "調整期待與責任，不把成效歸給看護。"}]}, "N3": {"speaker": "看護在示範後仍有一個關鍵步驟不清楚。", "options": [{"key": "A", "text": "針對那一步重新示範，讓她回示；未確認前由適任者協助。", "next": null, "feedback": "", "outcome": "教學與驗證逐步進行。"}, {"key": "B", "text": "安排合適口譯或語言支持，重新核對內容。", "next": null, "feedback": "", "outcome": "語言問題被處理，不以中文能力推論照顧態度。"}]}}}, {"id": "T16", "title": "長期低落，不能只用話術推動", "meta": {"角色": "治療師與患者", "已知": "近幾週多項活動減少、睡眠食慾改變；尚未診斷", "目標": "支持表達、啟動評估，不自行下診斷", "對應": "治療師第9章"}, "nodes": {"N1": {"speaker": "患者：「最近什麼都提不起勁，連喜歡的電視也不看。」", "options": [{"key": "A", "text": "這段時間連原本喜歡的事都很難投入，我想先了解對生活和安全的影響。", "next": "N2", "feedback": "先評估，必要時依流程詢問風險", "outcome": ""}, {"key": "B", "text": "除了復健，睡眠和生活也變了，我建議安排專業評估，想先聽你的看法。", "next": "N3", "feedback": "清楚說明建議與理由，不能因討論意願延誤必要安全處置", "outcome": ""}]}, "N2": {"speaker": "患者：「晚上睡不好，吃東西也沒味道，不知道怎麼了。」", "options": [{"key": "A", "text": "把這些變化一起轉介醫療評估，復健先依負荷調整。", "next": null, "feedback": "", "outcome": "協調照護，未將症狀歸因於意願。"}, {"key": "B", "text": "確認有無立即安全疑慮，並安排後續聯絡與評估。", "next": null, "feedback": "", "outcome": "依評估結果分流；本案不假設所有低落都有同一風險。"}]}, "N3": {"speaker": "患者：「看那個科，是不是說我有精神病？」", "options": [{"key": "A", "text": "現在還沒有診斷；評估是想了解睡眠、情緒和身體因素，找能幫忙的方式。", "next": null, "feedback": "", "outcome": "減少誤解，確認是否願意安排。"}, {"key": "B", "text": "你最擔心評估會帶來什麼？我可以說明流程。", "next": null, "feedback": "", "outcome": "探索擔心並交換資訊；若拒絕且無急迫危險，記錄與安排追蹤，不宣稱已解決。"}]}}}, {"id": "T17", "title": "兩種合理服務，不能誘導選自己", "meta": {"角色": "治療師與患者", "已知": "患者比較到府與門診，兩者皆可能合適，費用與交通不同", "目標": "中立決策，辨認利益衝突", "對應": "治療師第6、9章"}, "nodes": {"N1": {"speaker": "患者：「到府方便但比較貴，門診又要麻煩家人。」", "options": [{"key": "A", "text": "一起比較費用、交通、目標與可用支持，保留暫不決定。", "next": "N2", "feedback": "公平呈現選項", "outcome": ""}, {"key": "B", "text": "先了解你最在意哪個條件，我也說明自己是其中一項服務提供者。", "next": "N3", "feedback": "揭露角色並探索偏好", "outcome": ""}]}, "N2": {"speaker": "患者：「我最怕長期負擔不起。」", "options": [{"key": "A", "text": "把可負擔的範圍與各方案實際條件列清楚，再比較。", "next": null, "feedback": "", "outcome": "依真實資訊決策，不用療效保證掩蓋費用。"}, {"key": "B", "text": "也可以詢問其他資源與安排；先了解再決定是否接受服務。", "next": null, "feedback": "", "outcome": "保留替代方案，不將轉往他處視為失敗。"}]}, "N3": {"speaker": "患者：「那你是不是希望我選到府？」", "options": [{"key": "A", "text": "我提供到府服務，但選擇應依你的目標和負擔；我會把其他方案一起說清楚。", "next": null, "feedback": "", "outcome": "角色透明，繼續中立討論。"}, {"key": "B", "text": "如果你希望，也可以由沒有提供這兩項服務的人協助比較。", "next": null, "feedback": "", "outcome": "提供獨立支持，不替患者指定偏好。"}]}}}, {"id": "T18", "title": "計畫沒執行，回顧會談還是責怪患者？", "meta": {"角色": "治療師與患者；結尾加治療師自我反思", "已知": "上週計畫寫了五項活動，本週只做一項", "目標": "分開會談品質、執行與功能成效", "對應": "治療師第7、10章"}, "nodes": {"N1": {"speaker": "患者：「只做一個，其他都沒做。」", "options": [{"key": "A", "text": "有做的那個怎麼安排？其他部分卡在哪裡？", "next": "N2", "feedback": "先理解差異與可行條件", "outcome": ""}, {"key": "B", "text": "回頭看，上週五項可能太多；想先確認哪些真的是你想做的。", "next": "N3", "feedback": "檢視共同決策，不能直接替患者判定全部原因", "outcome": ""}]}, "N2": {"speaker": "患者：「只有擦桌跟我的生活有關，其他我想不起來。」", "options": [{"key": "A", "text": "以擦桌為起點，再共同確認是否需要保留其他項目。", "next": null, "feedback": "", "outcome": "修改計畫；紀錄執行條件，尚不能宣稱功能進步。"}, {"key": "B", "text": "先請你示範或描述實際做法，再評估哪些條件讓它可行。", "next": null, "feedback": "", "outcome": "將自述與觀察分開，調整活動與教學。"}]}, "N3": {"speaker": "患者：「我上次只是不好意思拒絕你。」", "options": [{"key": "A", "text": "謝謝你現在說，我上次確認意願不夠。我們重新談，也可以先不訂。", "next": null, "feedback": "", "outcome": "修復合作；自評焦點是如何核對意願。"}, {"key": "B", "text": "我們把五項先放下。這次你希望得到什麼協助？", "next": null, "feedback": "不能以重新談得順就宣稱MI能力達標", "outcome": "重新聚焦；自評記錄是否太快轉入規劃。回饋：不能以重新談得順就宣稱MI能力達標。"}]}}}]}, "references": "<h2>來源對照<\/h2>\n<p>以下連結用於追溯概念與後續專業審閱。已取得的公開頁面、搜尋摘要、無法取得全文的材料分開記錄；不把「找到文獻」寫成「全文已評讀」。本次為目的性來源核對，未進行系統性文獻回顧。<\/p>\n<table>\n<thead>\n<tr>\n  <th>編號<\/th>\n  <th>來源與連結<\/th>\n  <th>本稿使用範圍與核對狀態<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>S1<\/td>\n  <td>Miller WR, Rollnick S. <em>Motivational Interviewi n  <td>S7<\/td>\n  <td>Watkins CL et al. Motivational interviewing early after acute stroke: a randomized, controlled trial. <em>Stroke<\/em>. 2007;38:1004–1009. <a href=\"https://motivationalinterviewing.org/node/4263\">MINT文獻紀錄<\/a>；<a href=\"https://pubmed.ncbi.nlm.nih.gov/17303766/\">PubMed<\/a><\/td>\n  <td>核對原始試驗書目及摘要中的介入設計：受訓者提供個別會談。未將其效果套用於家屬一句回應或本教材。未完成全文偏差風險評讀。<\/td>\n<\/tr>\n<tr>\n  <td>S8<\/td>\n  <td>Cheng D et al. Motivational interviewing for improving recovery after stroke. <em>Cochrane Database Syst Rev<\/em>. 2015;CD011398. <a href=\"https://www.cochrane.org/evidence/CD011398_motivational-interviewing-improving-recovery-after-stroke\">Cochrane<\/a><\/td>\n  <td>作為歷史性證據限制參考，不能據此宣稱截至2026年的全部研究仍只有同樣數量或結論。此回顧不足以支持MI改善中風日常生活能力的確定結論。<\/td>\n<\/tr>\n<tr>\n  <td>S9<\/td>\n  <td>NICE. <a href=\"https://www.nice.org.uk/guidance/ng236/chapter/Recommendations\">Stroke rehabilitation in adults, NG236<\/a>；American Stroke Association. <a href=\"https://www.stroke.org/en/about-stroke/stroke-symptoms\">Stroke symptoms and warning signs<\/a><\/td>\n  <td>公開檢索資料支持參與復健計畫、照顧者支持、溝通調整及症狀分流；NICE全文此次存取受限。英國服務制度不直接套用台灣；急性症狀處理為一般安全原則。<\/td>\n<\/tr>\n<tr>\n  <td>S10<\/td>\n  <td>Barker-Collo S et al. Improving Adherence to Secondary Stroke Prevention Strategies Through Motivational Interviewing: Randomized Controlled Trial. 2015. <a href=\"https://pubmed.ncbi.nlm.nih.gov/26508749/\">PubMed<\/a><\/td>\n  <td>核對原始研究書目及摘要資訊，說明次級預防行為與復健功能是不同結果。未完成全文評讀，不提供效果量比較或宣稱功能療效。<\/td>\n<\/tr>\n<tr>\n  <td>S11<\/td>\n  <td>NICE. <a href=\"https://www.nice.org.uk/guidance/ng197/chapter/recommendations\">Shared decision making, NG197<\/a><\/td>\n  <td>公開檢索資訊與延伸閱讀，用於共同決策的選項與偏好框架；全文此次存取受限。三方會談例句為自編，非指南原句。<\/td>\n<\/tr>\n<tr>\n  <td>S12<\/td>\n  <td>MINT. <a href=\"https://motivationalinterviewing.org/motivational-interviewing-resources\">Motivational Interviewing Resources<\/a><\/td>\n  <td>已讀資源頁及目前MITI連結的檔名「MITI 4.2.1_2026 Addendum」。未讀到檔案全文；不使用新版計分細節、合格門檻或宣稱已核對修訂內容。<\/td>\n<\/tr>\n<tr>\n  <td>S13<\/td>\n  <td>Mou H et al. Motivational interviewing for improving functional and psychosocial outcomes among stroke survivors. <em>Cochrane Database Syst Rev<\/em>. 2025;CD016110. <a href=\"https://pubmed.ncbi.nlm.nih.gov/40178179/\">PubMed<\/a><\/td>\n  <td>公開摘要明確標為研究計畫（protocol）。它是研究更新線索，沒有可作成效依據的完成結果，不當作新的療效證明。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n"}</script><script>
const DATA=JSON.parse(document.getElementById('site-data').textContent);let mode='family',view='home',chapter=0,caseId='',nodeId='N1',picked=null,trail=[],topic='all';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function resetCase(id){caseId=id;nodeId='N1';picked=null;trail=[]}function go(v,i=0){view=v;chapter=i;render();window.scrollTo({top:0,behavior:'smooth'})}function gotoCase(id){resetCase(id);go('case')}function setMode(v){mode=v;topic='all';go('home')}function getCases(){return DATA.cases[mode]}function getChapters(){return DATA.chapters[mode]}function closeMenu(){el('sidebar').classList.remove('open');el('menuToggle').setAttribute('aria-expanded','false')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));el('menuToggle').onclick=()=>{let open=el('sidebar').classList.toggle('open');el('menuToggle').setAttribute('aria-expanded',String(open))};function renderNav(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let html=`<div class="side-label">學習導覽</div><button class="navbtn ${view==='home'?'active':''}" data-nav="home">使用導覽</button><button class="navbtn ${view==='caseList'||view==='case'?'active':''}" data-nav="caseList">情境案例（${getCases().length} 個）</button>${mode==='therapist'?'<button class="navbtn '+(view==='practice'?'active':'')+'" data-nav="practice">理論應用練習</button>':''}<div class="side-label">${mode==='family'?'照顧者教學｜6 章':'治療師理論｜10 章'}</div>`;getChapters().forEach((c,i)=>html+=`<button class="navbtn ${view==='chapter'&&chapter===i?'active':''}" data-chapter="${i}">${i+1}. ${esc(c.title)}</button>`);html+=`<div class="side-label">其他</div><button class="navbtn ${view==='refs'?'active':''}" data-nav="refs">研究與參考來源</button>`;el('sidebar').innerHTML=html;el('sidebar').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{closeMenu();go(b.dataset.nav)});el('sidebar').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{closeMenu();go('chapter',Number(b.dataset.chapter))})}function render(){renderNav();let out=({'home':home,'chapter':chapterView,'caseList':caseList,'case':caseView,'refs':refs,'practice':practice})[view]();el('main').innerHTML=out;wire()}
function home(){let fam=mode==='family';return `<div class="panel intro"><div class="kicker">${fam?'給家屬與第一線照顧者':'給職能治療師及其他復健專業人員'}</div><h2>${fam?'當家人不想復健，可以怎麼陪？':'動機式晤談：從理解概念到臨床判斷'}</h2><p>${fam?'當家人說「練了沒用」、「今天不想動」時，可以先了解他的身體狀況與想法，再討論是否需要改變安排。這份教材也會說明照顧者自己的疲累與求助方式。':'依動機式晤談第四版的公開核對資料與相關文獻編寫，包含核心技巧、維持語句與互動不協調、TTM 的區分、臨床安全與家庭共同決策。章節為原創編排，並非原著翻譯。'}</p><div class="callout"><strong>案例練習怎麼用？</strong><p>先閱讀「扮演的角色、已知情況、練習目標」，再選擇一句可能的回應。系統會呈現對方接著可能說的話，以及這個選擇的優點或限制。每個案例有兩次決策與四個可能結局，可回上一回合重新比較。<strong>不以最後答應復健作為成功標準，也沒有唯一萬用話術。</strong></p></div>${fam?'<p><strong>使用順序：</strong>可先閱讀六個主題，也能直接挑目前遇到的情境。前五章關於如何陪伴患者，第六章專門處理照顧者自身負荷，不需要把照顧者訓練成治療師。</p>':'<p><strong>使用順序：</strong>可依十章順序研讀，也可直接進入臨床案例。理論應用練習偏重概念理解，不能用來評定實際 MI 會談能力。</p>'}<div class="actions"><button class="btn primary" data-go="chapter">開始閱讀第一章 →</button><button class="btn" data-go="caseList">挑選案例練習 →</button>${!fam?'<button class="btn" data-go="practice">理論應用練習 →</button>':''}</div></div><div class="panel"><h2>${fam?'六個生活溝通主題':'十章系統性理論課程'}</h2><div class="card-grid">${getChapters().map((c,i)=>`<button class="tile" data-home-ch="${i}"><span>${fam?'主題':'章節'} ${i+1}</span><strong>${esc(c.title)}</strong><span>閱讀教學、看對話示範與日常應用 →</span></button>`).join('')}</div></div><div class="panel"><h2>情境練習</h2><p>每個案例都有各自的對話與結局。選擇不是為了說服成功，而是學習理解當下問題、選擇下一步。</p><div class="card-grid">${getCases().slice(0,4).map(c=>`<button class="tile" data-case="${c.id}"><strong>${esc(c.title)}</strong><span>${esc(c.meta['目標'])}</span></button>`).join('')}</div></div>`}
function chapterView(){let c=getChapters()[chapter];return `<article class="panel"><div class="kicker">${mode==='family'?'照顧者教學':'治療師理論'} · 第 ${chapter+1}／${getChapters().length} 章</div><h2>${esc(c.title)}</h2><div class="article">${c.html.replace(/(?:案例|練習)(?:F|T)\d{2}/g,"相關情境練習")}</div><div class="actions"><button class="btn" data-ch-prev ${chapter===0?'disabled':''}>← 上一章</button><button class="btn primary" data-ch-next>${chapter===getChapters().length-1?'返回第一章':'下一章 →'}</button><button class="btn" data-go="caseList">對應案例練習</button><button class="btn" onclick="window.print()">列印本章</button></div></article>`}
function caseList(){let groups=mode==='family'?['身體與安全','失落與期待','自主選擇','活動中的協助','反覆拒絕','照顧者支持']:['動機與障礙','對話任務及傾聽','改變語句與目標','計畫及行動','家屬與安全','界線及反思'];let a=getCases();return `<div class="panel"><div class="kicker">互動情境練習</div><h2>${mode==='family'?'家屬與照顧者':'治療師'}案例｜${a.length} 個</h2><p>每個案例都由一段實際情境開始。請先確認自己扮演誰、對方在意什麼，再選擇回應；選完可直接換選另一句，比較不同對話方向。情境不計分，也沒有保證有效的標準話術。</p><div class="card-grid">${a.map(c=>`<button class="tile" data-case="${c.id}"><span>${esc(c.meta['對應']||'情境練習')}</span><strong>${esc(c.title)}</strong><span>${esc(c.meta['目標']||'')}</span></button>`).join('')}</div></div>`}
function caseView(){let c=getCases().find(x=>x.id===caseId);if(!c){view='caseList';return caseList()}let n=c.nodes[nodeId];let finished=picked!==null&&!n.options[picked].next;return `<div class="panel"><div class="kicker">${mode==='family'?'家屬與照顧者':'治療師'}情境練習 · 決策 ${nodeId==='N1'?'1':'2'}／2</div><h2>${esc(c.title)}</h2><div class="label-line"><strong>扮演角色：</strong>${esc(c.meta['角色'])}</div><div class="label-line"><strong>已知情況：</strong>${esc(c.meta['已知'])}</div><div class="label-line"><strong>練習目標：</strong>${esc(c.meta['目標'])}</div><div class="progress"><div style="width:${nodeId==='N1'?50:100}%"></div></div>${trail.length?`<details class="toc"><summary>查看前一回合的選擇與回饋</summary>${trail.map(t=>`<p><strong>你的回應：</strong>${esc(t.choice)}<br><span class="muted">${esc(t.feedback)}</span></p>`).join('')}</details>`:''}<div class="case-quote">${esc(n.speaker)}</div><h3>此時可以怎麼回應？</h3>${n.options.map((o,i)=>`<button class="choice ${picked===i?'selected':''}" data-pick="${i}" aria-pressed="${picked===i}"><strong>${o.key}．</strong>${esc(o.text)}</button>`).join('')}${picked===null?'<p class="mini">兩個選項可能都有合理之處。選擇後可直接點另一個選項比較，不必先重設。</p>':`<div class="feedback"><strong>選擇回饋</strong><p>${esc(n.options[picked].feedback||n.options[picked].outcome||'這句話可作為當下的回應；應從安全、意願和實際協助條件判斷是否合適。')}</p>${finished?`<hr><strong>本分支可能的結局</strong><p>${esc(n.options[picked].outcome)}</p><p class="mini">這是教學模擬，不代表真實個案一定會出現相同結果。</p>`:`<p class="mini">這個選擇將帶入不同的對話情境。下一回合請根據對方的新資訊重新判斷，不必維持原本的方向。</p>`}</div>`}<div class="actions"><button class="btn" data-case-back ${trail.length?'':'disabled'}>← 上一回合</button><button class="btn primary" data-case-next ${picked===null||finished?'disabled':''}>下一回合 →</button><button class="btn" data-case-reset>重頭練習</button><button class="btn" data-go="caseList">返回案例清單</button></div></div>`}
function refs(){return `<div class="panel sources"><div class="kicker">證據來源與限制</div><h2>參考文獻與核對狀態</h2><p>資料源自 V3 內容審閱稿。第四版未取得全書逐頁核對，不得宣稱完整原文審查。家庭情境、對話選項與結局均為教學改編，並非經過信效度或臨床療效驗證的工具。</p><div class="article">${DATA.references}</div></div>`}
const exercises=[{q:'患者說：「你每次都沒問過我，就叫我做。」此刻優先留意什麼？',opts:['治療關係出現不協調（Discord）','直接歸類為對復健沒有動機','立即改訂每天練習次數'],answer:0,why:'焦點指向與治療師的互動。先聽見被忽略的感受、修復關係，再決定是否繼續討論活動。'},{q:'患者說：「我想恢復自己出門，但很怕跌倒。」哪個理解較完整？',opts:['有改變願望，也有對安全的擔心','已承諾明天自己出門','沒有改變意願'],answer:0,why:'「想自己出門」提供願望線索；害怕跌倒需要安全評估。不能直接認定已準備好行動。'},{q:'患者說：「我就是要自己用湯匙，請教我怎麼握。」下一步較適合？',opts:['持續追問十個想改變的理由','確認安全和能力後進入具體規劃','要求患者先做決策平衡表'],answer:1,why:'患者已表達清楚目標並要求方法；此時通常應轉入評估、示範及規劃，不必強迫進行 Evoking。'},{q:'下面哪個回應比較接近複雜反映？患者說：「我做了也一直要太太幫。」',opts:['「你做了，仍然需要太太協助。」','「需要別人幫忙，也讓你覺得自己失去了一些自主。」','「你應該再多練幾次。」'],answer:1,why:'加入關於自主的可能意義，屬需要留給本人修正的推測。第一句較接近簡單反映。'},{q:'對已同意的活動，患者說：「沒地方練，桌上都是東西。」應先？',opts:['重新提升練習意願','評估環境與可行替代安排','直接判定前思考期'],answer:1,why:'已表達願意，主要障礙是環境。從實際可及性與安全條件開始處理。'},{q:'患者明確拒絕某項非急迫自費服務時，何者較合適？',opts:['由家屬付費即可開始','確認理解、說明選項並尊重決定','繼續使用 MI 到患者同意'],answer:1,why:'專業建議不能取代本人知情選擇。MI 不應成為繞過拒絕的說服工具。'},{q:'重要性量尺 9 分、信心量尺 2 分，優先思考？',opts:['患者其實不重視目標','了解信心低的原因與需要的資源','繼續證明目標有多重要'],answer:1,why:'已知重要性高，問題可能在執行信心、能力或環境阻礙。'},{q:'家屬說：「我已經很累，每晚要起來好多次。」此時適合？',opts:['教更多督促復健的話術','先評估照顧負荷與安全，討論支援','只強調患者復健動機'],answer:1,why:'照顧者的需求應作為獨立服務問題。人力與休息問題無法只靠溝通技巧解決。'},{q:'下列哪個敘述最正確？',opts:['選擇題分數可當成 MITI 正式評估','MI 能保證提升 ADL','文字題可幫助概念理解，但不能取代可觀察會談與回饋'],answer:2,why:'知識理解與真實的會談忠實度、臨床能力是不同層次。'},{q:'當患者突然出現新的單側無力與口齒不清時？',opts:['先做動機式晤談','立即啟動緊急醫療評估','先用信心量尺確認意願'],answer:1,why:'急性症狀需要優先緊急評估，不能因談話介入延誤。'}];let exIndex=0,exPick=null;function practice(){let q=exercises[exIndex];return `<div class="panel"><div class="kicker">概念辨識 · 第 ${exIndex+1}／${exercises.length} 題</div><h2>理論應用練習</h2><p class="muted">依 V3 理論內容編寫的輔助練習，並非完整 MI 能力測驗，也不能作為 MITI 評分。</p><div class="progress"><div style="width:${100*(exIndex+1)/exercises.length}%"></div></div><div class="case-quote">${esc(q.q)}</div>${q.opts.map((o,i)=>`<button class="choice ${exPick===i?'selected':''}" data-ex-pick="${i}">${String.fromCharCode(65+i)}．${esc(o)}</button>`).join('')}${exPick===null?'':`<div class="feedback ${exPick===q.answer?'':'warning'}"><strong>${exPick===q.answer?'較符合本題的學習重點':'可以再比較其他選項'}</strong>${esc(q.why)}<br><span class="mini">參考選項：${String.fromCharCode(65+q.answer)}。真實臨床仍需依上下文判斷。</span></div>`}<div class="actions"><button class="btn" data-ex-prev ${exIndex===0?'disabled':''}>上一題</button><button class="btn primary" data-ex-next ${exPick===null?'disabled':''}>下一題 →</button></div></div>`}
function wire(){el('main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));el('main').querySelectorAll('[data-home-ch]').forEach(b=>b.onclick=()=>go('chapter',+b.dataset.homeCh));el('main').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>gotoCase(b.dataset.case));const prev=el('main').querySelector('[data-ch-prev]'),next=el('main').querySelector('[data-ch-next]');if(prev)prev.onclick=()=>go('chapter',Math.max(0,chapter-1));if(next)next.onclick=()=>go('chapter',(chapter+1)%getChapters().length);el('main').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{picked=+b.dataset.pick;render()});let b=el('main').querySelector('[data-case-next]');if(b)b.onclick=()=>{let c=getCases().find(x=>x.id===caseId),o=c.nodes[nodeId].options[picked];if(o?.next){trail.push({node:nodeId,choice:o.text,feedback:o.feedback});nodeId=o.next;picked=null;render();window.scrollTo({top:0,behavior:'smooth'})}};b=el('main').querySelector('[data-case-back]');if(b)b.onclick=()=>{if(trail.length){nodeId=trail.pop().node;picked=null;render()}};b=el('main').querySelector('[data-retry]');if(b)b.onclick=()=>{picked=null;render()};b=el('main').querySelector('[data-case-reset]');if(b)b.onclick=()=>{resetCase(caseId);render()};el('main').querySelectorAll('[data-ex-pick]').forEach(b=>b.onclick=()=>{exPick=+b.dataset.exPick;render()});b=el('main').querySelector('[data-ex-next]');if(b)b.onclick=()=>{exIndex=(exIndex+1)%exercises.length;exPick=null;render()};b=el('main').querySelector('[data-ex-prev]');if(b)b.onclick=()=>{exIndex=Math.max(0,exIndex-1);exPick=null;render()}}
render();</script></body></html>
