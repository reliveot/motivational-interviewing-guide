1.35;margin:10px 0;font-size:clamp(1.85rem,3vw,2.65rem);letter-spacing:-.04em}.hero p{color:#52685b;margin:0}.sheet{background:var(--paper);border:1px solid #e4e7df;border-radius:18px;padding:36px 43px;margin-bottom:20px;box-shadow:var(--shadow)}.kicker{color:var(--green);font-size:.8rem;font-weight:800}.pagetitle{font-size:clamp(1.5rem,2.5vw,2.05rem);line-height:1.4;margin:10px 0 24px}.prose h3{font-size:1.14rem;line-height:1.5;margin:32px 0 11px;border-left:3px solid #719583;padding-left:13px}.prose h4{font-size:1.02rem}.prose p{margin:13px 0}.prose ul,.prose ol{padding-left:1.4em}.prose table{display:block;overflow:auto;border:1px solid var(--line);border-radius:10px;border-spacing:0;max-width:100%;font-size:.91rem}.prose th,.prose td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.prose th{background:#edf2ed}.prose blockquote,.story{background:#f1f5f0;border-left:3px solid #9aaf9f;margin:15px 0;padding:14px 20px;border-radius:7px}.prose strong{color:#365a49}.prose hr{border:0;border-top:1px solid var(--line);margin:26px 0}.refjump{font-size:.83rem;color:#5e7568}.related{border:1px solid #dfe7db;background:#f4f7f1;padding:12px 15px;border-radius:12px}.related span{color:var(--muted);font-size:.81rem}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{border:1px solid var(--line);background:#fffefa;border-radius:14px;padding:21px;text-align:left;min-height:152px;display:flex;flex-direction:column;gap:8px}.tile:hover{background:#f3f7f1;border-color:#9bb5a2}.tile .small{font-size:.75rem;color:#577562;font-weight:800}.tile strong{font-size:1.06rem;line-height:1.5}.tile p{font-size:.84rem;color:var(--muted);margin:auto 0 0}.tag{display:inline-block;background:#edf2ed;color:#466b56;font-size:.75rem;border-radius:99px;padding:3px 11px;font-weight:700}.practiceIntro{margin:10px 0 20px;color:var(--muted)}.scenario{padding:18px 23px;border:1px solid #dce8db;background:#f6f8f4;border-radius:13px;margin:16px 0 25px}.question{font-size:1.06rem;font-weight:750;margin:23px 0 10px}.options{display:grid;gap:10px;margin:17px 0}.opt{background:#fffefa;border:1px solid #cddbd0;border-radius:13px;padding:14px 16px;width:100%;text-align:left;display:flex;align-items:start;gap:14px}.opt:hover{background:#f4f8f2;border-color:#8ca998}.opt.on{border:2px solid #43775c;padding:13px 15px;background:#eff5ee}.letter{width:32px;height:32px;flex:none;background:#e5efe6;border-radius:9px;text-align:center;font-weight:800;line-height:32px}.optiontext{min-width:0}.optiontext p{margin:0}.response{margin-top:17px;border:1px solid #cdded0;border-radius:14px;background:#f3f7f1;padding:19px 23px}.response .hint{font-size:.79rem;color:#507663;font-weight:800}.response p{margin:9px 0}.response strong{color:#325442}.details{border:1px solid var(--line);border-radius:13px;margin:19px 0;overflow:hidden;background:#fff}.details summary{cursor:pointer;padding:13px 17px;font-weight:800}.details .inner{padding:0 20px 17px}.disclaimer{font-size:.85rem;color:#60766a;border-top:1px solid var(--line);padding-top:15px;margin-top:20px}.pager{display:flex;justify-content:space-between;gap:12px;margin:15px 0}.pager button{border:1px solid var(--line);background:var(--paper);padding:10px 15px;border-radius:9px;max-width:49%;text-align:left}.pager button:disabled{opacity:.25;cursor:default}.foot{font-size:.82rem;color:var(--muted);margin-top:35px;padding:25px 0;border-top:1px solid var(--line)}.menu{display:none}.scrim{display:none}@media(max-width:940px){.frame{grid-template-columns:210px minmax(0,1fr);gap:20px;padding:20px 18px}.sheet{padding:27px}.hero{padding:29px}}@media(max-width:730px){.menu{display:inline-block}.top{padding:0 12px}.logo{font-size:.89rem}.sub{display:none}.frame{display:block;padding:15px 12px 48px}.aside{position:fixed;top:65px;bottom:0;left:0;width:min(320px,86vw);max-height:none;background:#fffefa;z-index:31;padding:16px 14px 50px;box-shadow:18px 0 45px #182a2440;transform:translateX(-1
