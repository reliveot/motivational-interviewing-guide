.option-card{border:1px solid #d2ded3;border-radius:14px;background:#fffefa;overflow:hidden}.option-card.on{border:2px solid #5f8a6e;background:#f3f8f1}.option-card .opt,.option-card .opt.on{border:0;border-radius:0;width:100%;padding:14px 15px;background:transparent}.option-card .opt:hover{background:#f5f8f4}.option-card .opt.on{padding:14px 15px}.inline-feedback{padding:15px 20px 20px;border-top:1px solid #d6e1d5;background:#f3f8f1}.inline-feedback p{margin:10px 0}.inline-feedback p:first-child{font-size:.89rem;font-weight:750;color:#365c49}.inline-feedback p:first-child strong{color:#365c49}.expicon{font-size:1.2rem;color:#63806b;font-weight:650;margin-left:auto;line-height:1.5}.pickhelp{font-size:.84rem;color:#688071}.takeaway{border-top:1px solid var(--line);padding:20px 0 8px;margin:20px 0}.takeaway p{line-height:1.9}.options{gap:12px}.scenario{line-height:1.85}.practiceIntro{line-height:1.8}</style></head><body><header><div class="top"><button class="uBtn menu" id="menu" aria-label="開啟目錄">☰</button><div class="logo">動機式晤談 × 復健溝通 <span class="sub">互動學習指南</span></div><div class="actions"><button class="uBtn" id="fontminus" aria-label="縮小字體">A−</button><button class="uBtn" id="fontplus" aria-label="放大字體">A＋</button><button class="uBtn print" onclick="window.print()">列印</button></div></div></header><div class="scrim" id="scrim"></div><div class="frame"><aside class="aside" id="aside"><input class="search" id="search" aria-label="搜尋章節或案例" placeholder="搜尋章節、情境…"><div id="nav"></div></aside><main class="content" id="main"></main></div><script>
const DATA={"core": [{"group": "family", "title": "先弄清楚：今天為什麼不想練？", "key": "F1", "body": "<h3>這一章要學會什麼？<\/h3>\n<p>先了解家人遇到什麼困難，再決定是休息、調整安排，還是找專業人員協助。家屬不需要自行判斷疾病原因。<\/p>\n<h3>同一句「不要」，可能有不同意思<\/h3>\n<p>家人可能怕痛、怕跌倒、身體很累，也可能聽不懂要求，或覺得活動和自己的生活沒有關係。即使他昨天能做，今天的狀態也可能不同。中風後疲勞需要被了解與評估，不能只用「再努力一點」處理。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p><strong>可以先做三件事：<\/strong> 停下正在增加不舒服的活動；用短句問清楚；看看是否和平常不同。若已出現緊急警訊，立即求援，無須先問完問題。沒有急迫狀況時，一次問一件事，例如「哪裡不舒服？」或「你說累，是想休息，還是這個動作特別吃力？」也保留「其他原因」的空間。<\/p>\n<h3>對話示例：穿衣時說會痛<\/h3>\n<p>丈夫：「先不要拉，肩膀會痛。」<br/>\n太太：「好，先停。你可以指哪裡痛嗎？」<br/>\n丈夫：「這裡，拉到就痛。」<br/>\n太太：「我先不再拉。如果不知道怎麼穿才安全，我們先保暖、遮好，請人協助，再把剛才的情況告訴醫療人員。」<\/p>\n<p>停止引發疼痛的動作，不等於放棄照顧。衣服還沒穿好時，仍要兼顧保暖、隱私與合適協助。曾經學過的方法，若現在會痛，也要重新確認；不要再做一次來證明痛不痛。<\/p>\n<h3>常見誤會與實際做法<\/h3>\n<p>「今天不想做」尚不足以判斷動機。可回報「什麼時間、正在做什麼、本人說什麼、停止後如何」，比「他又不配合」更有幫助。沒有看見新症狀，也不代表家屬已排除所有身體問題；若情況不明、持續或加重，就尋求評估。<\/p>\n<p>如果本人目前不想談，先停止非必要追問，安排需要的照護。反覆疲累、疼痛或活動能力改變時，與團隊重新討論，而非每天換一種方式催促。<\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C06\" href=\"#C06\">相關練習：想去市場，卻怕活動後累一整天 →<\/a><\/p>\n"}, {"group": "family", "title": "聽到「練了沒用」，怎麼回應挫折？", "key": "F2", "body": "<h3>先分開感受與結論<\/h3>\n<p>「都沒有進步」有時在描述能力，有時在說付出與期待之間的落差。先理解難過，不必立刻判定復健有效或無效。急著列舉進步，可能讓對方覺得自己的失望沒有被聽見；直接附和「真的都沒用」，也會把尚未評估的結論說死。<\/p>\n<h3>用家人聽得懂的話回應<\/h3>\n<p>可以說：「你花了很多力氣，今天還是卡在這裡，真的很失望。」說完停一下，讓他補充。若他說「我是累，不是失望」，可回應：「我剛才理解錯了，你現在最困擾的是太累。」不必證明自己猜得對。<\/p>\n<p><strong>理解並不要求長篇說話。<\/strong>「今天很挫折。」加上安靜陪伴，有時比連續提問更合適。若本人想聽實際觀察，再描述發生什麼：「今天穿袖子時，你自己把手移進去一段，後面還是需要我幫忙。」保留協助與困難，不用這段表現反駁他的整體感受。<\/p>\n<h3>對話示例：懷念以前的自己<\/h3>\n<p>家人：「以前穿衣服一下就好，現在像小孩一樣。」<br/>\n照顧者：「以前不用想就能做，現在連這件事都要花很多力氣。」<br/>\n家人：「我只是很難過，你不用一直安慰我。」<br/>\n照顧者：「好，我陪你，不急著說什麼。」<\/p>\n<p>這段對話可以停在陪伴，無須立刻接成「那我們來練」。若他願意繼續，再問最在意哪件事；若不願意，尊重停止。<\/p>\n<h3>什麼時候需要其他協助？<\/h3>\n<p>持續低落、對原本喜歡的事失去興趣，或睡眠、食慾與生活明顯改變時，向醫療團隊反映。單句「練了沒用」不能用來診斷憂鬱症；溝通也不能取代評估。若有立即安全疑慮，先求援。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C01\" href=\"#C01\">延伸練習：「昨天還可以，今天又不行」：先陪伴還是一起找原因？ →<\/a><\/p>\n"}, {"group": "family", "title": "提供真的可以選擇的下一步", "key": "F3", "body": "<h3>先確認願不願意，再談怎麼做<\/h3>\n<p>「練五分鐘還是十分鐘？」只有在本人願意練的前提下，才是有意義的選擇。尚未同意時，可以先問：「現在方便談一下今天的安排嗎？」本人願意後，再了解想處理的問題及可行選項。<\/p>\n<p>選項可以包括先談一談、換時間、調整活動或暫停這次練習。它們需要符合當下情況，不能承諾不安全的做法，也不能把必要照護直接取消。若不確定怎麼調整，先請治療師協助。<\/p>\n<h3>對話示例：生活期待與練習不同<\/h3>\n<p>太太：「我只想自己拿遙控器，不想一直做那些動作。」<br/>\n先生：「你想先把拿遙控器這件事弄方便一點。要不要先看放哪裡比較好？」<br/>\n太太：「放近一點就好，今天不想練。」<br/>\n先生：「好，先一起找方便又穩的位置。想學其他拿法時，再跟治療師討論。」<\/p>\n<p>把物品放得方便，可以直接改善生活，不必所有需求都先變成訓練。但若擺放涉及跌落、伸手不穩等風險，仍需評估。<\/p>\n<h3>對方說不要之後<\/h3>\n<p>可以簡短確認是否希望改天再提；已明確要求停止，就停止非必要邀請。不要不斷換活動，直到他勉強答應。反覆拒絕時，另找合適時機重新討論計畫與負擔，而非每天重新說服。<\/p>\n<p>必要照護若被拒絕，例如涉及當下健康與安全的安排，應請專業人員協助說明風險、選項與後續。尊重意見與持續照護可以同時進行；家屬不必獨自承擔判斷。<\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C05\" href=\"#C05\">相關練習：「照你說的就好」：先確認哪一件事？ →<\/a><\/p>\n"}, {"group": "family", "title": "活動中怎麼幫，才能保留參與的空間？", "key": "F4", "body": "<h3>「幫我」不等於什麼都不想做<\/h3>\n<p>家人可能只需要協助找到袖口、固定物品，或提示下一步，也可能真的需要休息。可先問：「你要我幫哪一段？」若不容易回答，用實物或短句協助表達，並確認理解。<\/p>\n<p>協助程度要看安全、能力、當下狀態和生活時間。趕著出門時先協助完成、另外找時間練，也是可討論的安排；不能把所有生活活動都變成測驗。<\/p>\n<h3>提示與回饋<\/h3>\n<p>非急迫情況下一次給一個提示，留時間反應。不要多人同時說，也不要每個小動作都糾正。必要安全提醒可直接簡短說明；其他回饋先問本人喜歡當下聽，還是做完再談。<\/p>\n<p>「剛才你自己把毛巾移到桌邊，我有幫忙固定盆子」是具體描述。「你看，你明明就可以」容易被聽成以前都不夠努力。若本人不喜歡被稱讚，可以改成描述差異，不必要求他接受鼓勵。<\/p>\n<h3>對話示例：提醒太多<\/h3>\n<p>家人：「你一直說這裡不對、那裡不對，我不做了。」<br/>\n照顧者：「剛才我說太多了，先停。」<br/>\n家人：「我問你的時候你再說。」<br/>\n照顧者：「好，必要的安全提醒我會說，其他等你問。今天要先收起來也可以。」<\/p>\n<p>減少提示後，仍要確認本人想不想繼續；不生氣了，不代表已同意活動。<\/p>\n<h3>協助方式需要實際學習<\/h3>\n<p>移位、站立與患側上肢的協助，應由專業人員評估及示範。文字對話不能教會安全扶持。若照顧者不會做、做起來疼痛或自己也不舒服，先求助，不能為了保留患者自主就撤掉必要支援。<\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C02\" href=\"#C02\">延伸練習：快出門了，這次要幫到哪裡？ →<\/a><\/p>\n"}, {"group": "family", "title": "一直不願意時，整理問題、重新討論", "key": "F5", "body": "<h3>看具體情況，少用總括評語<\/h3>\n<p>有人不想站，卻願意坐著準備餐具；有人願意練，但忘記步驟；也有人明確理解後選擇不接受某項安排。「不配合」很難讓團隊知道需要處理什麼。<\/p>\n<p>可以這樣回報：「這三天早餐後提站立時，他都說膝蓋會軟；坐著摺毛巾願意。我不確定現在怎麼扶比較安全。」記錄本人說法與觀察，不替他補上原因。簡短幾句即可，不需要額外建立繁重紀錄。<\/p>\n<h3>對話示例：害怕站立<\/h3>\n<p>家人：「我不要站，怕你接不住。」<br/>\n照顧者：「這個擔心要讓治療師知道。先不硬站，我們請他看怎麼協助。」<br/>\n家人：「不要跟他說我什麼都不做。」<br/>\n照顧者：「我會分開說，你坐著會參與，站立時擔心跌倒。」<\/p>\n<p>找專業人員的目的是重新評估，不是找另一個人接力說服。聯絡後確認等待期間怎麼照顧、由誰回覆，避免只留下「再看看」。<\/p>\n<h3>語言不通、聽不懂或說不清楚<\/h3>\n<p>先降低語言負擔：一次一件事，使用短句、圖片、指認或適當示範。需要時安排語言治療或合適口譯。點頭不必然表示理解；說不出長句也不表示沒有想法。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>家庭看護工若聽不懂拒絕原因，可以說：「先停。我不確定他的意思，需要一起確認。」家屬與團隊應提供可理解的照顧指引、停止條件及聯絡方式。不能把患者是否答應當成看護的績效，也不能要求看護自行判斷心理或醫療問題。<\/p>\n<p>本章屬溝通支持、臨床評估與照護協調。沒有另外設選擇題；重點是把實際資訊帶給團隊。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n"}, {"group": "family", "title": "照顧者支持：把自己的需要也放進計畫", "key": "F6", "body": "<h3>疲累有時需要人力與分工<\/h3>\n<p>夜間反覆起床、白天工作、家人的不同期待及經濟壓力，都可能讓照顧者吃不消。溝通技巧不能代替休息、服務與人力。照顧者可以提出界線，也可以不知道怎麼解決時就先求助。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>怎麼說，別人才知道需要幫什麼？<\/h3>\n<p>從一件最困擾的事開始，說明影響，再提出希望討論的協助。例如：「我這週晚上常被叫醒，白天精神很差。我需要有人一起安排夜間照顧和能補眠的時段。」需求不一定是請人代做所有事，也可以是幫忙聯絡、陪同討論、準備物品或安排服務。<\/p>\n<h3>對話示例：不是再教一句鼓勵的話就夠<\/h3>\n<p>照顧者：「我每天催他，吵完還要照顧，真的很累。」<br/>\n支持者：「現在連提醒練習也由你一個人負責，負擔很重。你最希望先少掉哪一件事？」<br/>\n照顧者：「不要再叫我每天監督。」<br/>\n支持者：「我們一起請治療師重新談提醒方式，也看哪些事情可以分給其他人。」<\/p>\n<p>對話焦點是照顧者的需要，不必接成「那你再努力讓患者願意」。若家人無法接手，可以繼續了解服務與替代方式；沒有立刻找到資源，不代表照顧者表達得不好。<\/p>\n<h3>界線與安全要一起安排<\/h3>\n<p>需要休息時，應協調交接或尋求支援，不能讓依賴照護的人突然失去必要協助。家庭看護工同樣需要可行的工作安排與休息，不應靠無限增加責任填補資源不足。<\/p>\n<p>若疲累、失眠或衝突已影響照顧安全，應儘快找家人、個管師或醫療團隊一起處理；立即危險先求援。照顧者也可以為自己的健康尋求評估。<\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C03\" href=\"#C03\">延伸練習：我已經很累，下一步要找誰談？ →<\/a><\/p>\n<hr/>\n"}, {"group": "therapist", "title": "MI處理什麼問題？先形成合理的臨床理解", "key": "T1", "body": "<p><strong>學習目標：<\/strong> 說明MI的方向性與合作基礎，區分動機、能力、環境及健康問題，辨識Fixing Reflex。<\/p>\n<h3>定義與理論背景<\/h3>\n<p>MI是一種以人為中心、引導式的溝通方法，協助本人探索改變與成長的意義，並支持自身的動機與投入。此為本教材意譯性概述，非原書逐字定義。復健應用時，需把討論方向具體化，例如「是否願意嘗試某種穿衣方式」，避免將「變好」直接視為接受全部訓練的同意。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>MI源自臨床實務的發展，與以人為中心的傾聽有關。後續理論討論關注合作、同理等關係面向，以及治療師如何回應改變語言的技術面向。這些提供理解與研究方向，不等於每一段會談都有固定因果鏈，也不能簡化成「多說改變語句，就會恢復功能」。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>引導有方向，也保留選擇<\/h3>\n<p>一般支持性談話可以暫不追求改變。MI在形成可接受的焦點後，會有意識地探索本人支持改變的理由；這份方向應透明、符合本人福祉，並持續檢查是否仍可共同討論。尚未同意訓練時，可以先談對訓練的看法，無須先取得「承諾改變」才建立關係。反過來，不能把家屬或治療師偏好的結果偷偷包裝成患者的理由。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>不願執行之前，還需要知道什麼？<\/h3>\n<table>\n<thead>\n<tr>\n<th>表達與背景<\/th>\n<th>尚需了解的問題<\/th>\n<th>優先方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>「想自己洗澡，又怕很累」<\/td>\n<td>疲勞程度、想改善哪一步、是否願意談<\/td>\n<td>評估與探索可並行<\/td>\n<\/tr>\n<tr>\n<td>「想練，但桌子不能用」<\/td>\n<td>空間、家人使用、替代方式<\/td>\n<td>環境協調<\/td>\n<\/tr>\n<tr>\n<td>「不知道你叫我做什麼」<\/td>\n<td>理解、語言、聽力及指令負荷<\/td>\n<td>溝通與教學調整<\/td>\n<\/tr>\n<tr>\n<td>「你一直逼我」<\/td>\n<td>互動中發生什麼、是否要停止<\/td>\n<td>修復合作<\/td>\n<\/tr>\n<tr>\n<td>新出現單側無力或說話改變<\/td>\n<td>急迫健康風險<\/td>\n<td>緊急醫療處置<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>此表為臨床延伸，無法以勾選項目取代評估。不同因素可同時存在。<\/p>\n<h3>Fixing Reflex：好意如何變成太快的安排？<\/h3>\n<p>Fixing Reflex指助人者看見問題後，想迅速修正、解決或避免傷害的自然傾向；舊版常見Righting Reflex用語。需要覺察的是這份衝動如何影響互動，不是禁止專業建議。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>患者：「練完會累，下午什麼都不想做。」<br/>\n治療師若立刻說「那就少量多次」，可能還不知道疲勞來源、下午的重要活動或患者想討論什麼。可先問：「這種累對你下午影響最大的是什麼？」也可能需先評估症狀。等焦點清楚，再提供具體建議，專業角色仍然存在。<\/p>\n<p><strong>常見誤用：<\/strong> 把所有拒絕叫作抗拒；為避免Fixing Reflex而完全不給資訊；要求家屬用更好話術解決人力或疼痛問題。反思時可問：「我現在是在補足本人需要的資訊，還是在急著把對話帶到自己的答案？」<\/p>\n"}, {"group": "therapist", "title": "MI精神與四項任務：當下需要完成哪件事？", "key": "T2", "body": "<p><strong>學習目標：<\/strong> 將精神落實為會談行為，判斷何時建立關係、聚焦、喚起及規劃。<\/p>\n<h3>版本與用語<\/h3>\n<p>第四版以合作（partnership）、接納（acceptance）、關懷（compassion）、賦權（empowerment）描述MI精神，並稱engaging、focusing、evoking、planning為四項任務（tasks）。第三版常見「四項歷程」（processes）及精神中的evocation。這是版本用語差異；第四版仍保留喚起任務，不能說evoking已被刪除。本文以「四項任務」為主。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>精神如何在實際會談中被看見？<\/h3>\n<table>\n<thead>\n<tr>\n<th>精神<\/th>\n<th>意義與操作示例<\/th>\n<th>不可誤解為<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>合作<\/td>\n<td>雙方帶入不同專長；治療師說明評估，患者說明生活及偏好，再協商焦點<\/td>\n<td>治療師放棄責任，讓患者猜答案<\/td>\n<\/tr>\n<tr>\n<td>接納<\/td>\n<td>嘗試理解本人經驗與價值，避免以順從決定其是否值得服務<\/td>\n<td>同意所有看法或接受不安全處置<\/td>\n<\/tr>\n<tr>\n<td>關懷<\/td>\n<td>優先考量本人福祉，注意服務負擔與權力差異<\/td>\n<td>只讓對話氣氛愉快<\/td>\n<\/tr>\n<tr>\n<td>賦權<\/td>\n<td>辨認並支持使用已有的能力、資源與選擇空間<\/td>\n<td>把責任全部交還本人<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>接納包含對人及其自主的尊重。提供必要風險資訊、明確安全界線，仍可用尊重方式進行。精神不靠說一句「決定權在你」就完成，還要看拒絕後是否真的受到尊重。<\/p>\n<h3>四項任務的判斷與轉換<\/h3>\n<table>\n<thead>\n<tr>\n<th>任務<\/th>\n<th>要釐清的事<\/th>\n<th>原創復健示例<\/th>\n<th>可能需要返回的情況<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>建立關係 Engaging<\/td>\n<td>能否在被理解、尊重的情況下合作<\/td>\n<td>「上次那個安排，你覺得最不合適的是什麼？」<\/td>\n<td>對方感到被責備、忽略或操控<\/td>\n<\/tr>\n<tr>\n<td>聚焦 Focusing<\/td>\n<td>現在一起談什麼方向<\/td>\n<td>「洗澡、外出和手部練習，今天先談哪個最有關係？」<\/td>\n<td>雙方談的其實是不同目標<\/td>\n<\/tr>\n<tr>\n<td>喚起 Evoking<\/td>\n<td>本人對這項改變的理由、希望及把握<\/td>\n<td>「如果穿衣能自己完成一部分，對你有什麼不同？」<\/td>\n<td>問題太抽象、方向不被接受或關係緊張<\/td>\n<\/tr>\n<tr>\n<td>規劃 Planning<\/td>\n<td>是否準備談做法，如何執行與調整<\/td>\n<td>「你想先試哪一步？需要哪些支持？」<\/td>\n<td>意願不確定、負擔過大或條件不足<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>四任務可交錯或往返，沒有固定每項幾分鐘。規劃也不是每次談話都必須抵達的終點。已有清楚意願的人，可直接進入規劃；在規劃中出現「你又沒聽我說」，可能要先修復關係。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p><strong>教學檢核：<\/strong> 看到患者問「可以教我怎麼擺手嗎？」時，先考慮是否已具備焦點與意願，不要為了走完流程又要求說出三個改變理由。任務是理解會談的工具，不能只由單一問句硬分類。<\/p>\n"}, {"group": "therapist", "title": "OARS：把傾聽轉成可以使用的回應", "key": "T3", "body": "<p><strong>學習目標：<\/strong> 區分四種技巧，寫出有根據的肯定及摘要，並修正反映中的推測。<\/p>\n<h3>OARS的功能<\/h3>\n<p>OARS是開放式提問（Open questions）、肯定（Affirmations）、反映（Reflections）、摘要（Summaries）。這些技巧可用於不同任務，也存在於其他溝通方法；只使用OARS不等於完整MI。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>以下共同起點只有一句：患者說「我有練，可是每次都要太太幫，我覺得很沒用」。<strong>目前沒有證據表示他擔心太太的負擔<\/strong>，不能把這個推測直接寫進肯定或摘要。<\/p>\n<table>\n<thead>\n<tr>\n<th>回應形式<\/th>\n<th>示例<\/th>\n<th>用途與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>開放式提問<\/td>\n<td>「需要幫忙時，最讓你不好受的是什麼？」<\/td>\n<td>打開本人經驗；太抽象時可改問具體活動，不能連問到像盤問<\/td>\n<\/tr>\n<tr>\n<td>肯定<\/td>\n<td>「即使做起來不順，你還是持續找機會練。」<\/td>\n<td>依據已說出的努力；不追加尚未表達的孝順、責任感或動機<\/td>\n<\/tr>\n<tr>\n<td>簡單反映<\/td>\n<td>「你有練，但還是需要太太幫。」<\/td>\n<td>保留核心意思，適合先確認理解<\/td>\n<\/tr>\n<tr>\n<td>複雜反映<\/td>\n<td>「需要幫忙這件事，讓你連自己已經付出的努力都很難看見。」<\/td>\n<td>提出可能的意義；可能猜錯，須等待本人修正<\/td>\n<\/tr>\n<tr>\n<td>摘要<\/td>\n<td>「你有練習，仍需要協助，這讓你覺得自己很沒用。我有漏掉什麼嗎？」<\/td>\n<td>整理已知內容，不把臨床推測當既定事實<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>開放式提問：開放不等於不帶壓力<\/h3>\n<p>「你為什麼一直不努力？」形式上可以自由回答，內容卻已先判定不努力。可改問「這週安排進行得怎麼樣？」再依回答追問。安全確認、疼痛位置、時間及同意範圍，可以用簡短封閉問題；不必為追求開放比例而讓人更難回答。<\/p>\n<p>問完先聽，適時反映對方的回答。若患者停頓、疲倦或只有很短回應，考慮語言負荷與當下需求，不能把增加問題數當作更深入。<\/p>\n<h3>肯定：辨認努力、資源與價值<\/h3>\n<p>肯定要有根據，也要符合本人的感受。「你今天主動說出哪裡不舒服，讓我們能調整」比「你最棒了」更具體。肯定不只針對遵從或成功，也能辨認求助、表達界線及持續嘗試。<\/p>\n<p>若患者覺得被哄，先回應這份不舒服，協商回饋方式。即使是具體肯定，也不是所有人當下都想聽。不要為了展示同理而替他安上「你是個很負責的人」等未有充分依據的特質。<\/p>\n<h3>反映：用理解作暫時假設<\/h3>\n<p>簡單與複雜反映的差異，在於是否增加或改變意義、重點或情緒強度，與句子長短無關。僅換同義字通常仍偏簡單；若明顯提高強度，就可能改變意思，不能一概當作簡單反映。正式編碼仍需依手冊和上下文判定。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>反映通常用陳述語氣，說完留空間。患者修正時，可說：「我剛才猜錯了，你在意的是……」再用他提供的新資訊回應。猜錯不必然破壞關係；堅持解釋「其實你就是這樣想」才可能讓對方失去表達空間。<\/p>\n<h3>摘要：選擇重點，但不能改寫本人<\/h3>\n<p>摘要可以整理零散資訊、連結先前說過的理由，或在轉換議題前確認。在已有共同改變方向的MI中，可以突出本人支持改變的內容，但仍需忠實呈現關鍵顧慮，不能刪掉拒絕條件或把「考慮看看」改成「決定要做」。<\/p>\n<p>「你想自己穿衣，也說早上太趕。接下來想先談時間安排，還是先停在這裡？」比只總結「你想獨立，所以我們開始」更保留原意。<\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"S02\" href=\"#S02\">相關練習：哪些意思是患者說的，哪些是我加的？ →<\/a><\/p>\n"}, {"group": "therapist", "title": "Change Talk、Sustain Talk與Discord：先有焦點，才有分類", "key": "T4", "body": "<p><strong>學習目標：<\/strong> 區分語言的方向與關係訊號，理解DARN–CAT但不把它當階段或同意判定。<\/p>\n<h3>三種概念處理不同的資訊<\/h3>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>定義要點<\/th>\n<th>指定目標「嘗試一項穿衣方法」時的例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Change Talk 改變語句<\/td>\n<td>支持朝特定改變方向前進的表達<\/td>\n<td>「如果可以自己穿一段，早上就不用等。」<\/td>\n<\/tr>\n<tr>\n<td>Sustain Talk 維持語句<\/td>\n<td>支持維持相關現狀、暫不改變的表達<\/td>\n<td>「現在讓家人幫比較省時間，我不想改。」<\/td>\n<\/tr>\n<tr>\n<td>Discord 互動不協調<\/td>\n<td>對話中合作或關係出現摩擦的訊號<\/td>\n<td>「我已經說不要，你怎麼一直逼？」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>同一句話可能同時包含幾種訊息。維持語句不等於人際衝突；治療師也不能因患者不同意就判為discord。疼痛、疲勞或資源不足的陳述，需依語境理解，不要一律編碼成維持語句而忽略事實內容。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>DARN–CAT：幫助聽懂語言，不是七個進度關卡<\/h3>\n<p>DARN通常歸於準備性改變語言；CAT歸於動員性改變語言。它們不要求按順序出現，同一句可有多個成分，也不能由出現某一類就推論準備好接受治療。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<table>\n<thead>\n<tr>\n<th>類別<\/th>\n<th>意義<\/th>\n<th>同一穿衣目標下的自編示例<\/th>\n<th>接續方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D：Desire<\/td>\n<td>想要、希望<\/td>\n<td>「我想自己把衣服拉好。」<\/td>\n<td>問希望帶來什麼生活差異<\/td>\n<\/tr>\n<tr>\n<td>A：Ability<\/td>\n<td>對可行性的信念<\/td>\n<td>「衣服先擺好，我也許做得到。」<\/td>\n<td>了解讓它可行的條件，不當作客觀能力評估<\/td>\n<\/tr>\n<tr>\n<td>R：Reasons<\/td>\n<td>支持改變的理由<\/td>\n<td>「這樣早上不用一直等人。」<\/td>\n<td>反映理由或邀請具體說明<\/td>\n<\/tr>\n<tr>\n<td>N：Need<\/td>\n<td>需要、迫切感<\/td>\n<td>「這件事我得想個辦法。」<\/td>\n<td>釐清迫切來源，不直接加上訓練量<\/td>\n<\/tr>\n<tr>\n<td>C：Commitment<\/td>\n<td>要採取行動的意向或承諾<\/td>\n<td>「明天我會試你教的那一步。」<\/td>\n<td>核對自願性、理解及可行安排<\/td>\n<\/tr>\n<tr>\n<td>A：Activation<\/td>\n<td>願意、準備或考慮行動的傾向，尚未明確承諾<\/td>\n<td>「我願意考慮試一段。」<\/td>\n<td>詢問還需要哪些資訊或條件<\/td>\n<\/tr>\n<tr>\n<td>T：Taking Steps<\/td>\n<td>描述已採取的相關步驟<\/td>\n<td>「昨天我先把衣服擺好了。」<\/td>\n<td>了解實際經驗；自述步驟仍不等於完整活動已達成<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>怎麼回應改變與維持語句？<\/h3>\n<p>本人說「想自己穿」，可以請他舉例、說明意義，或反映他重視的部分。不要每句都追問理由，讓對話變成必須證明動機的考試。<\/p>\n<p>本人說「早上太趕」，可承認時間成本，再詢問是否想討論其他安排。回應維持語句並非把它壓下去，也不需和他辯論。已有共同方向時，避免無目的地反覆要求列出不改變的所有好處；同時，與安全、資源和偏好相關的顧慮必須被充分理解。<\/p>\n<h3>承諾語言不等於知情同意<\/h3>\n<p>「好啦，照你說的就好」可能是真心信任與願意，也可能是疲勞、禮貌或想結束對話。不能只靠語氣判定不自主，也不能只看「好」就開始處置。需要分開確認所理解的安排、願意的範圍，以及有沒有顧慮或壓力。支持自主的談話不取代知情同意程序。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p class=\"related\"><span>延伸閱讀與應用<\/span><br/><a data-jump=\"C04\" href=\"#C04\">延伸練習：「你有聽我說嗎？」此刻先處理哪件事？ →<\/a><\/p>\n"}, {"group": "therapist", "title": "進階反映：讓矛盾說得更清楚", "key": "T5", "body": "<h3>反映是一個可被修正的理解<\/h3>\n<p>簡單反映重述或小幅改述；複雜反映加入對情緒、意義、價值或未說明關聯的推測，也可能改變原話的重點或強度。兩者的差別在於理解如何被增加或改變，不能按句子長短分類。反映通常用陳述語氣，仍需留下讓對方否認或補充的空間。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>患者說：「每次出門都要等人來接。」可以簡單反映：「出門得配合接送。」若先前談過失去自主的困擾，可試著反映意義：「連何時出門都不能自己決定，這讓你很受限。」後句的理解較深，也可能猜錯。患者若說「我只怕他等太久」，應回應：「你比較在意讓接送的人久等，我剛才理解偏了。」不必為自己的推測辯護。<\/p>\n<h3>雙面反映如何使用？<\/h3>\n<p>雙面反映將本人對某個改變的兩面想法放在一起，讓矛盾能被聽見。例如患者已說過想逛市場，也說活動後整天疲累，可以反映：「你想自己去挑菜，同時擔心練完就沒力氣過剩下的一天。」<\/p>\n<p>這句話保留了生活目標與代價，沒有假定哪一面比較真實。在已有共同改變方向的MI談話中，可依脈絡把本人支持改變的一面放在後面，接著探索其意義；這只是談話選擇，不能把另一面抹掉。連接詞「同時」「一方面……另一方面……」通常較容易保留兩面。「但是」可能讓前半句被否定，仍須看語氣及整段談話，不能單靠一個連接詞判斷MI品質。<\/p>\n<p>使用前，先確認兩面都有根據。患者只說「站起來很痛」，直接反映「雖然痛，你還是想趕快走路」會替他加入未表達的願望。疼痛也需要評估，不能被放進漂亮句型後就略過。<\/p>\n<h3>其他反映方式及其風險<\/h3>\n<table>\n<thead>\n<tr>\n<th>方式<\/th>\n<th>自編示例與適用情境<\/th>\n<th>常見誤用與修正<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>情感或意義反映<\/td>\n<td>「你最難受的，是連熟悉的事都要重新學。」用於已有失落線索時<\/td>\n<td>把猜測當診斷。若對方修正，回到他的意思<\/td>\n<\/tr>\n<tr>\n<td>延續語意<\/td>\n<td>患者談到練習後無力做晚餐：「這樣一來，練習可能反而擠掉你重視的晚餐時間。」<\/td>\n<td>補出未提過的因果或價值；要以已知情境為依據<\/td>\n<\/tr>\n<tr>\n<td>淡化反映<\/td>\n<td>對強烈的「我真的受夠每天被催」說「每天被催讓你很不舒服」<\/td>\n<td>過度淡化可能被聽成不當回事；看對方是否覺得被理解<\/td>\n<\/tr>\n<tr>\n<td>放大反映<\/td>\n<td>對反覆描述「所有練習都像被逼」的人試探：「目前連想到練習，都像又要被安排一次。」<\/td>\n<td>誇張成「那你永遠都不想好了」會帶入羞辱或激將。初學者宜先用較貼近原意的反映<\/td>\n<\/tr>\n<tr>\n<td>比喻反映<\/td>\n<td>對方說每天行程被塞滿：「一天好像沒有留給你喘氣的空檔。」<\/td>\n<td>比喻要符合對方用語；跨語言、失語或理解負荷較高時，直接短句通常較合適<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>上述例句不是必須背誦的技巧清單。放大或淡化反映不保證引出相反立場，也不應以激怒對方來取得改變語句。複雜反映的價值取決於是否貼近對方、能否促進理解，不在於聽起來有多深刻。<\/p>\n<h3>練習與判斷<\/h3>\n<p>讀到「我不想再麻煩女兒」時，先區分已知與推測。已知的是不想造成麻煩；不知道的是他想減少練習、增加自主、換協助者，還是另有顧慮。可先回應「你很在意她要付出多少」，再讓他說明。不要直接接成「所以你應該更努力」。相關案例\u0001範反映失準後如何修復；示範雙面反映何時需要轉向條件評估。<\/p>\n"}, {"group": "therapist", "title": "Ask–Offer–Ask：把專業資訊放進合作對話", "key": "T6", "body": "<h3>定義與用途<\/h3>\n<p>Ask–Offer–Ask（詢問—提供—再詢問）是一種交換資訊與建議的方式，和MI文獻中的Elicit–Provide–Elicit相近：先了解對方已知、想知道及是否願意聽，再提供有關資訊，最後探索對方如何理解與看待。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 它適用於衛教、說明選項與提出建議，但不能取代完整的風險說明或知情同意。<\/p>\n<p>第一個Ask可以是「你對這個方法已經知道什麼？」也可以是「你最想先弄清楚哪件事？」對方已明確請求示範時，通常已提供談這件事的邀請，不必每一句都重新取得形式上的許可。<\/p>\n<p>Offer要回應當下問題，分小段說明，區分確定的內容、可能利益、負擔及不確定性。可以提供專業建議並說明理由，不必假裝所有選項都一樣好。最後的Ask關心資訊的意義，例如「這個安排對你最難的是哪一段？」不能只用「懂了嗎」結束。<\/p>\n<h3>完整短例：患者主動要求教學<\/h3>\n<p>患者：「我想先學怎麼把袖子穿好，你直接教我。」<br/>\n治療師：「可以。你現在最容易卡在哪一步？」<br/>\n患者：「袖口一直找不到。」<br/>\n治療師：「我們先把袖口放在你看得到的位置。我示範這一小段，再看你用起來如何。若拉扯或疼痛就停，我們重新調整。」<br/>\n示範後，治療師：「剛才哪一部分比較容易？哪一部分還需要我幫忙？」<\/p>\n<p>此處以教學和活動評估為主，沒有必要先進行一輪引出改變理由的談話。可維持MI的合作精神，同時使用其他專業方法。具體穿衣方式仍需依個別評估，例句不提供可直接套用的動作處方。<\/p>\n<h3>再詢問與teach-back有何不同？<\/h3>\n<p>「這個建議對你有什麼意義？」探索看法；「為了確認我說清楚了，可以請你用自己的方式告訴我回家準備怎麼做嗎？」確認理解。後者是teach-back的應用，屬於健康溝通方法，可與MI搭配。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 若涉及實作，也可在安全條件下請對方示範，由專業人員觀察。<\/p>\n<p>患者能重述內容，不代表同意執行。患者想執行，也不代表已理解風險與步驟。兩者應分開確認；教學者要承擔重新說明的責任，避免把teach-back變成考試。理解困難時可調整文字、圖示、語速、環境或使用合適口譯，再檢查支持是否有效。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>常見誤用<\/h3>\n<p>問了「可以給建議嗎」，接著講十分鐘且不讓對方回應，仍可能失去合作。提出兩個都要求立即訓練的選項，也未充分呈現暫停或重新評估的可能性。若只有一種符合當下安全條件的處置，應清楚解釋限制，不包裝成虛假的自由選擇。<\/p>\n"}, {"group": "therapist", "title": "從意願到計畫：同時處理能力、條件與負荷", "key": "T7", "body": "<h3>何時進入計畫？<\/h3>\n<p>本人想討論怎麼做、提出具體問題或表達願意嘗試時，可以邀請共同規劃。承諾不必很強烈才開始談可行性；先探索安排，有時也能幫助本人決定是否願意。若尚未形成方向，可繼續釐清或暫停，不以完成計畫作為每次談話的必要結局。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>計畫包括本人在意的目標、選擇的行動、需要的協助、可能障礙、停止或求助條件及回顧方式。這些是臨床規劃要素，不是MI獨有的固定處方。活動頻率、強度及安全條件仍須個別評估。<\/p>\n<h3>先問：是不想、不能，還是條件不足？<\/h3>\n<p>患者說願意在家練習，卻沒有能安全放置物品的桌面；繼續問「這件事有多重要」不會創造桌面。可請他描述家裡環境，在同意與可行條件下評估，調整活動或尋求資源。知道原因後也不必立即有解；記下待確認的條件，比提出無法執行的作業更誠實。<\/p>\n<p>另一位患者擦桌時毛巾一直滑走。他說「我什麼都做不好」，可以先回應挫折，再檢查抓握、材料及桌面等因素，依評估調整。調整後若更容易完成，只能說這個條件下的表現改變，不能宣稱整體能力已恢復。這類任務調整與經驗回顧可能支持自我效能；它本身屬於復健活動設計。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<h3>信心量尺的用途及界線<\/h3>\n<p>可先設定明確行動，再問：「若0是完全沒把握、10是很有把握，下週按這個安排試一次，你大概在哪裡？」這是談話工具，不是經驗證的復健能力測驗，也沒有通用的及格分數。<\/p>\n<p>若答4，可問「有哪些條件讓你有這4分？」也可問「什麼會讓這個安排比較可行？」若答0，不宜機械地追問「為什麼不是更低」。可以說：「目前看不到可行的條件。最卡住的是哪裡？」對方若不想用數字，直接討論具體困難即可。<\/p>\n<p>重要性與信心不同。患者可能非常想去市場，卻不相信目前有人能安全協助。提高動機不會自動補足人力。相關案例\u0001明如何在生活願望、疲勞與支持條件之間做判斷。<\/p>\n<h3>沒有執行時如何回顧？<\/h3>\n<p>問「上次談完，到實際要做的時候發生了什麼？」比立即判定不配合更能取得資訊。檢查是否記得、是否有時間、是否安全、是否仍重視該目標，以及當初是否真正同意。只完成一項也可以分析該項為何可行，不能用它要求其餘四項必須補做。相關案例\u0001現可以刪減計畫、重教或暫停的回顧方式。<\/p>\n"}, {"group": "therapist", "title": "自主、知情同意與臨床適用界線", "key": "T8", "body": "<h3>自主性不只是提供選項<\/h3>\n<p>自主支持包括讓本人表達不同意見、獲得可理解的資訊、選擇參與決策的方式，以及在可行範圍內改變決定。有人希望治療師提出明確建議，這也可能是自主選擇。不能只因患者說「你決定」就推定缺乏自主，也不能把沉默、點頭或家屬同意直接當作本人充分同意。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>知情同意通常需要釐清介入目的、可能利益與風險、重要替代方案及不介入可能的影響，確認理解、意願與決策能力。具體程序、代理決策及緊急例外依所在地法律與機構規範處理；本教材不提供法律判定。<\/p>\n<h3>支持表達，再評估理解<\/h3>\n<p>失語、聽力困難、語言差異或反應較慢，不等於沒有意見或缺乏決策能力。可使用短句、一次一個重點、書寫或圖片、足夠等待時間及合適的溝通專業支持。需要口譯時，避免讓有利益衝突或理解不足的人承擔關鍵訊息的唯一轉述。調整後仍無法確認理解時，需依團隊程序進一步評估，不能靠多問幾次「願意嗎」解決。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p><strong>短例：照顧者一直點頭。<\/strong> 外籍照顧者在家屬面前說「懂」，實際示範卻與教學不同。治療師可說：「我剛才可能說太快。我們換成你熟悉的語言和一步一步的圖示，再一起確認。」同時要詢問照顧者能否承擔工作及有哪些顧慮。點頭可能是禮貌、緊張或部分理解；不能直接認定故意隱瞞，也不能用簽名取代理解。這是語言可近性與教學品質問題，不宜設計成辨認改變語句的測驗。<\/p>\n<h3>哪些時候MI有幫助，哪些工作應優先？<\/h3>\n<table>\n<thead>\n<tr>\n<th>當下情況<\/th>\n<th>可優先進行的工作<\/th>\n<th>MI的角色及限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>對改變有矛盾，能參與對話<\/td>\n<td>共同聚焦、探索本人理由及顧慮<\/td>\n<td>可使用MI；不保證最後選擇改變<\/td>\n<\/tr>\n<tr>\n<td>已決定且想學方法<\/td>\n<td>說明、示範、規劃與確認理解<\/td>\n<td>合作精神仍適用，無須刻意製造矛盾<\/td>\n<\/tr>\n<tr>\n<td>疼痛、疲勞、睡眠或身體狀況影響活動<\/td>\n<td>評估原因、負荷及必要醫療處置<\/td>\n<td>溝通協助理解經驗，不能替代評估與治療<\/td>\n<\/tr>\n<tr>\n<td>缺乏設備、空間、人力或交通<\/td>\n<td>評估環境、調整安排及資源協調<\/td>\n<td>引出理由無法取代實際資源<\/td>\n<\/tr>\n<tr>\n<td>持續低落、失去興趣，伴隨睡眠或食慾改變<\/td>\n<td>合適的篩檢、臨床評估與追蹤轉介<\/td>\n<td>不宜只解讀為不願努力；MI可作部分支持，但不能包辦診斷與治療 <a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/td>\n<\/tr>\n<tr>\n<td>新發急性神經症狀或其他緊急狀況<\/td>\n<td>停止活動並啟動緊急醫療流程<\/td>\n<td>不進行動機探索來延遲求援 <a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/td>\n<\/tr>\n<tr>\n<td>理解與表達仍受明顯限制<\/td>\n<td>先提供支持性溝通，必要時評估決策能力<\/td>\n<td>常規長句MI需調整，不能一概排除，也不能假定原有證據可直接外推<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>患者拒絕有風險的必要照護時，需要確認拒絕的是哪一部分、理解與風險、是否可提供替代，以及是否需要進一步協助。尊重自主不代表停止專業責任；臨床急迫性也不自動授權強迫。避免在本教材中以單句對話代替個別倫理與法律判斷。<\/p>\n<h3>家庭參與與專業利益<\/h3>\n<p>家屬的疲勞、費用及安排限制需要被聽見，但付費不等於能代替具決策能力的本人決定所有目標。可先釐清本人同意分享的範圍，必要時安排分別談話，再協商可行方案。若治療師所在機構會從某選項獲利，應揭露相關利益，提供公平的比較資訊。相關案例\u0001呈現這兩種不同的判斷問題。<\/p>\n"}, {"group": "therapist", "title": "MI、TTM與自我效能：能搭配，概念要分清楚", "key": "T9", "body": "<h3>三者各自回答什麼問題？<\/h3>\n<table>\n<thead>\n<tr>\n<th>架構<\/th>\n<th>核心問題<\/th>\n<th>在復健溝通中的用途<\/th>\n<th>不宜做的推論<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MI<\/td>\n<td>如何以合作、引導方式談改變與成長？<\/td>\n<td>探索矛盾、本人理由、意願與計畫<\/td>\n<td>出現OARS就等於整段是MI；願意就保證能做到<\/td>\n<\/tr>\n<tr>\n<td>跨理論模式TTM<\/td>\n<td>行為改變的準備與歷程如何描述？<\/td>\n<td>提醒目標行為、時間與情境影響準備狀態<\/td>\n<td>一次沒練就是前思考期；每個人必須線性過關<\/td>\n<\/tr>\n<tr>\n<td>自我效能<\/td>\n<td>本人相信自己在特定條件下能完成特定行動嗎？<\/td>\n<td>了解信心、支持實作經驗、調整任務條件<\/td>\n<td>分數高等於客觀安全；鼓勵就能消除神經或環境限制<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>MI並非由TTM推導出的談話程序，也不要求先判定階段才能開始。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 兩者常被一起教學，容易造成誤會。MI也不等於所有以人為中心的溝通，雖然共享許多價值。<\/p>\n<h3>TTM的基本概念與應用限制<\/h3>\n<p>常見教學列出前思考、思考、準備、行動、維持；原始概述另包含終止階段。這些描述涉及對某一行為的改變意圖與行動狀態，TTM也包含改變歷程、決策權衡、自我效能及誘惑等構面。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 不能把整個模式簡化成五種人格。<\/p>\n<p>復健活動常受疾病變化、能力、安排及他人協助影響。今天未執行，可能是沒有拿到輔具、忘記步驟或覺得目標已不合適。若要使用TTM，應說清楚目標行為、所採定義與評估方法；不能擅自把某些健康行為研究中的時間界線套到所有復健任務。<\/p>\n<h3>自我效能如何進入臨床對話？<\/h3>\n<p>自我效能是對自身執行能力的信念；結果預期則是相信行動會帶來什麼結果。例如「我能按安排練一次」和「練一次就會恢復走路」是不同信念。Bandura的理論討論實際成功經驗、觀察他人、言語影響及身體與情緒狀態等來源。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 這些概念支持我們觀察情境，不能保證任一鼓勵方式有效。<\/p>\n<p>對擦桌失敗的患者，可以先調整實際困難，再一起確認「剛才在防滑材料下完成這一小段」代表什麼。具體經驗比泛稱「你一定可以」更能讓本人判斷條件。即使信心增加，仍須觀察實際安全與功能，不能只憑本人評分決定活動難度。<\/p>\n<h3>決策權衡與中立決策<\/h3>\n<p>列出所有改變與不改變的利弊，是一種決策權衡活動，不能自動當成MI。對已有共同改變方向、處於矛盾中的人，機械式平均探索兩面可能進一步強化維持現狀的理由。若專業倫理要求對數個合理選項保持中立，則可以公平協助權衡，不宜暗中偏向治療師想要的選項。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a><\/p>\n<p>「保持中立」仍需提供相關證據、限制與專業判斷；它不等於把不安全選項包裝成同樣適合。相關案例\u0001服務選擇屬共同決策；可運用反映與自主支持，不必將整段冠以引出特定改變方向的MI。<\/p>\n<p>本教材沒有把「拆成小步驟」直接命名為行為活化治療，也沒有把所有目標設定都歸入MI。若採用其他完整治療模式，需另有對應訓練、理論與證據。<\/p>\n"}, {"group": "therapist", "title": "如何練習與評估：看整段互動，也看限制", "key": "T10", "body": "<h3>教材練習的目的<\/h3>\n<p>初學者可以選一段對話，標出共同焦點、對方的意思、自己的推測，以及何時需要轉為評估或教學。再嘗試另一種說法，說明為何適合此刻，並預想對方否認時如何回應。練習重點是可被修正的判斷，不能把一個漂亮句子當成臨床能力證明。<\/p>\n<p>可與同儕輪流扮演患者和治療師，讓扮演患者的人自由回應，不必配合劇本成功。回饋應具體指出哪段讓人有空間、哪段資訊不清楚，以及有哪些未被理解的負擔。模擬感受有參考價值，仍不能替代真實臨床督導。<\/p>\n<h3>MITI能告訴我們什麼？<\/h3>\n<p>Motivational Interviewing Treatment Integrity（MITI）是評估MI執行品質的編碼工具。本次查閱公開的4.2.1手冊，了解其整體評分與行為計數架構；整體評分包括伙伴關係、同理、培養改變語句與減弱維持語句等面向。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 這裡的「減弱」關注治療師如何回應，不能理解為禁止患者表達不同意見。<\/p>\n<p>正式編碼需要明確的改變焦點、適合的談話樣本、受訓評分者及一致性檢查。MITI對治療師行為的觀察不能代替患者理解、同意、安全、生活品質或功能結果的評估；也不能只靠患者最後說「好」判定晤談品質。MITI不是直接完整編碼患者所有改變語句的工具。<\/p>\n<p>本教材不提供MITI認證，不用單一反映比例或分數宣稱勝任，也不把案例選擇轉換成臨床能力等級。公開手冊中的建議門檻及教學用途，不能被當作所有族群與情境都已驗證的成效標準。另有2026補充文件的公開連結，本次未取得其完整內容，不能宣稱已依該補充文件完成評分規範核對。<\/p>\n<h3>臨床回顧可以記錄哪些內容？<\/h3>\n<ul>\n<li>本人想談的目標、當下顧慮及重要原話；記錄推測時明確標示。<\/li>\n<li>已提供哪些資訊，如何確認理解，選擇或拒絕的範圍。<\/li>\n<li>活動、安全、環境或照顧負荷的評估，以及需要誰繼續處理。<\/li>\n<li>共同決定的安排、未解決問題與後續檢視方式。若沒有形成計畫，也如實記錄。<\/li>\n<\/ul>\n<p>例如：「患者表示今天不練站立，主述昨夜睡眠差；可重述今日建議，但表示希望先休息。已停止當次練習，依團隊流程回報疲勞變化，後續評估負荷。」這比「抗拒復健，已MI處理」提供更多可用資訊。範例不取代機構紀錄規範。<\/p>\n<p>若要錄音、分享逐字稿或供督導，須依所在機構規範取得適當同意、保護隱私與管理資料；拒絕錄音不應影響照護品質。<\/p>\n<h3>證據如何閱讀？<\/h3>\n<p>MI研究跨越不同問題、介入強度、執行者訓練與結果指標。中風相關試驗曾研究情緒或次級預防等結果，不能直接推論家庭的一句反映會改善步行或上肢功能。<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a> 部分試驗排除了無法參與訪談的嚴重溝通或認知困難者，外推時需注意。這不代表所有失語者都不適合支持性溝通。<\/p>\n<p>本教材提供概念核對及臨床教學，未進行完整系統性文獻回顧。讀者應將MI視為可選擇、可調整的溝通方法，結合臨床評估與適當督導，而非通用解方。<\/p>\n<hr/>\n"}, {"group": "references", "title": "如何理解本教材的依據", "key": "section31", "body": "<p>本文的[R編號]對應下列來源；連續編號表示一組來源，例如<a class=\"refjump\" data-jump=\"references\" href=\"#references\">查看參考來源<\/a>表示R1、R2與R3。對話、角色、臨床安排及「帶走的原則」由本教材編寫，不是來源中的真實病例或逐字引文，也未經成效研究驗證。<\/p>\n<p>MI核心術語優先參考第四版出版方公開補充資料及MINT資料。第三版取向的公開介紹仍有教學價值，版本差異已在T2說明。臨床建議另參考復健與共同決策指引，不將它們寫成MI原始理論。<\/p>\n<p>查核日期：2026年10月20日。本次是針對教材概念與風險的定向核對，未執行系統性文獻檢索、偏差風險評估或證據分級。以下逐項揭露取得範圍；沒有取得全文的來源，不據此宣稱已核對全部方法、結果或細節。<\/p>\n"}, {"group": "references", "title": "MI核心與相關理論", "key": "section32", "body": "<p><strong>R1｜Miller, W. R., &amp; Rollnick, S. (2023). <em>Motivational Interviewing: Helping People Change and Grow<\/em>（4th ed.）. Guilford Press.<\/strong><br/>\n<a href=\"https://www.guilford.com/add/miller2-audiobook.pdf?t=1\">出版方公開補充PDF<\/a><br/>\n核對範圍：公開補充資料中的術語表及相關說明，用於第四版精神、任務、反映、改變語言及Ask–Offer–Ask等用語。<strong>未取得第四版全書正文，未逐頁查證全書，也不以此PDF冒充完整原書。<\/strong><\/p>\n<p><strong>R2｜Motivational Interviewing Network of Trainers（MINT）. <em>Glossary of Motivational Interviewing Terms<\/em>.<\/strong><br/>\n<a href=\"https://motivationalinterviewing.org/sites/default/files/final_glossary_of_mi_terms_site.pdf\">MINT公開術語表<\/a><br/>\n核對範圍：公開PDF中相關術語，輔助確認OARS、反映、改變與維持語句等定義；不將不同版本用語混稱為第四版原文。<\/p>\n<p><strong>R3｜MINT. <em>Understanding Motivational Interviewing<\/em>.<\/strong><br/>\n<a href=\"https://motivationalinterviewing.org/understanding-motivational-interviewing\">MINT公開介紹<\/a><br/>\n核對範圍：公開網頁。該介紹採較早版本用語，可支持MI基本定位與合作原則，不能單獨用來核實第四版更新。<\/p>\n<p><strong>R4｜Miller, W. R., &amp; Rose, G. S. (2009). Toward a theory of motivational interviewing. <em>American Psychologist, 64<\/em>(6), 527–537.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/19739882/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：書目與摘要層級，用於關係面向與技術面向的理論背景；未據此聲稱機轉在所有復健情境都已確立。<\/p>\n<p><strong>R5｜Miller, W. R., &amp; Rollnick, S. (2009). Ten things that motivational interviewing is not. <em>Behavioural and Cognitive Psychotherapy, 37<\/em>(2), 129–140.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/19364414/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：摘要及MINT書目介紹，用於MI與TTM、決策權衡、單一技巧及萬用方法的區別。未逐段核對全文。<\/p>\n<p><strong>R6｜Miller, W. R., &amp; Rose, G. S. (2015). Motivational interviewing and decisional balance: contrasting responses to client ambivalence. <em>Behavioural and Cognitive Psychotherapy, 43<\/em>(2), 129–141.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/24229732/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：摘要層級，支持依談話目的區分有方向的MI與中立決策權衡。教材中的服務選擇案例屬倫理與臨床延伸，不是該研究的病例。<\/p>\n<p><strong>R7｜Prochaska, J. O., &amp; Velicer, W. F. (1997). The transtheoretical model of health behavior change. <em>American Journal of Health Promotion, 12<\/em>(1), 38–48.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/10170434/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：摘要所列階段與構面。未把其他行為的分期時間門檻直接套用於復健，也未建立本教材的階段診斷工具。<\/p>\n<p><strong>R8｜Bandura, A. (1977). Self-efficacy: toward a unifying theory of behavioral change. <em>Psychological Review, 84<\/em>(2), 191–215.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/847061/\">PubMed紀錄<\/a><br/>\n取得範圍：書目及可取得的摘要資訊，未逐頁查核原文。本教材僅採自我效能、結果預期與主要經驗來源的基礎區分；活動調整的具體示範是臨床延伸。<\/p>\n<p><strong>R9｜Moyers, T. B., Manuel, J. K., &amp; Ernst, D. <em>Motivational Interviewing Treatment Integrity Coding Manual 4.2.1<\/em>（公開檔案標示June 2015）.<\/strong><br/>\n<a href=\"https://casaa.unm.edu/assets/docs/miti4_21.pdf\">University of New Mexico公開手冊<\/a>；<a href=\"https://casaa.unm.edu/tools/miti.html\">工具介紹<\/a>；<a href=\"https://motivationalinterviewing.org/motivational-interviewing-resources\">MINT資源頁<\/a><br/>\n核對範圍：4.2.1公開PDF的用途、評分架構、行為定義及使用限制。該檔案帶有草稿標記，本文按公開手冊及版本辨識，不視為另一本已正式出版著作。MINT資源頁另列2026補充文件，本次未完整取得；不能宣稱已核對該補充文件或最新全部編碼規範。本教材不提供正式MITI評分訓練。<\/p>\n"}, {"group": "references", "title": "復健、共同決策與研究界線", "key": "section33", "body": "<p><strong>R10｜Canadian Stroke Best Practices（2025更新）. <em>Sleep Health and Post-Stroke Fatigue<\/em>.<\/strong><br/>\n<a href=\"https://www.strokebestpractices.ca/recommendations/activity-participation-following-stroke/2--sleep-health-and-post-stroke-fatigue\">指引網頁<\/a><br/>\n核對範圍：公開建議與臨床考量，用於疲勞需評估及活動安排需個別化。未以本教材提供個別運動劑量或診斷。<\/p>\n<p><strong>R11｜Canadian Stroke Best Practices（2025更新）. <em>Supporting Individuals with Stroke, their Families and Caregivers<\/em>.<\/strong><br/>\n<a href=\"https://www.strokebestpractices.ca/recommendations/stroke-rehabilitation-planning/8-supporting-individuals-with-stroke\">指引網頁<\/a><br/>\n核對範圍：公開的家庭與照顧者支持建議。教材中的分工與求助對話為自編，不保證所在地具有特定服務。<\/p>\n<p><strong>R12｜Canadian Stroke Best Practices（2025更新）. <em>Interdisciplinary Stroke Rehabilitation Care Planning<\/em>.<\/strong><br/>\n<a href=\"https://www.strokebestpractices.ca/recommendations/stroke-rehabilitation-planning/7--interdisciplinary-stroke-rehabilitation-care-planning\">指引網頁<\/a><br/>\n核對範圍：公開的個別化規劃、溝通支持及照顧者參與等建議。不能據此代替所在地的決策能力、代理決策及同意規範。<\/p>\n<p><strong>R13｜National Institute for Health and Care Excellence（NICE）. <em>Shared decision making<\/em>（NG197，2021）.<\/strong><br/>\n<a href=\"https://www.nice.org.uk/guidance/ng197/chapter/recommendations\">官方建議頁<\/a><br/>\n取得範圍：本次直接開啟全文受限，核對限於官方檢索可見的建議節錄，包括理解確認與teach-back、討論選項及後續安排。未宣稱逐條讀取全文。本文的知情同意段落為一般臨床倫理與溝通整理，<strong>不代表已完成任何司法管轄區的法律查證<\/strong>。<\/p>\n<p><strong>R14｜American Stroke Association. <em>Stroke Symptoms<\/em>.<\/strong><br/>\n<a href=\"https://www.stroke.org/en/about-stroke/stroke-symptoms\">官方中風警訊頁<\/a><br/>\n核對範圍：公開警訊與立即求援原則。教材首頁列舉部分警訊，並非完整急症辨識或處置課程；應依所在地緊急醫療流程求助。<\/p>\n<p><strong>R15｜Watkins, C. L., et al. (2007). Motivational interviewing early after acute stroke: a randomized, controlled trial. <em>Stroke, 38<\/em>(3), 1004–1009.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/17303766/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：摘要中的研究對象、介入及結果領域。用於說明情緒相關研究與受試者選擇的外推限制；未重新評估完整試驗的偏差風險。<\/p>\n<p><strong>R16｜Barker-Collo, S., et al. (2015). Improving adherence to secondary stroke prevention strategies through motivational interviewing: randomized controlled trial. <em>Stroke, 46<\/em>(12), 3451–3458.<\/strong><br/>\n<a href=\"https://pubmed.ncbi.nlm.nih.gov/26508749/\">PubMed紀錄與摘要<\/a><br/>\n核對範圍：摘要。該試驗主要血壓與膽固醇指標未見顯著組間改善；不能僅因部分自述指標改善，就將研究概括為所有復健結果有效。此來源用來示範閱讀結果領域與限制，不是本教材案例的有效性證明。<\/p>\n<p><strong>R17｜Canadian Stroke Best Practices（2025更新）. <em>Mood and Depression<\/em>.<\/strong><br/>\n<a href=\"https://www.strokebestpractices.ca/recommendations/activity-participation-following-stroke/1-mood-and-depression\">指引網頁<\/a><br/>\n核對範圍：公開的篩檢、評估與適當轉介建議。教材提醒持續低落需評估，不以對話範例提供診斷、藥物或完整心理治療處方。<\/p>\n"}, {"group": "references", "title": "教材使用限制與必要聲明", "key": "section34", "body": "<ol>\n<li><strong>教育用途。<\/strong> 本教材協助理解與練習溝通，不能取代醫療評估、個別復健計畫、正式MI訓練與督導。內容完成不等於讀者已具備獨立臨床勝任能力。<\/li>\n<li><strong>適用範圍。<\/strong> 多數案例以成人中風後復健為背景。其他疾病、兒童、嚴重認知或溝通困難、特定文化及照護制度，需要另外調整與查證。家屬可學習支持性溝通，無須承擔治療師責任。<\/li>\n<li><strong>臨床安排。<\/strong> 疼痛、疲勞、情緒、環境與照顧負荷可能需要不同專業處理；休息、訓練、停止條件、輔具與協助方式須依個別狀況決定。案例不是操作處方。<\/li>\n<li><strong>自主與安全。<\/strong> 對方可以拒絕、暫停或修改目標；必要照護與急迫風險仍需適當評估和安排。不同意不能自動等同缺乏決策能力，也不能以本教材推論特定法律權限。<\/li>\n<li><strong>效果與評估。<\/strong> 沒有單句話術能保證改變意願或功能。案例的選擇、閱讀完成度與自我評分，都不能換算為MI能力認證或臨床預後。<\/li>\n<li><strong>來源與更新。<\/strong> 來源取得範圍如上。本稿未經獨立MI專家及跨專業團隊逐項驗證；正式用於臨床訓練前，宜由適任專業人員審閱，並依新證據與所在地規範更新。<\/li>\n<li><strong>AI協作揭露。<\/strong> 本教材修訂過程使用AI協助整理、撰寫與查核。AI可能遺漏脈絡或誤解來源；已揭露查證限制，仍需人類專業判斷。案例均為模擬，不代表真實療效或專業認證背書。<\/li>\n<\/ol>\n"}, {"group": "references", "title": "關於本教材", "key": "section35", "body": "<p>設計與整理｜吱吱復健・楊昀霖職能治療師<br/>\n更多照顧與復健資源，歡迎前往<a href=\"https://reliveot.github.io/card/\">吱吱復健的資源頁<\/a>。<\/p>\n<p>V4教材定稿｜2026年10月20日。轉製為網站時，應完整保留案例解析、來源取得範圍與使用限制，並清楚區分教材原文及後續新增內容。<\/p>\n"}], "ex": [{"id": "C01", "title": "「昨天還可以，今天又不行」：先陪伴還是一起找原因？", "kind": "case", "preface": "<p><strong>適用對象：<\/strong> 家屬與照顧者。<br />\n<strong>對應章節：<\/strong> F2；改編來源V4案例CF2。<br />\n<strong>學習目標：<\/strong> 分辨表達失落與尋求問題分析，依本人當下需要選擇談話起點。<br />\n<strong>改編說明：<\/strong> 改編CF2；新增「本人主動要求比較」的條件版本。<br />\n<strong>依據：<\/strong> V4 F2的反映式傾聽及評估界線；MI接納與反映，參考R2、R3；持續低落的評估提醒參考R17。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>阿宏接下來先怎麼回應，比較貼近目前掌握的資訊？<\/p>\n", "options": [{"label": "A", "text": "<p>「昨天做得到，今天卻不順，真的很失望。你願意的話，我在這裡聽你說。」<\/p>\n"}, {"label": "B", "text": "<p>「今天這樣確實不好受。要不要一起回想，昨天和今天有哪裡不一樣？」<\/p>\n"}, {"label": "C", "text": "<p>「這幾天也有做得比較順的時候，我們先想想那些進步，別讓今天這一次影響信心。」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>這句話先回應付出與表現落差帶來的失落，沒有要求張太太立即找出原因。她目前主要在描述挫折，A有較直接的依據，適合作為起點；說完需要停下來，讓她補充或不說話。<\/p>\n<p>「失望」仍是丈夫對感受的理解，不能當成已確定的內心。她可能修正為「我只想知道是不是拿法不對」。此時應跟著她的需求轉向分析，無須再堅持安慰。A可能讓她感到有空間，也可能被聽成重複情緒、沒有回答問題；要看她如何回應。<\/p>\n<p>下一步需要知道她想被陪伴、了解差異，還是先休息；也要留意身體狀態與表現變化。這是反映與接納的應用，不能用來判定能力有沒有退步。<\/p>\n", "B": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>這句話同樣承認不好受，並徵詢是否一起找原因。它可能讓張太太獲得實際協助，也可能正好回應她想解決問題的需要。B沒有指責她，也沒有要求立即再試，是合理的照顧回應。<\/p>\n<p>但目前尚不知道她是否想分析。若她正在表達失落，立刻比較可能讓談話又回到「哪裡要改」，增加回答的負擔。因此本題較建議先用A了解她的需要；B可在她表達想找原因時接續。問了「要不要」之後，也要接受她說不要。<\/p>\n<p>還需了解近期睡眠、疼痛、疲勞及活動條件等實際變化，家屬不應自行下診斷。B屬問題釐清與臨床資訊整理，不因比較具體就比反映差；重點是時機與本人需求。<\/p>\n", "C": "<p><strong>目前判斷：較不建議。<\/strong><\/p>\n<p>C想幫張太太看見進步、避免一次挫折抹去努力，是家人很可能採用的安慰方式。若她主動想回顧近況，具體觀察可以有幫助；問題在於目前她正在表達失望，尚未想轉向正面回顧。<\/p>\n<p>「別讓今天這一次影響信心」可能讓她覺得連失望都不應該，或需要接受丈夫的進步判斷。這句也假定今天只是一次波動，現有資料不足以確認。即使過去確有進步，也不能用來取消當下困難。<\/p>\n<p>下一步先了解她在意的是挫折、原因還是休息；她願意回顧時，再具體描述觀察與仍需協助的部分。這涉及接納、反映與助人者急於修正感受的傾向；肯定不等於要求對方採納正面心情。<\/p>\n"}}], "note": [{"title": "再看一項資訊", "body": "<p>把情境換成張太太接著主動說：「我現在想知道差在哪裡。先不要安慰我，你幫我回想一下好嗎？」<\/p>\n<p>此時<strong>B較貼近她明確提出的需求<\/strong>。可以一起整理已觀察到的差異，必要時帶給團隊；不必再用更多情緒反映證明有同理心。A仍帶有關懷，但若持續停留在安慰，可能忽略她要的實際協助。<\/p>\n<p>這項資訊不由A或B「觸發」，也不表示分析一定能找出原因。若出現新症狀、情況持續或加重，需尋求適當評估；如果長期低落及失去興趣影響生活，也需要其他協助。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前先採A較有依據；本人明確希望一起找原因時，可轉向B。<\/p>\n<p>先回應最明確的需要，再讓本人修正方向。理解感受與查找問題都可以有幫助；先後順序應隨資訊改變，不必永遠先安慰，也不必急著把情緒轉成待解決的任務。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不以單次表現或一句失落話診斷病情、動機或憂鬱症。語言理解或表達困難時，減少句子長度，使用本人可用的表達方式。<\/p>\n"}], "story": "<p>張太太正在做團隊教過的日常活動，今天拿物品不如昨天順利。她把物品放下，說：「昨天還可以，今天又掉了。我花那麼多力氣，還是這樣。」<\/p>\n<p>丈夫阿宏沒有觀察到突然出現的動作或說話改變；這不代表已排除身體因素。活動已停下，她尚未要求分析原因，也沒有明確要求結束談話。現在要選的是接下來一句話，不是決定需不需要醫療評估。<\/p>\n", "learngoal": "分辨表達失落與尋求問題分析，依本人當下需要選擇談話起點", "takeaway": "先回應最明確的需要，再讓本人修正方向。理解感受與查找問題都可以有幫助；先後順序應隨資訊改變，不必永遠先安慰，也不必急著把情緒轉成待解決的任務。", "overallfull": "<p><strong>目前建議：<\/strong> 目前先採A較有依據；本人明確希望一起找原因時，可轉向B。<\/p>\n<p>先回應最明確的需要，再讓本人修正方向。理解感受與查找問題都可以有幫助；先後順序應隨資訊改變，不必永遠先安慰，也不必急著把情緒轉成待解決的任務。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不以單次表現或一句失落話診斷病情、動機或憂鬱症。語言理解或表達困難時，減少句子長度，使用本人可用的表達方式。<\/p>\n"}, {"id": "C02", "title": "快出門了，這次要幫到哪裡？", "kind": "case", "preface": "<p><strong>適用對象：<\/strong> 家屬與照顧者。<br />\n<strong>對應章節：<\/strong> F4；改編來源V4案例CF4。<br />\n<strong>學習目標：<\/strong> 依本人已說明的協助範圍、時間與當下狀態調整幫忙方式，不把獨立完成當作唯一理想。<br />\n<strong>改編說明：<\/strong> 改編CF4，新增同一活動中協助需求改變的比較。<br />\n<strong>依據：<\/strong> V4 F4的自主支持與活動分析；R11、R12。具體安排屬照顧延伸，非MI動作處方。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>在這些資訊下，哪個安排比較合適？<\/p>\n", "options": [{"label": "A", "text": "<p>「車快到了，今天我先幫你穿好，好嗎？有空的時候再慢慢試。」<\/p>\n"}, {"label": "B", "text": "<p>「好，我先拿住袖口。你想多幫一點就跟我說，我也會留意時間。」<\/p>\n"}, {"label": "C", "text": "<p>「車還有十分鐘，你先完整試一次；真的卡住我再幫，這樣也能保留練習機會。」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>A把準時外出放在前面，也有詢問同意，並非不尊重患者的話。若時間真的不足、父親已疲累或主動希望多幫忙，這個安排可能很實際。日常活動可以以完成生活需要為目的，不必每次都變成練習。<\/p>\n<p>但在目前情境中，父親已提出有限度的協助，仍有時間先照他的方式進行。立即改為全部幫忙，可能讓他覺得自己的選擇被時間焦慮蓋過。A應先有「目前來不及或需要更多協助」的依據，不能只因兒子擔心就當成必須接手。<\/p>\n<p>還需看實際時間、父親狀態與他是否接受改安排。如果他說仍想試，兒子可說清楚時間限制再協商，不能把形式上的「好嗎」當作一定會得到同意。這涉及自主支持與生活任務的取捨，不是測驗家屬幫得越少越好。<\/p>\n", "B": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>B直接回應父親已提出的需求，保留他想參與的部分，也沒有否認外出時間。在目前資訊下，B較有依據。不必再問一串「你為什麼想自己做」，或要求父親重新描述已說清楚的協助需求。<\/p>\n<p>這樣做可能讓雙方更知道自己的工作，但不能保證順利穿好。若父親卡住、疲勞或改變主意，就要重新調整；兒子也不能因選了B，就堅持一定要讓父親完成。若有不安全或疼痛情況，應先處理，不只等待他主動求助。<\/p>\n<p>下一步需要的是實際觀察、必要時確認是否多幫忙，以及留意時間，不需要額外驗證父親夠不夠努力。B運用自主支持，具體協助則依專業教學與個別狀況。<\/p>\n", "C": "<p><strong>目前判斷：較不建議。<\/strong><\/p>\n<p>C想保留父親參與和練習的機會，並承諾卡住會幫，這是照顧者常見的用意。但父親已經指出需要先拿住袖口，現在把協助延到「完整試過」之後，改變了他提出的條件。<\/p>\n<p>這可能增加出門壓力，也容易把必要協助變成證明努力後才能取得的資源。十分鐘不代表一定足夠，也不能只憑過去能力推定今天不需要幫忙。若沒有安全且可行的前置條件，自行嘗試的價值也無法被假定。<\/p>\n<p>需要知道的是他想參與哪一段、目前適當協助及可用時間。若他主動想完整試一次，且已確認合適，再討論如何協助；現在則優先照B回應已知需要。這是自主支持與任務條件的判斷，不能把少幫等同促進自主。<\/p>\n"}}], "note": [{"title": "再看一項資訊", "body": "<p>稍後，黃先生說：「我今天手很累，後面也幫我穿好，趕車比較重要。」<\/p>\n<p>此時<strong>A所代表的較多協助更符合新的需要<\/strong>，可以依已學過的方式幫忙完成。父親改變主意並不表示前一次嘗試失敗，也不能由這次多幫忙推論日後會依賴。若疲勞和平常不同、持續或伴隨其他變化，仍需回報評估。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前先採B，回應本人已說明的協助範圍；時間或需求改變時再協商。<\/p>\n<p>自主包含選擇如何接受協助。需要多少幫忙可以在同一活動中改變；尊重參與、完成生活與照顧者的時間限制，都應放進討論。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 此題不教扶持或穿衣的肢體操作。協助者尚未學會方法時，不能依對話自行試做；也不能為了讓患者獨立而撤掉必要支援。<\/p>\n"}], "story": "<p>黃先生和兒子準備外出，接送車預計十分鐘後到。兩人已學過合適的穿衣協助方式，目前沒有疼痛或新的不適。黃先生說：「你先拿住袖口，我自己找一下。」<\/p>\n<p>兒子擔心來不及，也知道父親有時想自己試。父親已說明希望先幫哪一步，尚未要求全部代勞。<\/p>\n", "learngoal": "依本人已說明的協助範圍、時間與當下狀態調整幫忙方式，不把獨立完成當作唯一理想", "takeaway": "自主包含選擇如何接受協助。需要多少幫忙可以在同一活動中改變；尊重參與、完成生活與照顧者的時間限制，都應放進討論。", "overallfull": "<p><strong>目前建議：<\/strong> 目前先採B，回應本人已說明的協助範圍；時間或需求改變時再協商。<\/p>\n<p>自主包含選擇如何接受協助。需要多少幫忙可以在同一活動中改變；尊重參與、完成生活與照顧者的時間限制，都應放進討論。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 此題不教扶持或穿衣的肢體操作。協助者尚未學會方法時，不能依對話自行試做；也不能為了讓患者獨立而撤掉必要支援。<\/p>\n"}, {"id": "C03", "title": "我已經很累，下一步要找誰談？", "kind": "case", "preface": "<p><strong>適用對象：<\/strong> 家屬與照顧者。<br />\n<strong>對應章節：<\/strong> F6；改編來源V4案例CF5。<br />\n<strong>學習目標：<\/strong> 將照顧者負荷視為需要處理的問題，區分增加分工與修改不合適的照顧安排。<br />\n<strong>改編說明：<\/strong> 改編CF5，保留協助尚待確認的現實條件。<br />\n<strong>依據：<\/strong> V4 F6；照顧者支持R11。此題以照顧協調為主，不是對患者進行MI的測驗。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>美玲想採取下列哪個下一步？先選較想開始的一項，再比較它能處理什麼、還留下什麼。<\/p>\n", "options": [{"label": "A", "text": "<p>「我先跟弟弟談週末能分擔的工作，從他會做的事開始，讓我有一段休息時間。」<\/p>\n"}, {"label": "B", "text": "<p>「我先跟治療師談提醒練習和夜間照顧的負荷，請團隊一起看哪些安排需要改。」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：符合照顧支持原則，可與B並行。<\/strong><\/p>\n<p>A直接處理人力與休息，是照顧者可以提出的合理需要。從弟弟會做的事開始，例如確認可協助的備餐或陪伴範圍，比要求未受教學者直接負責移位更能釐清分工。但實際工作仍需符合父親的照護需求與安全條件。<\/p>\n<p>它可能讓美玲較快得到一部分喘息，也可能發現弟弟時間有限。即使有人接手，原來過重或容易引起衝突的提醒安排仍可能存在。A不能單獨回答練習計畫是否合適，也不保證夜間問題已解決。<\/p>\n<p>下一步需確認弟弟實際時段、能做什麼、本人是否接受，以及交接與必要照護如何維持。這是照顧者支持與分工；美玲不必先證明父親會進步，才有資格要求休息。<\/p>\n", "B": "<p><strong>目前判斷：符合照顧支持原則，可與A並行。<\/strong><\/p>\n<p>B把問題帶回照顧計畫本身，讓團隊了解每天提醒與夜間協助對家庭的影響。若問題包含過多任務、不適合的提醒方式或未被處理的夜間需求，這個方向很重要；不能只把同樣的工作分給更多人就認定安排已合理。<\/p>\n<p>團隊可能協助修改計畫、了解夜間狀況或尋找資源，也可能暫時沒有立即可用的服務。等待討論期間，美玲仍需要休息與可行的協助，不能把B理解為先繼續撐到下次訪視。如果負荷已影響安全，應提早聯繫，不只等待原定時間。<\/p>\n<p>還需知道哪些工作最耗力、哪些有必要及時處理、誰能回覆與何時回顧。B屬照顧協調，並不要求治療師接手說服父親。患者意願與照顧者能力都需分別理解。<\/p>\n"}}], "note": [{"title": "兩個方向如何搭配？", "body": "<p><strong>在本題已知資訊下，A與B都值得採取，沒有必須排成唯一正確順序的依據。<\/strong> 它們的差異是「誰可以分擔現有工作」與「現有安排是否需要改變」，不是兩種相同說法。<\/p>\n<p>若今晚就沒有足夠人力維持安全，應先處理當下支援；若已有短期協助，則可用較完整的時間重新討論計畫。可對弟弟說：「你先告訴我週末能來多久，我們只安排你會做的部分。」也可對團隊說：「我需要重新討論提醒練習的責任，夜間照顧也讓我睡不夠，請一起評估。」不必等第一條路成功才走另一條。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前A與B可並行，沒有足夠依據排成唯一正解。<\/p>\n<p>本題較建議把A、B當成可搭配的行動，依支援是否急迫及可聯繫的時機安排，無須挑一個淘汰另一個。<\/p>\n<p>有些問題需要兩種互補的行動。多學一句勸人的話，無法代替休息、人力與計畫調整；找不到即時支援，也不代表照顧者表達得不夠好。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 服務、費用、人力及家庭關係各有差異，不保證資源可得。安排休息時仍需維持必要照護，不能突然留下無法安全獨處的人。<\/p>\n"}], "story": "<p>美玲白天工作，晚上常因父親需要協助而醒來。她還被家人期待每天提醒父親練習，最近常為此爭執。父親今天已清楚說不想再談練習，美玲已停止勸說，當下必要照護也已安排。<\/p>\n<p>弟弟週末可能有空，但沒學過移位協助；治療師下次來訪時可以討論目前計畫。現在沒有證據顯示父親只要更願意練，美玲的夜間負荷就會立刻減少。<\/p>\n", "learngoal": "將照顧者負荷視為需要處理的問題，區分增加分工與修改不合適的照顧安排", "takeaway": "照顧負荷通常需要同時看兩件事：誰能分擔現有工作，以及原本的照顧計畫是否需要修改。兩個方向可以並行，不必強迫家屬二選一。", "overallfull": "<p><strong>目前建議：<\/strong> 目前A與B可並行，沒有足夠依據排成唯一正解。<\/p>\n<p>本題較建議把A、B當成可搭配的行動，依支援是否急迫及可聯繫的時機安排，無須挑一個淘汰另一個。<\/p>\n<p>有些問題需要兩種互補的行動。多學一句勸人的話，無法代替休息、人力與計畫調整；找不到即時支援，也不代表照顧者表達得不夠好。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 服務、費用、人力及家庭關係各有差異，不保證資源可得。安排休息時仍需維持必要照護，不能突然留下無法安全獨處的人。<\/p>\n"}, {"id": "C04", "title": "「你有聽我說嗎？」此刻先處理哪件事？", "kind": "case", "preface": "<p><strong>閱讀提示：<\/strong> 情境中的回應者為治療師；所有讀者皆可比較其判斷。<br />\n<strong>對應章節：<\/strong> T2、T4；改編來源V4案例CT1。<br />\n<strong>學習目標：<\/strong> 分開理解對安排的立場與對關係的抱怨，選擇當下會談任務。<br />\n<strong>改編說明：<\/strong> 改編CT1；補入修復後轉為規劃的條件版本。<br />\n<strong>依據：<\/strong> V4 T2、T4；MI四任務與discord，R1–R3。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>此刻哪個回應最適合作為下一步？<\/p>\n", "options": [{"label": "A", "text": "<p>「我記得你想下午能出門，這些練習也是往那個方向。我先說明為什麼這樣安排，好嗎？」<\/p>\n"}, {"label": "B", "text": "<p>「那我們先看哪些活動最耗力，把它們和下午出門的時間一起重新排，你覺得如何？」<\/p>\n"}, {"label": "C", "text": "<p>「我這兩次先問做了多少，沒有回頭了解你下午的需要。你覺得我還漏掉了什麼？」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：較不建議。<\/strong><\/p>\n<p>A想說明專業安排和生活目標的關聯，也有詢問是否願意聽。如果趙先生正在問「為什麼這樣排」，這項說明可以有幫助，專業建議本身並非MI禁忌。<\/p>\n<p>但他現在指出的是自己反覆表達卻未被聽見。此刻優先解釋原安排，容易像在證明治療師其實有道理；即使說明正確，仍未回應被忽略的經驗。尚未評估活動對下午的影響，也不宜直接以目標一致為安排辯護，因此目前較不建議先採A。<\/p>\n<p>先了解漏掉了什麼及是否願意繼續談，再依需要說明專業理由與限制。「好嗎」不能自動讓辯護變成合作。這涉及discord與Fixing Reflex：助人者想把誤會澄清得太快，可能反而錯失修復關係的機會。<\/p>\n", "B": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>B提出實際的共同調整，回應負荷與生活時間，並徵詢意見。在趙先生已感到被理解、願意討論做法時，這可能是有效率的規劃起點。<\/p>\n<p>目前它可能太快跨到解決方案。即使最後減少活動，趙先生仍可能覺得治療師沒有承認先前的忽略；而且哪些活動能調整，還需要負荷與安全資訊。B不是不當建議，但現在先做，可能修了時間表卻沒修復合作。<\/p>\n<p>需要知道他是否想談新安排、哪些活動耗力與可行限制。規劃可以與評估相連，但不能預先承諾某種排法一定讓下午有精神。<\/p>\n", "C": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>C對治療師已發生的行為承擔具體責任，邀請趙先生補充被漏掉的需要。在本題中，<strong>C最直接回應discord訊號，較適合先做<\/strong>。重點是承認沒有了解影響，不需要誇大成「我之前的治療全部都錯了」。<\/p>\n<p>它可能讓對方較容易指出問題，也可能得到「我現在不想再說」。後者仍是要尊重的新資訊，不能因已道歉就要求對方接受。若他不想回答開放問題，可以先停，不以更多提問證明重視。<\/p>\n<p>接下來需知道是否願意繼續談、如何恢復合作，再回到共同焦點與可行安排。這是建立或修復關係的工作，不保證治療師換一句話就消除不協調。<\/p>\n"}}], "note": [{"title": "再看一項資訊", "body": "<p>另一個版本中，治療師已回應上述忽略，趙先生說：「你知道就好。現在幫我看看怎麼排，我還是想下午出去。」<\/p>\n<p>這時<strong>B較貼近他明確提出的規劃需求<\/strong>，並須補足活動負荷與安全資訊。A的安排說明可在需要時提供，無須優先為舊計畫辯護；C若反覆使用，反而可能拖延他想處理的工作。四任務可以往返，不必每次都從頭走完。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前優先C，先處理被忽略的互動經驗，再決定是否聚焦或規劃。<\/p>\n<p>「下午要留力氣」說明生活需要，尚不足以單獨判為Change Talk或Sustain Talk；需要先說清楚正在討論的改變目標。例如明確討論增加活動時，「我目前不想增加」才提供反對該改變的立場。「你有沒有聽」則指向互動。分別理解這些資訊，才能決定先修復、再聚焦或規劃。不要把患者整個人標成「抗拒型」。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 一句話不足以完成正式會談編碼。若出現新的身體或安全問題，先處理必要評估，不因正在修復關係而延誤。<\/p>\n"}], "story": "<p>趙先生與治療師原先談過，希望下午能留力氣到樓下坐。最近兩次治療師一進門便核對練習紀錄，尚未回顧活動對下午的影響。今天趙先生說：「我已經講過下午要留力氣，你每次都在問做了多少。你到底有沒有聽？」<\/p>\n<p>當下未見急迫症狀，也尚未完成當日負荷評估。這句話同時涉及活動安排與被忽略的感受；趙先生仍在對話中，沒有要求治療師立刻離開。<\/p>\n", "learngoal": "分開理解對安排的立場與對關係的抱怨，選擇當下會談任務", "takeaway": "「下午要留力氣」說明生活需要，尚不足以單獨判為Change Talk或Sustain Talk；需要先說清楚正在討論的改變目標。例如明確討論增加活動時，「我目前不想增加」才提供反對該改變的立場。「你有沒有聽」則指向互動。分別理解這些資訊，才能決定先修復、再聚焦或規劃。不要把患者整個人標成「抗拒型」。", "overallfull": "<p><strong>目前建議：<\/strong> 目前優先C，先處理被忽略的互動經驗，再決定是否聚焦或規劃。<\/p>\n<p>「下午要留力氣」說明生活需要，尚不足以單獨判為Change Talk或Sustain Talk；需要先說清楚正在討論的改變目標。例如明確討論增加活動時，「我目前不想增加」才提供反對該改變的立場。「你有沒有聽」則指向互動。分別理解這些資訊，才能決定先修復、再聚焦或規劃。不要把患者整個人標成「抗拒型」。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 一句話不足以完成正式會談編碼。若出現新的身體或安全問題，先處理必要評估，不因正在修復關係而延誤。<\/p>\n"}, {"id": "C05", "title": "「照你說的就好」：先確認哪一件事？", "kind": "case", "preface": "<p><strong>閱讀提示：<\/strong> 情境中的回應者為治療師；所有讀者皆可比較其判斷。<br />\n<strong>對應章節：<\/strong> T4、T6、T8；改編來源V4案例CT3。<br />\n<strong>學習目標：<\/strong> 分開確認談話餘裕、理解、意願與希望如何參與決策。<br />\n<strong>改編說明：<\/strong> 改編CT3，保留三種互不排斥的條件資訊；不設由選項導致的患者結局。<br />\n<strong>依據：<\/strong> V4自主支持、Ask–Offer–Ask與理解確認；R1、R2、R13。知情同意相關內容屬一般臨床倫理與溝通，非法律判定。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>三個回應想完成不同工作。依目前資訊，哪個適合先做？<\/p>\n", "options": [{"label": "A", "text": "<p>「為了確認我剛才說清楚了，可以請你說說回家準備怎麼做、什麼情況先停嗎？」<\/p>\n"}, {"label": "B", "text": "<p>「我想先確認你的意思：你是想採用這個建議，還是現在想先結束討論？也可能有其他想法，你可以告訴我。」<\/p>\n"}, {"label": "C", "text": "<p>「好，我把今天談的步驟寫下來，你明天照著試；下次再告訴我哪裡需要調整。」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>A用teach-back確認理解，並把說明清楚的責任放回治療師。若患者有餘裕且願意繼續，這是重要工作；不能因他說「好」就省略。它可能發現步驟、負荷或停止條件的誤解。<\/p>\n<p>但A主要取得「理解了什麼」，尚未回答「是否想做」或「現在是否有力氣談」。在本題接近結束、狀態不明的情況下，<strong>較建議先簡短確認B所問的意願與談話狀態，再視需要使用A<\/strong>。這不是固定順序；若患者主動問「我這樣理解對嗎」，A可能先用。<\/p>\n<p>風險在於患者重述正確後，治療師直接視為已同意，或在他疲累時要求像考試般作答。接下來仍需確認自願性、可行性、顧慮與決策偏好。teach-back可與MI搭配，但不是同意或決策能力測驗。<\/p>\n", "B": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>B先釐清現在要繼續安排還是暫停，也容許其他意思。它不預設周先生在敷衍，且在目前資訊不足時能先減少不必要的談話負擔。因此本題以B作為起點較合適。<\/p>\n<p>然而「想照建議」仍不能證明已充分理解；B之後若得到願意繼續的答案，還需要A一類的理解確認及相關同意程序。A與B代表的工作可以接續進行，選了B仍可能需要A。<\/p>\n<p>B也有風險：如果語氣像要求二選一，患者可能選較省事的答案。要真正允許他說「我想請你建議，但還有問題」，也要留意語言或認知支持需要。若他希望治療師主導建議，這可能是自主決策偏好，不能一律要求他自己想方案。<\/p>\n", "C": "<p><strong>目前判斷：較不建議。<\/strong><\/p>\n<p>C想把說明化為可記住的計畫，並保留後續調整機會。書面資料在理解與意願已確認後可能很實用，也能減少記憶負擔。<\/p>\n<p>目前卻尚不知道周先生理解了什麼、是否想採用，以及是否累到只想結束。直接安排明天執行，會把含糊回應視為足夠同意；下次再回報也無法補上開始前缺少的理解。寫下來不代表內容已可理解或能安全執行。<\/p>\n<p>需要先確認談話狀態、意願與理解，必要時調整語言、圖示或支持方式，之後才共同規劃。這涉及自主支持、資訊交換與知情同意的不同工作；不能因患者沒有反對，就越過未完成的確認。<\/p>\n"}}], "note": [{"title": "更多資訊：三個可比較的版本", "body": "<p><strong>版本一｜願意採用，也希望得到明確指引。<\/strong> 周先生說：「我想試，只是不會自己排，你建議我就好。」<\/p>\n<p>可回應：「可以，我把建議說具體，再由你確認是否適合。我也想確認剛才有說清楚，請你說說準備怎麼做。」接著了解顧慮與可行性。不能因他委託專業者建議，就判為缺乏自主；也不能因他願意，就跳過理解與風險說明。<\/p>\n<p><strong>版本二｜想停止談話。<\/strong> 周先生說：「我現在累到記不住，今天先不要。」<\/p>\n<p>可回應：「今天先不新增這項活動。我們只確認必要的安全事項，其他安排有精神時再談。」本題已說明可以延後；不能把這句話套用到所有必要醫療。也不要持續追問是否真的想進步，逼他證明拒絕的合理性。<\/p>\n<p><strong>版本三｜有意願，但理解有落差。<\/strong> 周先生說：「那就是每天做到很累，效果才會好。」<\/p>\n<p>可回應：「我剛才沒有說清楚，建議裡沒有做到很累這個要求。我們重新確認適合你的安排和停止條件。」需重教、確認理解，並再次確認是否接受；不能只說「你記錯了」後就要求照做。<\/p>\n<p>三個版本可以重疊，例如本人既想採用又很疲累。先處理當下負荷，再安排需要的確認，不強迫把人歸入單一類別。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前先採B確認意思與談話狀態；願意繼續時，仍需A所代表的理解確認。<\/p>\n<p>理解、意願、可行性與決策偏好分別提供不同資訊。沒有一句問法能一次證明充分同意；也不需因為一句含糊回答，就推定患者不自主。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不用靠椅背、語氣或點頭診斷疲勞、壓力或決策能力。語言或認知困難時先提供適當支持；代理決策與同意程序依所在地及機構規範處理。<\/p>\n"}], "story": "<p>接近看診結束，治療師剛說明一項新的居家活動建議。周先生靠回椅背，說：「好啦，照你說的就好。」<\/p>\n<p>尚未確認他理解的內容，也不知道他是否疲累。他先前有參與談話，沒有其他資料足以判定敷衍、受壓迫或缺乏決策能力。今天可以延後新增活動，沒有需立即執行該活動的急迫情況。<\/p>\n", "learngoal": "分開確認談話餘裕、理解、意願與希望如何參與決策", "takeaway": "理解、意願、可行性與決策偏好分別提供不同資訊。沒有一句問法能一次證明充分同意；也不需因為一句含糊回答，就推定患者不自主。", "overallfull": "<p><strong>目前建議：<\/strong> 目前先採B確認意思與談話狀態；願意繼續時，仍需A所代表的理解確認。<\/p>\n<p>理解、意願、可行性與決策偏好分別提供不同資訊。沒有一句問法能一次證明充分同意；也不需因為一句含糊回答，就推定患者不自主。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不用靠椅背、語氣或點頭診斷疲勞、壓力或決策能力。語言或認知困難時先提供適當支持；代理決策與同意程序依所在地及機構規範處理。<\/p>\n"}, {"id": "C06", "title": "想去市場，卻怕活動後累一整天", "kind": "case", "preface": "<p><strong>閱讀提示：<\/strong> 情境中的回應者為治療師；所有讀者皆可比較其判斷。<br />\n<strong>對應章節：<\/strong> T1、T5、T7、T8；改編來源V4案例CT4。<br />\n<strong>學習目標：<\/strong> 辨認需要身體與負荷評估的資訊，避免用動機探索或直接減量取代評估。<br />\n<strong>改編說明：<\/strong> 改編CT4；新增「近期持續時間有改變、尚未評估」及「已評估後想談目標」兩個條件版本。<br />\n<strong>依據：<\/strong> V4臨床分流、雙面反映與規劃；R1–R3、R10、R12。此題不提供疲勞診斷或運動劑量。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>接下來哪個方向應優先？<\/p>\n", "options": [{"label": "A", "text": "<p>「先把每次活動縮短，留一些力氣給下午；我們一起看看能怎麼調整，好嗎？」<\/p>\n"}, {"label": "B", "text": "<p>「你想去市場，也不想讓活動用掉整天的力氣。去市場最想重新做到的是什麼？」<\/p>\n"}, {"label": "C", "text": "<p>「最近累得更久，值得先弄清楚。我想了解開始時間、活動前後的狀況和其他變化，再決定需要哪些評估。」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：較不建議在評估前先定方案。<\/strong><\/p>\n<p>A試圖立即減輕負荷，並保留共同調整的空間，是常見且有照顧意圖的建議。若已掌握身體狀態與活動反應，調整可能是規劃的一部分。<\/p>\n<p>但目前疲勞持續時間改變，原因與安全條件未清楚。直接把「縮短」當作第一個答案，可能太早假定問題只在活動量，讓需要評估的變化被忽略。減量也不自動代表安全或有效。因此本題應先採C的方向，再決定A是否合適。<\/p>\n<p>還需了解活動內容、疲勞前後變化、休息反應及其他相關資訊，依臨床判斷處理與協調。A屬規劃與活動調整，不能用一般「少量多次」取代個別評估；本題不指定任何分鐘數或強度。<\/p>\n", "B": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>B的前半段有根據地反映生活願望與代價，後半段探索市場的個人意義，符合MI聚焦或喚起工作的可能用途。若目標尚不清楚，它可能幫助區分想買菜、見朋友或恢復自主。<\/p>\n<p>這個回應本身合理，但本題已知道她重視市場，且新增了尚未評估的疲勞變化。繼續擴大改變理由，不能回答這項身體訊息。可以保留前半句以確認理解，<strong>優先工作仍應轉向C<\/strong>，不以能否說出更多理由判斷願意程度。<\/p>\n<p>需要知道她有多少談話餘裕、疲勞變化及是否願意稍後再談生活目標。B的風險是把合理的負荷顧慮吸收成動機矛盾，讓評估被延後。反映做得貼切，也不能代替後續臨床工作。<\/p>\n", "C": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>C承認近期改變，先取得決定下一步所需的臨床資訊。<strong>在本題條件下，C應優先。<\/strong> 這個選擇不表示已判定特定病因，也不表示可以只靠訪談排除問題。<\/p>\n<p>詢問應依她能負荷的程度分段進行，必要時停止談話並安排合適評估。若出現急迫警訊，應即時處理，不能把問卷問完才求援。尚無足夠資料時，不必在當次保證找到可執行的訓練方案。<\/p>\n<p>接下來需整合症狀、活動、睡眠或其他相關資訊，依職責與團隊流程處理。這是臨床評估與安全責任，可維持MI的合作精神，但不宜把所有內容都稱為MI技術。<\/p>\n"}}], "note": [{"title": "再看一項資訊", "body": "<p>另一個版本中，團隊已評估疲勞，當下沒有新的身體變化，並有可共同討論的活動範圍。吳女士說：「今天我想先聊聊，回市場這件事對我還有什麼意思，再決定要不要安排。」<\/p>\n<p>此時<strong>B較適合她提出的談話目的<\/strong>。A仍可能太早；C若只是重複已處理且未改變的資訊，也可能妨礙她想談的問題。若她改為明確要求協助排活動，則在既有評估條件內進行規劃更合適。臨床優先順序取決於現有資訊與當事人需要。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前優先C，先釐清尚未評估的疲勞變化，再決定是否規劃或探索生活意義。<\/p>\n<p>同一句「想做，但會累」可以同時包含生活願望與需要評估的實際狀況。對話技巧協助理解；需要哪種專業工作，仍須根據當下資訊判斷。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 沒有突然神經症狀不等於沒有醫療問題。「已評估」也不代表永久安全，出現新變化要重新判斷。失語或認知困難者需要調整評估與溝通方式。<\/p>\n<hr />\n"}], "story": "<p>吳女士說：「我很想去市場，但最近做完活動會累到傍晚，比以前久。」她願意談幾分鐘，今天先不繼續活動。沒有報告突然出現的神經症狀，但疲勞變化尚未經評估，也不知道是否與睡眠、身體狀況或活動安排有關。<\/p>\n<p>治療師已知道去市場是她重視的目標。尚未有足夠資料決定應減少多少活動或何時恢復。<\/p>\n", "learngoal": "辨認需要身體與負荷評估的資訊，避免用動機探索或直接減量取代評估", "takeaway": "同一句「想做，但會累」可以同時包含生活願望與需要評估的實際狀況。對話技巧協助理解；需要哪種專業工作，仍須根據當下資訊判斷。", "overallfull": "<p><strong>目前建議：<\/strong> 目前優先C，先釐清尚未評估的疲勞變化，再決定是否規劃或探索生活意義。<\/p>\n<p>同一句「想做，但會累」可以同時包含生活願望與需要評估的實際狀況。對話技巧協助理解；需要哪種專業工作，仍須根據當下資訊判斷。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 沒有突然神經症狀不等於沒有醫療問題。「已評估」也不代表永久安全，出現新變化要重新判斷。失語或認知困難者需要調整評估與溝通方式。<\/p>\n<hr />\n"}, {"id": "C07", "title": "他想自己洗澡，太太希望先練走路", "kind": "case", "preface": "<p><strong>閱讀提示：<\/strong> 家庭共同會談情境；所有讀者皆可練習理解不同角色的需要。涉及評估、目標與照護安排時，仍由當事人和適任團隊討論。<br />\n<strong>對應章節：<\/strong> F6、T2、T8、T9；改編來源V4案例CT5，並運用CT7的公平決策原則。<br />\n<strong>學習目標：<\/strong> 區分本人目標、照顧者負荷與付款期待，先取得共同討論的基礎，不急著替家庭選定訓練優先順序。<br />\n<strong>改編說明：<\/strong> 將原家庭故事與互動合併於此，新增一次回應比較。<br />\n<strong>依據：<\/strong> MI合作、聚焦與自主支持，R1–R3；照顧者支持、個別化規劃與共同決策，R11–R13。家庭協商屬臨床延伸。<\/p>\n", "blocks": {}, "qa": [{"title": "如果是你，會怎麼回應？", "stem": "<p>此刻治療師先怎麼回應較合適？<\/p>\n", "options": [{"label": "A", "text": "<p>「先生想減少洗澡時的協助，太太需要減輕移動負擔。我先確認哪些內容方便一起談，再一起看需要的評估與安排。」<\/p>\n"}, {"label": "B", "text": "<p>「走路可能也會幫助洗澡，我們先以走路為主，等移動比較穩，再逐步加入洗澡目標，好嗎？」<\/p>\n"}, {"label": "C", "text": "<p>「兩個目標都重要。我們請先生和太太各說最優先的一項，今天先選一項開始評估，好嗎？」<\/p>\n"}], "feedback": {"A": "<p><strong>目前判斷：較符合MI或相關臨床原則。<\/strong><\/p>\n<p>A分別呈現兩人的需要，也保留洗澡細節可能涉及隱私。它讓雙方知道困難都會被處理，尚未把沉默當成許先生同意改目標，也沒有承諾只要練走路就能減少全部照顧負擔。<\/p>\n<p>實際接續時可先問許先生：「洗澡的部分，你願意現在一起談哪些內容？有想單獨說的，也可以另外安排。」太太則需要機會說明自己能承擔什麼、哪一段最吃力。分別談的目的在於取得各自的理解與意願，不是暗中拉攏一方。<\/p>\n<p>還需了解活動、安全、環境、時間與可用支援，才能協商焦點。A也可能需要較多時間；可以先確認本次要完成的評估與下次討論方式，不必當場解決全部衝突。這是合作、聚焦及自主支持與臨床規劃的結合。<\/p>\n", "B": "<p><strong>目前判斷：較不建議。<\/strong><\/p>\n<p>B試圖用專業路徑串起兩個目標，並讓家庭看見先後順序，是臨床上可能出現的建議。移動與洗澡也可能確實相關，不能說這個方向永遠不合理。<\/p>\n<p>但目前未評估就把走路設成優先或前提，忽略洗澡可能涉及坐姿安排、環境、協助方式或其他條件。它也容易讓付款期待成為決定方向的主要力量，使許先生的沉默被當成接受。即使結尾詢問「好嗎」，仍沒有補足判斷依據。<\/p>\n<p>下一步應先確認分享範圍、兩人的需要與具體評估，再說明可行選項及專業建議。若評估支持某項必要前置工作，應解釋理由與限制；不能為了讓雙方快速一致，先保證單一路線能解決所有需求。這涉及Fixing Reflex、共同聚焦與避免誘導的原則。<\/p>\n", "C": "<p><strong>目前判斷：可以更好。<\/strong><\/p>\n<p>C承認兩個目標，想讓雙方參與並聚焦當次工作。若時間有限且分享範圍、各自角色及必要資訊已釐清，選一項先評估可能很有效率。<\/p>\n<p>此刻先要求各選一項，可能把不同需要變成競爭，也可能讓許先生在付款者面前不敢表達。太太的負荷不一定要等患者選了某項訓練才處理；兩個目標也未必互斥。尚未確認隱私與實際關聯時，排序可能過早。<\/p>\n<p>可以先採A釐清討論條件，再問：「今天先了解哪一部分最有幫助？另一部分怎麼接著處理？」還需確認未被先選的需要不會消失。共同決策並非每人一票，也不代表治療師只能中立旁觀而不提供必要專業資訊。<\/p>\n"}}], "note": [{"title": "整體建議與帶走的原則", "body": "<p><strong>目前建議：<\/strong> 目前優先A，先確認分享範圍、兩人的需要及評估工作。<\/p>\n<p>目前優先採A，先讓雙方的需要和討論範圍清楚。可以暫以補足評估、另約單獨談話或安排照顧支持收尾；不必讓其中一方讓步才算成功。<\/p>\n<p>付款者的投入值得被聽見，但付款不直接代替本人決定目標；本人選擇也不等於照顧者必須承擔所有後果。這是依目前資訊提出的建議，實際安排須考量決策能力、照護資源與個別狀況。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不以沉默判定同意、家庭壓迫或決策能力。必要照護與代理決策依所在地及機構規範處理；本題不提供法律裁決，也不保證服務、人力或費用支持一定可得。<\/p>\n<hr />\n"}], "story": "<p>許先生說：「我想洗澡時少一點事情要太太幫。」太太接著說：「可是我每天扶他移動很累。我們花錢上課，能不能先讓他多練走路？」<\/p>\n<p>治療師尚未完成洗澡活動、移動方式與家中環境的評估，不知道兩個目標能如何銜接。許先生聽到妻子後安靜下來，沒有說改變目標，也尚未說明願意在她面前分享哪些洗澡細節。太太的照顧負荷真實存在，不能當成只是在干涉。<\/p>\n", "learngoal": "區分本人目標、照顧者負荷與付款期待，先取得共同討論的基礎，不急著替家庭選定訓練優先順序", "takeaway": "先讓患者與照顧者各自的需要，以及願意共同討論的範圍清楚，再安排評估與後續協商。尊重當事人的目標，也要正視照顧者的負擔。", "overallfull": "<p><strong>目前建議：<\/strong> 目前優先A，先確認分享範圍、兩人的需要及評估工作。<\/p>\n<p>目前優先採A，先讓雙方的需要和討論範圍清楚。可以暫以補足評估、另約單獨談話或安排照顧支持收尾；不必讓其中一方讓步才算成功。<\/p>\n<p>付款者的投入值得被聽見，但付款不直接代替本人決定目標；本人選擇也不等於照顧者必須承擔所有後果。這是依目前資訊提出的建議，實際安排須考量決策能力、照護資源與個別狀況。<\/p>\n<p>這是根據理論及題目情境提出的建議。實際應用仍需考量當事人的身體狀況、理解、意願、環境與可用支持，並非絕對答案。<\/p>\n<p><strong>本題限制：<\/strong> 不以沉默判定同意、家庭壓迫或決策能力。必要照護與代理決策依所在地及機構規範處理；本題不提供法律裁決，也不保證服務、人力或費用支持一定可得。<\/p>\n<hr />\n"}, {"id": "S01", "title": "同一段話，提問、肯定與摘要各在做什麼？", "kind": "skill", "preface": "<p><strong>適用對象：<\/strong> 所有想深入理解與練習溝通技巧的讀者；涉及臨床處置時仍由適任專業人員負責。<br />\n<strong>對應章節：<\/strong> T3。<br />\n<strong>學習目標：<\/strong> 依會談目的辨認OARS的功能，區分帶出新資訊、肯定努力與整理已知內容。<br />\n<strong>改編說明：<\/strong> 依T3新增的教學示例，並非新增真實病例。<br />\n<strong>依據：<\/strong> V4 T3；OARS與摘要的概念，R1–R3。反映的推論程度另見S02。<\/p>\n", "blocks": {}, "qa": [{"title": "想一想，你會怎麼選？", "stem": "<p>下列哪句較適合這個會談目的？先選一句，再試著說出三個選項各主要在做什麼。<\/p>\n", "options": [{"label": "A", "text": "<p>「你這週真的試了兩次，也留意到時間會影響安排。你有在找適合自己的做法。」<\/p>\n"}, {"label": "B", "text": "<p>「你想少等人，也試了兩次；早上趕，晚上可能較合適，但還沒決定。我有漏掉什麼嗎？」<\/p>\n"}, {"label": "C", "text": "<p>「除了早上趕時間，還有哪些事情會影響你想不想試？你可以挑最在意的一項說。」<\/p>\n"}], "feedback": {"A": "<p>A主要是<strong>肯定<\/strong>：辨認她實際嘗試與觀察安排的努力。「找適合自己的做法」有她提出晚上可能性的依據，不只是泛稱很棒。它可能讓努力被看見，也不把肯定限制在完全獨立或完全遵從。<\/p>\n<p>但本題當下目的在確認對取捨的理解，A沒有完整呈現「早上需要協助」與「尚未決定」。如果患者不喜歡被評價，也可能覺得治療師忙著稱讚。A可用，卻不如B直接完成目前工作。<\/p>\n<p>還需知道她是否接受這個理解、是否想改時間，以及有沒有其他顧慮。肯定不能把「試過兩次」延伸成「已承諾繼續」，也不應以努力為理由要求增加活動。<\/p>\n", "B": "<p>B主要是<strong>摘要<\/strong>，把談話中不同時點的重要資訊整理在一起；最後另加一個核對問題。它保留願望、已嘗試的經驗、時間限制與未決定的狀態，<strong>最貼近本題先確認理解的目的<\/strong>。<\/p>\n<p>摘要也是反映式傾聽的一種運用，不能靠句子長度或出現「也」就分類。此題提供了數段先前資訊，因此有整理整段談話的功能。如果只看到B這一句而沒有前文，判斷依據就會減少。<\/p>\n<p>B可能讓簡女士修正遺漏，也可能資訊太多、不容易跟上。可依理解能力分段說明。下一步要聽她的修正，確認想繼續哪個話題；不能在她說「沒漏」之後直接當作同意晚上練習。<\/p>\n", "C": "<p>C主要是<strong>開放式提問<\/strong>，邀請新的影響因素，並允許只談一項以降低負擔。若目前只知道時間問題、懷疑仍有重要未說明的顧慮，這個提問可能有價值，也不必因已出現改變語句就禁止探索困難。<\/p>\n<p>但本題正在準備核對已聽到的內容，C會先把話題擴大。如果不停補問，可能讓她覺得永遠要提供更多理由。它可接在確認理解之後；不能僅因是開放式問題就自動優先。<\/p>\n<p>需知道是否真的有未談的資訊、患者是否願意繼續，以及新問題與共同焦點的關係。問題形式開放，不代表方向一定中立或負擔一定低。<\/p>\n"}}], "note": [{"title": "整體建議與帶走的原則", "body": "<p>三句都可以出現在合作談話中，但完成的工作不同。本題以B較合適，依據是當下要核對理解；若目的是了解未說出的困難，C可能更直接。技巧名稱幫助描述功能，不能代替判斷。<\/p>\n<p><strong>本題限制：<\/strong> 這是功能辨識，不是正式MITI編碼。摘要與反映有重疊，複合句也可能含不只一種行為；不要將整句強制算成唯一技巧或用字數分類。<\/p>\n"}], "story": "<p>簡女士在同一段談話中先後說：<\/p>\n<p>「我想自己穿外套，出門不用一直等。」<br />\n「這週有試兩次，不過早上趕時間，還是請先生幫比較快。」<br />\n「晚上比較不趕，我在想能不能換晚上，但還沒決定。」<\/p>\n<p>她還有時間談，沒有要求治療師立即建議。治療師準備確認自己的理解，再決定往哪裡談。<\/p>\n", "learngoal": "依會談目的辨認OARS的功能，區分帶出新資訊、肯定努力與整理已知內容", "takeaway": "三句都可以出現在合作談話中，但完成的工作不同。本題以B較合適，依據是當下要核對理解；若目的是了解未說出的困難，C可能更直接。技巧名稱幫助描述功能，不能代替判斷。", "overallfull": "<p>三句都可以出現在合作談話中，但完成的工作不同。本題以B較合適，依據是當下要核對理解；若目的是了解未說出的困難，C可能更直接。技巧名稱幫助描述功能，不能代替判斷。<\/p>\n<p><strong>本題限制：<\/strong> 這是功能辨識，不是正式MITI編碼。摘要與反映有重疊，複合句也可能含不只一種行為；不要將整句強制算成唯一技巧或用字數分類。<\/p>\n"}, {"id": "S02", "title": "哪些意思是患者說的，哪些是我加的？", "kind": "skill", "preface": "<p><strong>適用對象：<\/strong> 所有想深入理解與練習溝通技巧的讀者；涉及臨床處置時仍由適任專業人員負責。<br />\n<strong>對應章節：<\/strong> T3、T5；改編來源V4案例CT2。<br />\n<strong>學習目標：<\/strong> 比較貼近原意、保留兩面與增加推測的反映，並練習在患者修正後調整理解。<br />\n<strong>改編說明：<\/strong> 依CT2的反映失準問題新增穿衣短情境；新增資訊只用於本題，不回填為原案例既有事實。<br />\n<strong>依據：<\/strong> V4簡單／複雜反映、雙面反映與修復；R1、R2。此題不以複雜程度評價優劣。<\/p>\n", "blocks": {}, "qa": [{"title": "想一想，你會怎麼選？", "stem": "<p>你會先採用哪個反映？選擇後，找出每句中哪些有原話依據，哪些多加了意義。<\/p>\n", "options": [{"label": "A", "text": "<p>「早上趕時間，讓太太幫比較快，你還沒決定怎麼安排。」<\/p>\n"}, {"label": "B", "text": "<p>「你想自己穿好，也希望早上別花太多時間，現在還在想怎麼安排。」<\/p>\n"}, {"label": "C", "text": "<p>「你希望自己穿好，因為每次接受幫忙，都會提醒你和以前不一樣了。」<\/p>\n"}], "feedback": {"A": "<p>A以原話重述時間與協助條件，偏向<strong>簡單反映<\/strong>。它沒有為依賴加上羞恥或失落，適合先確認目前最具體的困難。若患者理解負荷較高、當下只想談早上怎麼辦，貼近原意可以很有用。<\/p>\n<p>它省略了「想自己穿好」的願望。若只反映這一面後立即建議讓太太幫，可能把另一個需求擱置。A本身不等於放棄改變，也不因簡單就較差；要看接下來是否仍容納本人想參與的部分。<\/p>\n<p>下一步需確認是否理解正確、時間壓力如何影響選擇，以及他想先談哪一面。簡單反映降低推測，仍有選擇重點的作用。<\/p>\n", "B": "<p>B把想自己完成與早上的時間限制放在一起，屬於<strong>有原話根據的雙面反映<\/strong>。本題要理解取捨，因此B最完整地保留目前兩個重要考量，較適合作為起點。<\/p>\n<p>「希望別花太多時間」是由「早上很趕、幫比較快」而來的近義理解，仍可被修正。雙面反映描述呈現兩面的功能；它是否在特定編碼系統中被判為簡單或複雜，仍需看增加的意義與規則，不能由「雙面」直接決定。<\/p>\n<p>B將時間顧慮放在後面，並不因此成為錯誤。當下需要忠實呈現取捨；若已有共同改變焦點，可以選擇突出本人支持改變的一面，但不能依句尾位置保證效果。接下來要等本人修正與決定想談什麼，不直接排活動。<\/p>\n", "C": "<p>C加入「接受幫忙提醒自己和以前不同」的意義，屬於<strong>複雜反映的推測<\/strong>。臨床上失落確實可能存在；若先前已談過這份經驗，這句可能有助於說出未整理的感受。因此它不是一個毫無可能性的荒謬選項。<\/p>\n<p>然而本題沒有那項依據，目前比A、B更容易偏離。它還把想自己做的理由說成單一因果，可能讓患者覺得治療師在替自己解釋人生。現有資訊下不優先採C；若要探索更深層意義，先提供可被否認的空間，不能因它聽起來更深就加分。<\/p>\n<p>還需知道本人如何理解接受協助、是否真的有失落，以及是否願意談。複雜反映是一個理解假設，不能作為證明患者內心的結論。<\/p>\n"}}], "note": [{"title": "反映失準後：已有新資訊時怎麼修復？", "body": "<p>這是一段供比較的補充版本，不由讀者選項觸發。治療師先前說了C，患者修正：「我沒在想以前。我只怕太太早上趕上班。」<\/p>\n<p>可回應：「我剛才猜偏了。你在意的是太太早上要趕著上班。」說完留空間，再依本人修正繼續；必要時問：「你想先談怎麼安排，還是今天先到這裡？」<\/p>\n<p>前一句接受了新的資訊，沒有把原本的失落解釋包裝成「你可能自己沒發現」。後一句才邀請下一步，不預設已同意新計畫。如果他連時間影響也要修正，仍應再聽。修復可以簡短，不需要長篇道歉讓患者反過來安慰治療師。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p>先看反映的根據與目的，再看名稱。短句可能精準，複雜反映可能失準；雙面反映也不能補上患者沒說過的一面。接受修正，比守住原本的解釋重要。<\/p>\n<p><strong>本題限制：<\/strong> 不據此診斷羞恥、哀傷或家庭關係。若患者語言理解有限，應調整表達；不能把沒回答解讀為默認推測。<\/p>\n"}], "story": "<p>患者說：「我想自己把外套穿好，可是讓太太幫比較快。早上時間很趕，我還沒想好怎麼辦。」<\/p>\n<p>目前只知道他想自己完成、太太幫比較快、時間趕及尚未決定。他沒有說丟臉，也沒有說擔心太太的體力。治療師想先理解取捨，尚未評估新的穿衣安排。<\/p>\n", "learngoal": "比較貼近原意、保留兩面與增加推測的反映，並練習在患者修正後調整理解", "takeaway": "先看反映的根據與目的，再看名稱。短句可能精準，複雜反映可能失準；雙面反映也不能補上患者沒說過的一面。接受修正，比守住原本的解釋重要。", "overallfull": "<p>先看反映的根據與目的，再看名稱。短句可能精準，複雜反映可能失準；雙面反映也不能補上患者沒說過的一面。接受修正，比守住原本的解釋重要。<\/p>\n<p><strong>本題限制：<\/strong> 不據此診斷羞恥、哀傷或家庭關係。若患者語言理解有限，應調整表達；不能把沒回答解讀為默認推測。<\/p>\n"}, {"id": "S03", "title": "「做得到」「願意做」「做過了」差在哪裡？", "kind": "skill", "preface": "<p><strong>適用對象：<\/strong> 所有想深入理解與練習溝通技巧的讀者；涉及臨床處置時仍由適任專業人員負責。<br />\n<strong>對應章節：<\/strong> T4、T7。<br />\n<strong>學習目標：<\/strong> 根據語境區分能力信念、行動傾向、已採步驟與未來承諾，避免把DARN–CAT當進度階段。<br />\n<strong>改編說明：<\/strong> 依V4 T4的穿衣目標新增兩個獨立語句判讀小題；兩題不是同一患者先後進步的劇情。<br />\n<strong>依據：<\/strong> V4 DARN–CAT與目標相對性；R1、R2。這是基礎語意判讀，不是正式研究編碼或決策能力測驗。<\/p>\n", "blocks": {}, "qa": [{"title": "他是在說做得到，還是在說願意試？", "stem": "<p><strong>已知資訊。<\/strong> 治療師正在問哪種條件可能讓動作做得到。患者回答：「如果袖口先擺好，我應該能把手伸進去。我還沒想好要不要用這個方法。」<\/p>\n<p><strong>提問。<\/strong> 就「我應該能把手伸進去」在這段脈絡中的主要功能，哪個理解較有依據？<\/p>\n", "options": [{"label": "A", "text": "<p>「主要表達有條件的Ability；是否願意採用這個方法仍未決定。」<\/p>\n"}, {"label": "B", "text": "<p>「主要表達初步的Activation；語氣還保留，表示開始願意試這個方法。」<\/p>\n"}], "feedback": {"A": "<p>A把「能做得到」理解為能力信念，並保留患者明說尚未決定的意願。<strong>在本題語境中，A較有依據。<\/strong> 他是在回答可行條件，並非表達願意採用。<\/p>\n<p>這能提醒治療師了解袖口擺放為何重要，卻不能直接推論客觀上安全或能完成；自述信念仍需與實際評估區分。下一步可以確認他想不想了解或嘗試，不必立即安排，也不能將「還沒決定」當作對治療師的不滿。<\/p>\n<p>這一判讀與DARN中的Ability有關。它的價值是避免把能力語句轉譯成同意，不在於背出字母A。<\/p>\n", "B": "<p>B注意到「應該能」帶有可能性，試圖辨認逐漸朝行動靠近的語言。日常中文的「可以試」確實可能同時涉及做得到或願意，因此不能只靠一個詞分類。<\/p>\n<p>但這題的前問是能力條件，患者又明說未決定要不要用。把它判為Activation，會加上原話尚未支持的行動傾向；若因此開始規劃，可能誤讀意願。應回到上下文，保留「願不願意」仍待確認。<\/p>\n<p>如果另一個情境是患者說「我願意試看看，還沒想好哪一天」，才有較直接的Activation依據；仍不等於已承諾特定日期與做法。這是語句比較，不要求治療師引導患者一定改說後一句。<\/p>\n"}}, {"title": "昨天做過一個步驟，能推論明天的承諾嗎？", "stem": "<p><strong>已知資訊。<\/strong> 另一位患者說：「昨天我先把外套和袖口擺好了，也試過一次。明天要不要再試，我還沒決定。」治療師沒有在場，內容是患者自述。<\/p>\n<p><strong>提問。<\/strong> 關於這段話，下列哪個紀錄式理解較精確？<\/p>\n", "options": [{"label": "A", "text": "<p>「已有實際嘗試，可視為對持續練習的初步承諾；下一步確認明天的時間。」<\/p>\n"}, {"label": "B", "text": "<p>「有Taking Steps的自述；明天是否再試未定，下一步了解經驗與想法。」<\/p>\n"}], "feedback": {"A": "<p>A重視已發生的行動，想趁著經驗把計畫說清楚。若患者另有表達願意繼續，確認時間確實可能合適；行動經驗也值得回顧。<\/p>\n<p>但本題患者明說明天未決定，過去做過一次不能替代未來承諾。A將歷史行動延伸為持續意圖，推論超過已知資訊。直接問明天幾點，可能讓尚未選擇的安排變成預設要做。<\/p>\n<p>仍需了解試過後的感受、身體反應、條件與是否想繼續。DARN–CAT不是由Taking Steps自動升級到Commitment的階梯，也不能以一次活動判定TTM階段。<\/p>\n", "B": "<p>B保留已採相關步驟的語言，也保留尚未形成的未來決定，<strong>最符合本題資料<\/strong>。可以回應：「你昨天準備過，也試了一次。那次做起來如何？」再依回答討論是否繼續。<\/p>\n<p>這樣問可以取得經驗，但不能只尋找成功部分、忽略不適或不想繼續的理由。Taking Steps在此是自述，未獨立確認動作、完成程度或安全性；不能記成治療師已觀察到熟練執行。<\/p>\n<p>下一步是否進入計畫，需依理解、意願、可行性與當下需要。分類幫助保留語意，不能代替同意及臨床評估。<\/p>\n"}}], "note": [{"title": "延伸比較：能力信念、成效期待與執行障礙", "body": "<p>「袖口先擺好，我應該能做到這一步」描述特定條件下的能力信念，與自我效能的問題相近；「這樣練，我的手就一定會完全恢復」則是對結果的期待，還含有不能承諾的療效推論。兩者都不能代替實際能力與安全評估。[V4 T9；R8]<\/p>\n<p>若下次沒有做，先問實際發生了什麼：忘記步驟、沒有協助、活動不舒服，或改變意願，都可能需要不同處理。一次未執行不足以判定TTM階段，MI也不要求先貼好階段標籤才開始談。[V4 T7、T9；R5、R7]<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p>分類之前先看目標、前問與整句話。能力信念、願意嘗試、已做過與未來承諾提供不同資訊；人可以做過一次仍未決定繼續，也可以願意卻缺乏條件。<\/p>\n<p><strong>本題限制：<\/strong> 只判斷這些明示語句，不推論人格、準備階段、客觀能力或決策能力。真實談話可能同時含多類語句，必要時保留多重理解與不確定性。<\/p>\n"}], "special": true, "shared": "<p>兩題都以「在已評估的適當條件下，嘗試新的穿衣方法」為討論目標。尚未有未來固定執行的協議。不要把「恢復全部能力」或「增加所有訓練」偷偷替換成分類目標。<\/p>\n", "learngoal": "根據語境區分能力信念、行動傾向、已採步驟與未來承諾，避免把DARN–CAT當進度階段", "takeaway": "分類之前先看目標、前問與整句話。能力信念、願意嘗試、已做過與未來承諾提供不同資訊；人可以做過一次仍未決定繼續，也可以願意卻缺乏條件。", "overallfull": "<p>分類之前先看目標、前問與整句話。能力信念、願意嘗試、已做過與未來承諾提供不同資訊；人可以做過一次仍未決定繼續，也可以願意卻缺乏條件。<\/p>\n<p><strong>本題限制：<\/strong> 只判斷這些明示語句，不推論人格、準備階段、客觀能力或決策能力。真實談話可能同時含多類語句，必要時保留多重理解與不確定性。<\/p>\n"}, {"id": "S04", "title": "患者已經想學，還要再問改變理由嗎？", "kind": "skill", "preface": "<p><strong>適用對象：<\/strong> 所有想深入理解與練習溝通技巧的讀者；涉及臨床處置時仍由適任專業人員負責。<br />\n<strong>對應章節：<\/strong> T2、T6。<br />\n<strong>學習目標：<\/strong> 依患者已有資訊與明確請求決定如何交換資訊，避免把Ask–Offer–Ask或四任務當固定程序。<br />\n<strong>改編說明：<\/strong> 改編T6直接教學短例；新增先備理解不明的條件版本。<br />\n<strong>依據：<\/strong> V4四任務及Ask–Offer–Ask；R1–R3。穿衣示範屬復健教學，不能由MI精神取代動作評估。<\/p>\n", "blocks": {}, "qa": [{"title": "想一想，你會怎麼選？", "stem": "<p>治療師接下來怎麼做較合適？<\/p>\n", "options": [{"label": "A", "text": "<p>「可以，我先示範找袖口這一步，再請你指出哪裡還不清楚，看看怎麼調整。」<\/p>\n"}, {"label": "B", "text": "<p>「可以，示範前先請你說一次目前知道的完整流程，我再補上需要說明的部分。」<\/p>\n"}, {"label": "C", "text": "<p>「可以，開始前先談談自己穿好對你有什麼重要性，再一起決定怎麼練這一步。」<\/p>\n"}], "feedback": {"A": "<p>A回應已明確提出的資訊需求，提供一小段示範，再詢問理解與使用感受。<strong>在本題已完成前置確認的條件下，A最直接。<\/strong> 患者的主動請求已構成對此項示範的邀請，不必為符合固定句型再問一次是否想聽。<\/p>\n<p>示範之後仍要看他理解了什麼、是否想實作及需要哪些協助。若合適，可以在安全條件下讓他試做，由治療師觀察；不能只問「懂嗎」就推論會做。新出現的疑問或不適也會改變下一步。<\/p>\n<p>Ask–Offer–Ask關心資訊如何與本人需求相連，不要求每次從零開始。四任務中的規劃可以與專業教學銜接，不需要重新引出已清楚的改變理由；教學本身仍有專業內容與安全責任。<\/p>\n", "B": "<p>B想先了解既有知識，避免教學有缺口，符合資訊交換中常見的需要。對初次接觸、前面理解不清楚或指令複雜的患者，它可能很重要。<\/p>\n<p>但本題已說明患者能重述目的與注意事項，並明確指出只卡在哪一步。再要求完整重述，可能重複增加負荷，也讓人覺得每次求教都要先過關。可以針對確實不清楚的一點確認，沒有必要為保留第一個Ask而重考整段。<\/p>\n<p>若不確定的其實是前置步驟、理解或安全，B所代表的檢查就應恢復優先。這需要新證據，不能僅因「有問比較像MI」便固定使用。<\/p>\n", "C": "<p>C探索生活意義，可能有助於聚焦或喚起。若患者不清楚為何要學、對安排有矛盾，討論重要性可以讓計畫更貼近本人。<\/p>\n<p>目前已有意願、理解與具體請求，再探索重要性沒有明顯資訊缺口，可能拖延所需教學，讓患者感覺要先說出足夠理由才值得被教。C不應成為進入規劃的必經程序。<\/p>\n<p>若過程中患者表示「其實我只是家人叫我學」，才需回頭了解自主意願與焦點；不能預先假定每個願意者都有隱藏矛盾。是否喚起要依談話需要，不按四任務順序強制完成。<\/p>\n"}}], "note": [{"title": "再看一項資訊", "body": "<p>把前提改成：患者是第一次聽到這個方法，只說「別人說有用，你教我就好」；目前不知道他理解什麼，也尚未完成必要評估與說明。<\/p>\n<p>這時<strong>B所代表的先了解既有理解較有需要<\/strong>，但句子要符合第一次接觸：「你目前聽過哪些做法？我先確認需要說明和評估的部分。」這個問法不能取代必要評估；也不要求初學者重述尚未被教過的完整流程。A所代表的直接示範需等合適條件確認，C則仍非自動必需。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p>好的合作包含有效率地回應明確需求。詢問、提供資訊與再確認可以跨越前後幾段談話完成，不必反覆重演同一套句型；直接給專業建議也可以尊重自主。<\/p>\n<p><strong>本題限制：<\/strong> 患者請求教學不等於授權所有處置。語言、理解、疲勞或安全條件改變時，需調整教學；此處不提供通用穿衣方法或居家訓練處方。<\/p>\n<hr />\n"}], "story": "<p>治療師已完成當下活動所需的評估與說明，患者能用自己的話說出方法目的、注意事項與何時停止，也清楚表示想學。患者說：「我知道前面怎麼放，現在只卡在找袖口。你先示範那一步給我看，好嗎？」<\/p>\n<p>他目前有精神參與，沒有新的症狀。這一題討論教學的下一步，不表示一次理解確認就涵蓋所有未來活動的同意。<\/p>\n", "learngoal": "依患者已有資訊與明確請求決定如何交換資訊，避免把Ask–Offer–Ask或四任務當固定程序", "takeaway": "好的合作包含有效率地回應明確需求。詢問、提供資訊與再確認可以跨越前後幾段談話完成，不必反覆重演同一套句型；直接給專業建議也可以尊重自主。", "overallfull": "<p>好的合作包含有效率地回應明確需求。詢問、提供資訊與再確認可以跨越前後幾段談話完成，不必反覆重演同一套句型；直接給專業建議也可以尊重自主。<\/p>\n<p><strong>本題限制：<\/strong> 患者請求教學不等於授權所有處置。語言、理解、疲勞或安全條件改變時，需調整教學；此處不提供通用穿衣方法或居家訓練處方。<\/p>\n<hr />\n"}, {"id": "S05", "title": "想改變、暫時不改與關係摩擦，如何分開理解？", "kind": "skill", "preface": "<p><strong>適用對象：<\/strong> 所有想深入理解與練習溝通技巧的讀者；不要求以專業身分作答。<br />\n<strong>對應章節：<\/strong> T2、T4、T5；可先讀S03的語句判讀。<br />\n<strong>學習目標：<\/strong> 依具體目標辨認Change Talk、Sustain Talk及Discord，選擇回應而不把整個人貼上抗拒標籤。<br />\n<strong>改編說明：<\/strong> 依V4 T4新增短情境，不是原案例的未記錄對話。<br />\n<strong>依據：<\/strong> V4改變目標相對性、雙面反映與四任務，R1–R3。<\/p>\n", "blocks": {}, "qa": [{"title": "想一想，你會怎麼選？", "stem": "<p>如果希望理解他目前的取捨，再決定下一步，哪個回應較有依據？<\/p>\n", "options": [{"label": "A", "text": "<p>「早上不用等人對你很重要。如果能自己穿，還有哪些生活上的好處？」<\/p>\n"}, {"label": "B", "text": "<p>「我們先停一下。你是不是覺得我在催你，需要換個談法？」<\/p>\n"}, {"label": "C", "text": "<p>「你想少等人，也顧慮早上花的時間，所以這週先照原來的方式。你想先談這個時間問題，還是先到這裡？」<\/p>\n"}], "feedback": {"A": "<p><strong>目前較不優先；有MI喚起的用途，但需顧及已表達的限制。<\/strong><\/p>\n<p>A接住支持改變的理由，邀請延伸，是可能的MI喚起方式。患者的「我想自己穿」帶有Desire，「不用一直等人」提供Reasons，不能因後面說照舊就把這些願望抹掉。<\/p>\n<p>然而他已清楚提出時間顧慮與這週的選擇，此刻只延伸好處，可能讓他覺得自己的限制沒有被處理，像是要繼續提供理由直到答應。這不表示MI不能選擇性關注改變語句，而是需要維持合作、共同焦點與對實際條件的理解。<\/p>\n<p>接下來需確認他是否想繼續探索理由、還是先處理時間與方法。若他明確想談自己在意什麼，A可能很合適；若已要求停止，就不要用新的優點問題延長談話。<\/p>\n", "B": "<p><strong>目前推測較多；需要關係摩擦的其他依據。<\/strong><\/p>\n<p>B注意可能的壓力，願意停止並調整互動，意圖合理。但題目沒有提供關係抱怨或其他摩擦訊號，患者只是在說對這項改變的立場。直接問是否被催，可能把談話帶向尚未出現的關係問題，讓患者還要安撫治療師。<\/p>\n<p>「這週先照舊」相對於題目指定的新穿衣方法，具有Sustain Talk的意義；它不自動等於Discord，也不能據此認定應結束所有對話。要看對方是否仍願意討論，以及互動中有沒有被忽略、爭辯或受壓的經驗。<\/p>\n<p>若出現明確關係訊號，B所關注的修復工作會變重要；此時仍宜回應具體發生的事，避免只用籠統的「你是不是覺得」代替承擔責任。<\/p>\n", "C": "<p><strong>目前較符合MI或相關臨床原則。<\/strong><\/p>\n<p>C保留已說出的願望、時間顧慮與這週的選擇，再詢問是否想處理問題或暫停，最符合本題先理解取捨的目的。它沒有把暫時不改寫成永遠拒絕，也沒有將願意談當成同意實作。<\/p>\n<p>雙面反映在這裡讓兩種方向都被聽見，但不保證對方改變選擇。後面兩個方向也不是全部可能；若患者想談其他事，仍可補充。要避免用「談時間」暗中帶成必須立刻排練習。<\/p>\n<p>下一步取決於他的回應及可行條件。時間問題可能需要環境或協助方式調整，也可能目前無解；不能只要求提高動機。這結合反映、聚焦與自主支持，活動安排則屬臨床延伸。<\/p>\n"}}], "note": [{"title": "再看一項資訊：若出現關係摩擦", "body": "<p>另一個版本中，患者另外說：「我已經說這週先不要，你卻一直問好處，好像一定要我答應。」<\/p>\n<p>這裡新增了對互動的明確抱怨，支持Discord的理解；原本對活動的維持立場仍存在。此時應先處理B所關注的關係問題，而非再增加理由探索。可具體回應：「你已經說這週先不要，我還一直追問，讓你覺得一定得答應。我先停下這個話題。」再依對方意願與必要照護安排後續。<\/p>\n<p>這段資料不由A或其他選項必然造成，也不推定患者之後會接受道歉。它用來比較：當關係訊號改變時，會談工作為何要改變。<\/p>\n"}, {"title": "整體建議與帶走的原則", "body": "<p>初始情境優先C；如果新增明確互動壓力，先修復合作。Change Talk與Sustain Talk依具體改變目標理解，Discord關注互動，三者不是互斥的人格分類。<\/p>\n<p>不能從「先照舊」推定所有復健都不願意，也不能用出現改變語句證明已承諾行動。若討論目標換成「主動提出適合自己的照顧安排」，同一句話的功能可能改變，因此分類前先交代目標。<\/p>\n<p><strong>本題限制：<\/strong> 此處僅依明示文字作教學判讀。真實會談需考量前後文、文化與表達方式；不能以單一句、選項結果或AI分類取代正式評估。<\/p>\n<hr />\n"}], "story": "<p>正在共同討論的改變是「是否改用新的方法，自己完成穿外套的一部分」。患者願意談，目前沒有新的身體問題，也沒有對治療師表達不滿；是否適合實作仍依個別評估。<\/p>\n<p>患者說：「我想自己穿，這樣早上不用一直等人。可是早上趕，現在讓太太幫比較快，這週我想先照舊。」<\/p>\n", "learngoal": "依具體目標辨認Change Talk、Sustain Talk及Discord，選擇回應而不把整個人貼上抗拒標籤", "takeaway": "改變語句與維持現狀語句，要依正在討論的具體目標理解；當對話出現關係摩擦時，也應優先修復合作，而非把人貼上抗拒標籤。", "overallfull": "<p>初始情境優先C；如果新增明確互動壓力，先修復合作。Change Talk與Sustain Talk依具體改變目標理解，Discord關注互動，三者不是互斥的人格分類。<\/p>\n<p>不能從「先照舊」推定所有復健都不願意，也不能用出現改變語句證明已承諾行動。若討論目標換成「主動提出適合自己的照顧安排」，同一句話的功能可能改變，因此分類前先交代目標。<\/p>\n<p><strong>本題限制：<\/strong> 此處僅依明示文字作教學判讀。真實會談需考量前後文、文化與表達方式；不能以單一句、選項結果或AI分類取代正式評估。<\/p>\n<hr />\n"}]};
const family=DATA.core.filter(x=>x.group==='family'),theory=DATA.core.filter(x=>x.group==='therapist'),refs=DATA.core.filter(x=>x.group==='references'),practice=DATA.ex;
const names={intro:'首頁',family:'家屬與照顧者',theory:'專業理論教材',cases:'情境案例練習',skills:'進階技巧練習',references:'參考文獻與聲明'};
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=['intro','family','theory','cases','skills','references'];
let active='intro',font=1,filter='';
function goto(id){active=id;history.replaceState(null,'','#'+id);render();document.getElementById('aside').classList.remove('open');document.getElementById('scrim').classList.remove('open');scrollTo(0,0)}
function button(name,to,cap,desc){return `<button class="tile" data-to="${to}"><span class="small">${cap}</span><strong>${h(name)}</strong><p>${desc||''}</p></button>`}
function listing(arr,cap){return `<div class="tiles">${arr.map((x,i)=>button(x.title,x.key||x.id,cap, x.kind==='case'?'故事情境・選擇回應・解析':x.kind==='skill'?'技巧判斷・選擇比較':'閱讀完整章節')).join('')}</div>`}
function home(){return `<div class="hero"><div class="eyebrow">復健溝通・理論與情境練習</div><h1>聽懂真正的困難，<br>練習更合適的回應</h1><p>從照顧者的日常溝通，到動機式晤談的專業理論；也可以直接進入真實感的故事情境，先想一想自己會怎麼回應。</p></div><section class="sheet"><h2 class="pagetitle">選擇你想開始的地方</h2><div class="tiles">${button('家屬與照顧者','family','生活溝通・六章','面對拒絕、失落、協助分工與照顧負荷')}${button('專業理論教材','theory','進一步理解・十章','MI精神、四項任務、OARS與臨床界線')}${button('情境案例練習','cases','故事 × ABC 回應','先看情境、選擇回應，再閱讀完整解析')}${button('進階技巧練習','skills','溝通技巧的實際判斷','反映、改變語句、資訊交換等')}</div><p class="disclaimer">所有入口均可自由閱讀，不需先選職業身分，也沒有分數或通關壓力。內容用於教學與反思，無法取代個別評估與知情同意。</p></section>`}
function indexPage(kind){const arr=kind==='family'?family:kind==='theory'?theory:kind==='cases'?practice.filter(x=>x.kind==='case'):practice.filter(x=>x.kind==='skill');const intro=kind==='family'?'給家屬與照顧者的實用溝通教材，依生活問題逐章閱讀。':kind==='theory'?'保留完整深入的動機式晤談理論，也歡迎所有有興趣的讀者參考。':kind==='cases'?'從故事中的一句話開始，選擇你會如何回應，再比較不同做法。':'從短對話辨認溝通技巧的用途與限制，不只是背誦專業名詞。';return `<section class="sheet"><span class="kicker">學習入口</span><h1 class="pagetitle">${names[kind]}</h1><p class="practiceIntro">${intro}</p>${listing(arr,kind==='family'?'生活溝通':kind==='theory'?'深入閱讀':kind==='cases'?'情境故事':'技巧練習')}</section>`}
function qaWidget(q,id,n){return `<div class="question">${h(q.title)}</div><div class="prose">${q.stem||''}</div><div class="options" id="opts-${id}-${n}">${q.options.map(o=>`<div class="option-card" data-card="${o.label}"><button class="opt" data-id="${id}" data-num="${n}" data-choice="${o.label}" aria-expanded="false" aria-controls="in-${id}-${n}-${o.label}"><span class="letter">${o.label}</span><span class="optiontext">${o.text}</span><span class="expicon" aria-hidden="true">＋</span></button><div id="in-${id}-${n}-${o.label}" class="inline-feedback prose" hidden>${q.feedback[o.label]}</div></div>`).join('')}</div><p class="pickhelp">選一個回應，解析就會在該張卡片中展開。可以直接點其他選項比較。</p>`}
function practicePage(x){let story=x.story?`<div class="scenario prose"><div class="kicker">故事情境</div>${x.story}</div>`:'';let qa=x.qa.map((q,i)=>`<div class="exercise" style="margin:20px 0 30px">${x.special?`<h3>${h(q.title)}</h3>`:''}${qaWidget(q,x.id,i)}</div>`).join('');let notes=x.note.filter(note=>!note.title.includes('整體建議與帶走的原則')).map(note=>`<details class="details"><summary>${h(note.title.replace('再看一項資訊','如果情境改變了'))}</summary><div class="inner prose">${note.body}</div></details>`).join('');let takeaway=x.takeaway?`<section class="takeaway"><div class="kicker">這個練習想傳達的重點</div><p>${h(x.takeaway)}</p></section>`:'';let supplemental=x.overallfull?`<details class="details"><summary>進一步閱讀：完整統整與應用限制</summary><div class="inner prose">${x.overallfull}</div></details>`:'';return `<section class="sheet"><span class="tag">${x.kind==='case'?'情境案例練習':'進階技巧練習'}</span><h1 class="pagetitle">${h(x.title)}</h1>${x.learngoal?`<p class="practiceIntro">${h(x.learngoal)}。</p>`:''}${story}${x.special?`<div class="scenario prose">${x.shared}</div>`:''}${qa}${takeaway}${notes}${supplemental}<p class="disclaimer">這是教學情境中的建議，實際回應仍需考量當事人的意願、理解、身體狀況與安全。</p><button class="uBtn" data-to="${x.kind==='case'?'cases':'skills'}">← 返回練習目錄</button></section>`}
function theoryPage(x){return `<section class="sheet"><span class="tag">${x.group==='family'?'家屬與照顧者':x.group==='therapist'?'專業理論教材':'參考文獻與聲明'}</span><h1 class="pagetitle">${h(x.title)}</h1><div class="prose">${x.body}</div></section>`}
function refPage(){return `<section class="sheet"><h1 class="pagetitle">參考文獻與使用聲明</h1>${refs.map(x=>`<div class="prose"><h3>${h(x.title)}</h3>${x.body}</div>`).join('')}<p class="disclaimer">設計與整理｜吱吱復健・楊昀霖職能治療師　<a href="https://reliveot.github.io/card/" target="_blank" rel="noopener">更多資源</a></p></section>`}
function render(){let obj=family.concat(theory).find(x=>x.key===active),ex=practice.find(x=>x.id===active);document.getElementById('main').innerHTML=active==='intro'?home():['family','theory','cases','skills'].includes(active)?indexPage(active):active==='references'?refPage():ex?practicePage(ex):obj?theoryPage(obj):home();makeNav();document.querySelectorAll('[data-to]').forEach(n=>n.addEventListener('click',()=>goto(n.dataset.to)));document.querySelectorAll('[data-jump]').forEach(n=>n.addEventListener('click',e=>{e.preventDefault();goto(n.dataset.jump)}));document.querySelectorAll('a[href^="#"]').forEach(n=>n.addEventListener('click',e=>{let id=n.getAttribute('href').slice(1);if(find(id)){e.preventDefault();goto(id)}}));document.querySelectorAll('.opt').forEach(n=>n.addEventListener('click',()=>choose(n.dataset.id,Number(n.dataset.num),n.dataset.choice)));let group=obj?.group==='family'?family:obj?.group==='therapist'?theory:ex?.kind==='case'?practice.filter(x=>x.kind==='case'):ex?.kind==='skill'?practice.filter(x=>x.kind==='skill'):[];if(group.length){let i=group.findIndex(x=>(x.key||x.id)===active);document.getElementById('main').insertAdjacentHTML('beforeend',`<div class="pager"><button ${i===0?'disabled':''} data-prev>← ${i>0?h(group[i-1].title):'上一章'}</button><button ${i===group.length-1?'disabled':''} data-next>${i<group.length-1?h(group[i+1].title):'下一章'} →</button></div>`);document.querySelector('[data-prev]').onclick=()=>i>0&&goto(group[i-1].key||group[i-1].id);document.querySelector('[data-next]').onclick=()=>i<group.length-1&&goto(group[i+1].key||group[i+1].id)}document.getElementById('main').insertAdjacentHTML('beforeend',`<footer class="foot">吱吱復健・楊昀霖職能治療師　｜　<a href="https://reliveot.github.io/card/" rel="noopener" target="_blank">個人資源</a>　｜　教學資料經 AI 協助整理，仍可能有不精確之處，使用前請配合專業評估。</footer>`)}
function find(id){return ids.includes(id)||family.concat(theory).some(x=>x.key===id)||practice.some(x=>x.id===id)}
function choose(id,n,letter){const wrap=document.getElementById(`opts-${id}-${n}`);const active=wrap.querySelector(`.opt[data-choice="${letter}"]`);const was=active.getAttribute('aria-expanded')==='true';wrap.querySelectorAll('.opt').forEach(btn=>{const on=btn===active&&!was;btn.classList.toggle('on',on);btn.setAttribute('aria-expanded',String(on));btn.querySelector('.expicon').textContent=on?'−':'＋';document.getElementById(`in-${id}-${n}-${btn.dataset.choice}`).hidden=!on;btn.closest('.option-card').classList.toggle('on',on)})}
function makeNav(){let blocks=[['主要入口',ids],['家屬教材',family],['專業理論',theory],['情境案例',practice.filter(x=>x.kind==='case')],['進階技巧',practice.filter(x=>x.kind==='skill')]];document.getElementById('nav').innerHTML=blocks.map(([lab,items])=>{let links=items.map(v=>{let key=typeof v==='string'?v:v.key||v.id,title=typeof v==='string'?names[v]:v.title;return {key,title}}).filter(v=>!filter||v.title.toLowerCase().includes(filter));return links.length?`<div class="groupcap">${lab}</div>`+links.map(v=>`<button class="nav ${active===v.key?'active':''}" data-nav="${v.key}">${h(v.title)}</button>`).join(''):''}).join('');document.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>goto(n.dataset.nav))}
document.getElementById('search').addEventListener('input',e=>{filter=e.target.value.toLowerCase().trim();makeNav()});document.getElementById('menu').onclick=()=>{document.getElementById('aside').classList.toggle('open');document.getElementById('scrim').classList.toggle('open')};document.getElementById('scrim').onclick=()=>document.getElementById('menu').click();document.getElementById('fontminus').onclick=()=>{font=Math.max(.9,font-.1);document.documentElement.style.fontSize=(16*font)+'px'};document.getElementById('fontplus').onclick=()=>{font=Math.min(1.35,font+.1);document.documentElement.style.fontSize=(16*font)+'px'};window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(id!==active&&find(id))goto(id)});goto(find(location.hash.slice(1))?location.hash.slice(1):'intro');
</script></body></html>
